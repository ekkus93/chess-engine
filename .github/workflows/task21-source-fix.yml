name: Task 21 Source Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-source-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Integrate evaluator structure and repair test import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          weights_path = Path('crates/chess-search/src/weights.rs')
          weights = weights_path.read_text()
          old_import = 'EvaluationWeightSet, EvaluationWeights, StructuralWeightField, WeightValidationError,'
          new_import = 'EvaluationWeightSet, EvaluationWeights, PhasedWeight, StructuralWeightField, WeightValidationError,'
          if weights.count(old_import) != 1:
              raise SystemExit('expected unique weights test import sequence not found')
          weights_path.write_text(weights.replace(old_import, new_import, 1))

          evaluation_path = Path('crates/chess-search/src/evaluation.rs')
          evaluation = evaluation_path.read_text()

          old_header = 'use crate::{EvaluationWeights, PhasedWeight, Score};\n\nconst MAX_PHASE: u8 = 24;\n'
          new_header = 'use crate::{EvaluationWeights, PhasedWeight, Score, EVALUATION_STRUCTURE};\n'
          if evaluation.count(old_header) != 1:
              raise SystemExit('expected evaluation header not found')
          evaluation = evaluation.replace(old_header, new_header, 1)

          blend_start = '    fn blend(self, phase: u8) -> i32 {\n        let middlegame = i32::from(phase);'
          blend_replacement = '    fn blend(self, phase: u8) -> i32 {\n        let maximum_phase = EVALUATION_STRUCTURE.maximum_phase;\n        let middlegame = i32::from(phase);'
          if evaluation.count(blend_start) != 1:
              raise SystemExit('expected blend start not found')
          evaluation = evaluation.replace(blend_start, blend_replacement, 1)
          if evaluation.count('MAX_PHASE - phase') != 1:
              raise SystemExit('expected MAX_PHASE subtraction not found')
          evaluation = evaluation.replace('MAX_PHASE - phase', 'maximum_phase - phase', 1)
          if evaluation.count('/ i32::from(MAX_PHASE)') != 1:
              raise SystemExit('expected MAX_PHASE denominator not found')
          evaluation = evaluation.replace('/ i32::from(MAX_PHASE)', '/ i32::from(maximum_phase)', 1)

          start = evaluation.index('fn game_phase(position: &Position) -> u8 {')
          end = evaluation.index('\nfn mobility_attacks(', start)
          new_phase = (
              'fn game_phase(position: &Position) -> u8 {\n'
              '    let mut phase = 0_u32;\n'
              '    for color in [Color::White, Color::Black] {\n'
              '        for kind in PieceKind::ALL {\n'
              '            phase += position.piece_bitboard(color, kind).count()\n'
              '                * u32::from(EVALUATION_STRUCTURE.phase_units[kind.index()]);\n'
              '        }\n'
              '    }\n'
              '    u8::try_from(phase.min(u32::from(EVALUATION_STRUCTURE.maximum_phase)))\n'
              '        .expect("phase is clamped to the structural maximum")\n'
              '}\n'
          )
          evaluation_path.write_text(evaluation[:start] + new_phase + evaluation[end:])
          PY
          cargo fmt --all

      - name: Commit Task 21 source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/weights.rs crates/chess-search/src/evaluation.rs
          git commit -m 'task 21.1: integrate structural evaluator contract'
          git push origin HEAD:master
