name: Task 21 Source Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-source-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Integrate evaluator structure and repair test import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          weights_path = Path('crates/chess-search/src/weights.rs')
          weights = weights_path.read_text()
          old_import = 'EvaluationWeightSet, EvaluationWeights, StructuralWeightField, WeightValidationError,'
          new_import = 'EvaluationWeightSet, EvaluationWeights, PhasedWeight, StructuralWeightField, WeightValidationError,'
          if weights.count(old_import) != 1:
              raise SystemExit('expected unique weights test import sequence not found')
          weights_path.write_text(weights.replace(old_import, new_import, 1))

          evaluation_path = Path('crates/chess-search/src/evaluation.rs')
          evaluation = evaluation_path.read_text()

          old_header = 'use crate::{EvaluationWeights, PhasedWeight, Score};\n\nconst MAX_PHASE: u8 = 24;\n'
          new_header = 'use crate::{EvaluationWeights, PhasedWeight, Score, EVALUATION_STRUCTURE};\n'
          if evaluation.count(old_header) != 1:
              raise SystemExit('expected evaluation header not found')
          evaluation = evaluation.replace(old_header, new_header, 1)

          old_blend = dedent('''\
              fn blend(self, phase: u8) -> i32 {
                  let middlegame = i32::from(phase);
                  let endgame = i32::from(MAX_PHASE - phase);
                  (self.middlegame * middlegame + self.endgame * endgame) / i32::from(MAX_PHASE)
              }
          ''')
          new_blend = dedent('''\
              fn blend(self, phase: u8) -> i32 {
                  let maximum_phase = EVALUATION_STRUCTURE.maximum_phase;
                  let middlegame = i32::from(phase);
                  let endgame = i32::from(maximum_phase - phase);
                  (self.middlegame * middlegame + self.endgame * endgame)
                      / i32::from(maximum_phase)
              }
          ''')
          if evaluation.count(old_blend) != 1:
              raise SystemExit('expected tapered blend block not found')
          evaluation = evaluation.replace(old_blend, new_blend, 1)

          old_phase = dedent('''\
              fn game_phase(position: &Position) -> u8 {
                  let mut phase = 0_u32;
                  for color in [Color::White, Color::Black] {
                      phase += position.piece_bitboard(color, PieceKind::Knight).count();
                      phase += position.piece_bitboard(color, PieceKind::Bishop).count();
                      phase += 2 * position.piece_bitboard(color, PieceKind::Rook).count();
                      phase += 4 * position.piece_bitboard(color, PieceKind::Queen).count();
                  }
                  u8::try_from(phase.min(u32::from(MAX_PHASE))).expect("phase is clamped below 25")
              }
          ''')
          new_phase = dedent('''\
              fn game_phase(position: &Position) -> u8 {
                  let mut phase = 0_u32;
                  for color in [Color::White, Color::Black] {
                      for kind in PieceKind::ALL {
                          phase += position.piece_bitboard(color, kind).count()
                              * u32::from(EVALUATION_STRUCTURE.phase_units[kind.index()]);
                      }
                  }
                  u8::try_from(phase.min(u32::from(EVALUATION_STRUCTURE.maximum_phase)))
                      .expect("phase is clamped to the structural maximum")
              }
          ''')
          if evaluation.count(old_phase) != 1:
              raise SystemExit('expected game phase block not found')
          evaluation_path.write_text(evaluation.replace(old_phase, new_phase, 1))
          PY
          cargo fmt --all

      - name: Commit Task 21 source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/weights.rs crates/chess-search/src/evaluation.rs
          git commit -m 'task 21.1: integrate structural evaluator contract'
          git push origin HEAD:master
