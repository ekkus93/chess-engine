name: Task 24 CI Observer

on:
  workflow_run:
    workflows:
      - Rust
      - Android
      - Robustness
      - Performance
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  record:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-24.04
    steps:
      - name: Record exact validation result
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const body = [
              `Task 24 validation: **${run.name}**`,
              `- head: \`${run.head_sha}\``,
              `- run: ${run.html_url}`,
              `- id: \`${run.id}\``,
              `- status: \`${run.status}\``,
              `- conclusion: \`${run.conclusion}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body,
            });
