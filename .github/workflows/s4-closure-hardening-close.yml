name: S4 Closure Hardening Close

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/s4-closure-hardening-close.yml

permissions:
  contents: write

concurrency:
  group: s4-closure-hardening-close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply H7 closure candidate
        run: python3 .github/s4_closure_hardening_close.py
      - name: Remove temporary controls before validation
        run: |
          rm .github/s4_closure_hardening_close.py
          rm .github/workflows/s4-closure-hardening-close.yml
      - name: Verify audit syntax
        run: |
          bash -n scripts/task_post_port_review_fix_audit.sh
          bash -n scripts/task_s3_evaluation_strength_audit.sh
          bash -n scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict tuning Clippy
        run: cargo clippy --locked -p chess-tune -p chess-tools --all-targets --all-features -- -D warnings
      - name: Run tuning regressions
        run: cargo test --locked -p chess-tune --all-targets --all-features
      - name: Run tooling regressions
        run: cargo test --locked -p chess-tools --all-targets --all-features
      - name: Run authority audit
        run: bash scripts/task_post_port_review_fix_audit.sh
      - name: Run S4 closure audit
        run: bash scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Verify clean diff
        run: git diff --check
      - name: Publish H7 closure candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Close S4 hardening authority pending final validation"
          git push origin HEAD:master
