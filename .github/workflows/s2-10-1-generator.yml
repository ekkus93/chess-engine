name: S2-10.1 futility candidate generator

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-10-1-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect generator payload
        id: payload
        shell: bash
        run: |
          if [[ -f .github/s2_10_1_generator.py ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install stable Rust
        if: steps.payload.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate isolated candidate
        if: steps.payload.outputs.present == 'true'
        run: python3 .github/s2_10_1_generator.py
      - name: Format generated Rust
        if: steps.payload.outputs.present == 'true'
        run: cargo fmt --all
      - name: Validate generated candidate
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo check --locked -p chess-search --all-targets --all-features
          cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-targets --all-features
      - name: Publish generated candidate
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates .github/s2_10_1_generator.py
          git diff --cached --check
          git commit -m "search: add isolated S2-10.1 futility candidate"
          git push origin HEAD:master
