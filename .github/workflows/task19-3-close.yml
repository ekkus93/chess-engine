name: Task 19.3 Close

on:
  push:
    branches:
      - task19-3-tracker-closure

permissions:
  contents: write

concurrency:
  group: task19-3-close-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close:
    name: Close Task 19.3 trackers
    if: github.repository == 'ekkus93/chess-engine' && github.ref == 'refs/heads/task19-3-tracker-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task19-3-tracker-closure
          fetch-depth: 0

      - name: Apply guarded closure
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/task19_3_close.py
          git merge-base --is-ancestor 82b5100f501fe4e4a845d5fb3bdbb1c8fe7d34ef HEAD
          python3 scripts/task19_3_close.py
          git rm scripts/task19_3_close.py .github/workflows/task19-3-close.yml

      - name: Verify and commit closure
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '- [x] deterministic highest weight;' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] weighted random;' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] explicit local RNG seed;' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] legal-move validation before return.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] 19.3 Policies.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] 19.4 Integration.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] 19.5 Tests.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] Task 19 gate.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F '**Current phase:** Task 19.3 opening-book selection policies complete; Task 19.4 adapter integration is next' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F '## Completion evidence' docs/RUST_OPENING_BOOK_SELECTION.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_OPENING_BOOK_SELECTION.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          git diff --cached --check
          git commit -m "docs: close Task 19.3"
          git push origin HEAD:task19-3-tracker-closure
