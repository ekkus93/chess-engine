name: Temporary S2-7 generated-output cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-7-generated-output-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-7-generated-output-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove committed generated evidence and add ignore rules
        run: python3 .github/s2_7_generated_output_cleanup.py

      - name: Commit cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove generated S2-7 evidence outputs"
          git push origin HEAD:master
