name: S4 Phase 8 Candidate Smoke Stage

on:
  push:
    branches: [master]
    paths:
      - .github/s4_phase8.py
      - .github/s4_phase8_repair.py
      - .github/workflows/s4-phase8-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s4-phase8-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair generic smoke patch
        run: python3 .github/s4_phase8_repair.py
      - name: Apply generic smoke patch
        run: python3 .github/s4_phase8.py
      - name: Format staged source
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --locked -p chess-tools --all-targets --all-features -- -D warnings
      - name: Run engine-variant and tuning regressions
        run: cargo test --locked -p chess-tools --all-targets --all-features
      - name: Verify S4 audit syntax
        run: bash -n scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated smoke tool
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add crates/chess-tools/src/bin/s4_candidate_smoke.rs scripts/task_s4_evaluation_tuning_calibration_audit.sh
          git commit -m "feat: add inactive S4 candidate strength smoke"
          git restore .github/s4_phase8.py
          git status --porcelain
          test -z "$(git status --porcelain)"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
