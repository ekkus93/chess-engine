name: Rust TUI coverage checklist validation

on:
  push:
    branches:
      - master
    paths:
      - .github/tui_coverage_checklist_patch.py
      - .github/workflows/tui-coverage-checklist-validation.yml

permissions:
  contents: write

concurrency:
  group: rust-tui-coverage-checklist-validation
  cancel-in-progress: true

jobs:
  validate-and-publish-tests:
    name: Validate final checklist tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust coverage toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Rust 1.75 MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Apply checklist test patch
        run: python3 .github/tui_coverage_checklist_patch.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Focused TUI check
        run: cargo check --locked -p chess-tui --all-targets --all-features

      - name: Focused strict TUI Clippy
        run: cargo clippy --locked -p chess-tui --all-targets --all-features -- -D warnings

      - name: Focused TUI tests
        run: cargo test --locked -p chess-tui --all-targets --all-features

      - name: Explicit Rust 1.75 TUI check
        run: cargo +1.75.0 check --locked -p chess-tui --all-targets --all-features

      - name: Focused llvm-cov reports
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tui_coverage.sh clean
          bash scripts/tui_coverage.sh summary
          bash scripts/tui_coverage.sh json
          bash scripts/tui_coverage.sh lcov
          bash scripts/tui_coverage.sh html
          test -s target/chess-tui-coverage-summary.json
          test -s target/chess-tui-lcov.info
          test -s target/llvm-cov/html/index.html

      - name: Verify no engine production source changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD -- crates/chess-core crates/chess-search crates/chess-book crates/chess-uci | grep -q .; then
            echo '::error::Checklist tests modified authoritative engine/search source.'
            exit 1
          fi
          if git diff --name-only HEAD -- crates/chess-tui/src/app.rs crates/chess-tui/src/ui.rs crates/chess-tui/src/worker.rs crates/chess-tui/src/render.rs crates/chess-tui/src/save.rs crates/chess-tui/src/main.rs | grep -q .; then
            echo '::error::Final checklist batch unexpectedly modified TUI production source.'
            git diff --name-only HEAD -- crates/chess-tui/src
            exit 1
          fi

      - name: Run TODO authority audit
        run: bash scripts/task_post_port_review_fix_audit.sh

      - name: Publish validated test-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tui/src/app/hardening_tests.rs crates/chess-tui/src/ui/hardening_tests.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::No checklist test changes were produced.'
            exit 1
          fi
          git commit -m 'Complete Rust TUI checklist coverage tests'
          git push origin HEAD:master
