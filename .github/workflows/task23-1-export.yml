name: Task 23.1 formatter

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task23-1-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Task 23.1 tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-core/tests/property_invariants.rs crates/chess-search/tests/property_search.rs
          if git diff --cached --quiet; then
            echo "Task 23.1 tests already formatted."
            exit 0
          fi
          git diff --cached --check
          git commit -m "style: format Task 23.1 properties"
          git push origin HEAD:rust-engine
