name: S3 Phase 2 Stage

on:
  push:
    branches:
      - master
    paths:
      - .github/s3_phase2.py
      - .github/s3_phase2_fix.py
      - .github/workflows/s3-phase2-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s3-phase2-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply S3 phase 2 changes
        run: |
          python3 .github/s3_phase2_fix.py
          python3 .github/s3_phase2.py

      - name: Format generated Rust changes
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run chess-tune tests
        run: cargo test --locked -p chess-tune

      - name: Run S3 tooling tests
        run: |
          cargo test --locked -p chess-tools 's3::'

      - name: Preserve self-play and tuning regressions
        run: |
          cargo test --locked -p chess-tools 'tuning::'

      - name: Check permanent S3 audit syntax
        run: bash -n scripts/task_s3_evaluation_strength_audit.sh

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit validated phase 2 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            crates/chess-tune/src/lib.rs \
            crates/chess-tune/src/mask.rs \
            crates/chess-tune/src/optimizer.rs \
            crates/chess-tools/src/lib.rs \
            crates/chess-tools/src/s3.rs \
            docs/RUST_CHESS_ENGINE_S3_PIPELINE.md
          git diff --cached --exit-code && {
            echo "No S3 phase 2 source changes to commit"
            exit 0
          }
          git commit -m "feat: add S3 dataset provenance and tuning masks"
          git push origin HEAD:master
