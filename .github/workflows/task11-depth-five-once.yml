name: Task 11 depth-five gate once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task11-depth-five-once.yml

permissions:
  actions: read
  contents: write

jobs:
  depth-five:
    name: Task 11 authoritative depth-five perft
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-task11-depth-five

      - name: Run all six depth-five fixtures and record evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Task 11 authoritative depth-five perft") | .id')"
          test -n "$job_id"
          {
            echo "validated_sha=$(git rev-parse HEAD)"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job_id=$job_id"
            echo "aggregate_depth_five_leaves=469080960"
            cargo test --locked -p chess-core --release authoritative_perft_depth_five -- --ignored --exact
          } 2>&1 | tee docs/TASK11_DEPTH5_TEMP.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TASK11_DEPTH5_TEMP.txt
          git commit -m "test(core): record exact Task 11 depth-five evidence"
          git push origin HEAD:rust-engine
