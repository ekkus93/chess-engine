name: Task 27 tracker closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task27-tracker-closure.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Task 27 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/task27-close.py
          sed -i 's/[[:space:]]\+$//' \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_PORT_IMPLEMENTATION_REPORT.md \
            memory.md
          git rm .github/task27-close.py .github/workflows/task27-tracker-closure.yml
          git diff --check
          bash scripts/task_27_full_port_audit.sh
      - name: Commit documentation-only closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_PORT_IMPLEMENTATION_REPORT.md \
            memory.md
          git commit -m 'docs: close Task 27 full port signoff'
          git push origin HEAD:master
