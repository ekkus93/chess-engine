name: Task 21.4 Validation

on:
  push:
    branches:
      - rust-engine

permissions:
  contents: write

concurrency:
  group: task21-4-validation-rust-engine
  cancel-in-progress: false

jobs:
  rust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and persist canonical Rust style
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/chess-tools/src/tuning.rs crates/chess-tools/src/tuning/report.rs
            git commit -m 'style: format Task 21.4 reports'
            git push origin HEAD:rust-engine
          fi

      - name: Locked workspace check
        run: cargo check --workspace --all-targets --locked

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Complete Rust tests
        run: cargo test --workspace --all-features --locked

      - name: Warning-free rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
