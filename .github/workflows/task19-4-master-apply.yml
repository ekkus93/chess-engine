name: Task 19.4 Trusted Apply

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: task19-4-trusted-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_USER: ${{ github.event.pull_request.user.login }}
      PR_HEAD: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify trusted trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_TITLE" = '[run-task19-4-apply-pr]'
          test "$PR_USER" = 'ekkus93'
          test "$PR_HEAD" = 'task19-4-trusted-trigger'
          test "$PR_HEAD_REPO" = 'ekkus93/chess-engine'
          test "$REPOSITORY" = 'ekkus93/chess-engine'

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: trigger

      - uses: actions/checkout@v4
        with:
          ref: task19-4-adapter-integration
          fetch-depth: 0
          path: work

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply and validate Task 19.4
        shell: bash
        run: bash trigger/.github/task19_4_master_apply.sh "$GITHUB_WORKSPACE/work" "$GITHUB_WORKSPACE/trigger"
