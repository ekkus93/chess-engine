name: Task 21 Clippy Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-clippy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Group training provenance inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/chess-tune/src/lib.rs')
          source = path.read_text()

          marker = '/// Complete reproducibility metadata for a tuned weight artifact.\n'
          if source.count(marker) != 1:
              raise SystemExit('training metadata marker is not unique')
          grouped_types = '''/// Provenance for the optimizer invocation that produced a candidate.\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct TrainingRunProvenance {\n    /// Stable identifier for the trainer implementation/configuration.\n    pub trainer_identifier: u64,\n    /// Exact 20-byte source commit used by the trainer.\n    pub source_commit: [u8; 20],\n    /// Explicit deterministic training seed.\n    pub random_seed: u64,\n    /// Number of completed optimizer iterations.\n    pub completed_iterations: u64,\n    /// Artifact creation time as Unix seconds, supplied explicitly by the caller.\n    pub generated_at_unix_seconds: u64,\n}\n\nimpl TrainingRunProvenance {\n    /// Constructs explicit optimizer provenance.\n    #[must_use]\n    pub const fn new(\n        trainer_identifier: u64,\n        source_commit: [u8; 20],\n        random_seed: u64,\n        completed_iterations: u64,\n        generated_at_unix_seconds: u64,\n    ) -> Self {\n        Self {\n            trainer_identifier,\n            source_commit,\n            random_seed,\n            completed_iterations,\n            generated_at_unix_seconds,\n        }\n    }\n}\n\n/// Provenance and split sizes for the source dataset.\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct TrainingDatasetProvenance {\n    /// Source dataset schema version.\n    pub schema_version: u16,\n    /// Canonical source dataset checksum.\n    pub checksum: u64,\n    /// Number of training positions.\n    pub training_positions: u64,\n    /// Number of separately held-out validation positions.\n    pub validation_positions: u64,\n}\n\nimpl TrainingDatasetProvenance {\n    /// Constructs explicit source-dataset provenance.\n    #[must_use]\n    pub const fn new(\n        schema_version: u16,\n        checksum: u64,\n        training_positions: u64,\n        validation_positions: u64,\n    ) -> Self {\n        Self {\n            schema_version,\n            checksum,\n            training_positions,\n            validation_positions,\n        }\n    }\n}\n\n'''
          source = source.replace(marker, grouped_types + marker, 1)

          old_constructor = '''    /// Constructs current-schema metadata from explicit provenance.\n    #[must_use]\n    pub const fn new(\n        trainer_identifier: u64,\n        source_commit: [u8; 20],\n        dataset_schema_version: u16,\n        dataset_checksum: u64,\n        training_positions: u64,\n        validation_positions: u64,\n        random_seed: u64,\n        completed_iterations: u64,\n        generated_at_unix_seconds: u64,\n    ) -> Self {\n        Self {\n            schema_version: TRAINING_METADATA_SCHEMA_VERSION,\n            trainer_identifier,\n            source_commit,\n            dataset_schema_version,\n            dataset_checksum,\n            training_positions,\n            validation_positions,\n            random_seed,\n            completed_iterations,\n            generated_at_unix_seconds,\n        }\n    }\n'''
          new_constructor = '''    /// Constructs current-schema metadata from grouped explicit provenance.\n    #[must_use]\n    pub const fn new(\n        run: TrainingRunProvenance,\n        dataset: TrainingDatasetProvenance,\n    ) -> Self {\n        Self {\n            schema_version: TRAINING_METADATA_SCHEMA_VERSION,\n            trainer_identifier: run.trainer_identifier,\n            source_commit: run.source_commit,\n            dataset_schema_version: dataset.schema_version,\n            dataset_checksum: dataset.checksum,\n            training_positions: dataset.training_positions,\n            validation_positions: dataset.validation_positions,\n            random_seed: run.random_seed,\n            completed_iterations: run.completed_iterations,\n            generated_at_unix_seconds: run.generated_at_unix_seconds,\n        }\n    }\n'''
          if source.count(old_constructor) != 1:
              raise SystemExit('old TrainingMetadata constructor not found exactly once')
          source = source.replace(old_constructor, new_constructor, 1)

          old_test_import = '''        TrainingMetadata, TrainingMetadataError, TunableParameter, TUNABLE_PARAMETER_COUNT,\n'''
          new_test_import = '''        TrainingDatasetProvenance, TrainingMetadata, TrainingMetadataError,\n        TrainingRunProvenance, TunableParameter, TUNABLE_PARAMETER_COUNT,\n'''
          if source.count(old_test_import) != 1:
              raise SystemExit('test import sequence not found exactly once')
          source = source.replace(old_test_import, new_test_import, 1)

          old_test_constructor = '''        TrainingMetadata::new(\n            0x5452_4149_4e45_5231,\n            [0x11; 20],\n            1,\n            0x1122_3344_5566_7788,\n            8_000,\n            2_000,\n            0xC0FF_EE,\n            64,\n            1_785_820_000,\n        )\n'''
          new_test_constructor = '''        TrainingMetadata::new(\n            TrainingRunProvenance::new(\n                0x5452_4149_4e45_5231,\n                [0x11; 20],\n                0xC0FF_EE,\n                64,\n                1_785_820_000,\n            ),\n            TrainingDatasetProvenance::new(\n                1,\n                0x1122_3344_5566_7788,\n                8_000,\n                2_000,\n            ),\n        )\n'''
          if source.count(old_test_constructor) != 1:
              raise SystemExit('test metadata constructor not found exactly once')
          path.write_text(source.replace(old_test_constructor, new_test_constructor, 1))
          PY

          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search -p chess-tune --all-features

      - name: Commit grouped provenance API
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tune/src/lib.rs
          git commit -m 'task 21.1: group training provenance metadata'
          git push origin HEAD:master
