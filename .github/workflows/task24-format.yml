name: Task 24 Format Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task24-format.yml

permissions:
  contents: write
  issues: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt result
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/chess-tools/src/bin/performance.rs
          git diff --cached --check
          git commit -m 'style: format Task 24 benchmark harness'
          git push origin HEAD:master

      - name: Record exact helper result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Task 24 rustfmt helper',
              `- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- id: \`${context.runId}\``,
              `- job status: \`${{ job.status }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body,
            });
