name: Implement Rust review fixes v2 once

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: rust-review-fix-implement-v2-once
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.issue.title == '[rust-review-fix-implement-v2]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
      PATCH_SOURCE_COMMIT: ed3c8ac74d30298388d99422b7d046fc20191d28
    steps:
      - name: Check out control history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: control

      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
          path: engine

      - name: Recover and correct temporary patch scripts
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          git show "${PATCH_SOURCE_COMMIT}:.github/review_fix_core_patch.py" > /tmp/review_fix_core_patch.py
          git show "${PATCH_SOURCE_COMMIT}:.github/review_fix_tools_docs_patch.py" > /tmp/review_fix_tools_docs_patch.py
          git show "${PATCH_SOURCE_COMMIT}:.github/review_fix_trackers_patch.py" > /tmp/review_fix_trackers_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/review_fix_core_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '    const fn matches(self, position: &Position) -> bool {'
          new = '    fn matches(self, position: &Position) -> bool {'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one LegalMoveOrigin::matches declaration')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: rust-engine-review-fix

      - name: Install Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements/oracle.txt

      - name: Apply source, tooling, docs, and tracker patches
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/review_fix_core_patch.py
          python /tmp/review_fix_tools_docs_patch.py
          python /tmp/review_fix_trackers_patch.py

      - name: Format and reject suppression
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if grep --recursive --line-number --include='*.rs' --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify lockfile and metadata
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
          cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Check workspace
        working-directory: engine
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        working-directory: engine
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: engine
        run: cargo test --locked --workspace --all-features

      - name: Run authoritative release perft
        working-directory: engine
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        working-directory: engine
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        working-directory: engine
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        working-directory: engine
        run: cargo build --locked --workspace --all-features --release

      - name: Install pinned differential oracle
        working-directory: engine
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        working-directory: engine
        run: >-
          python scripts/differential_oracle.py
          --binary target/release/chess-tools
          --corpus fixtures/differential_corpus.tsv
          --games 12
          --plies 48
          --seed 0xC0FFEE

      - name: Commit implementation candidate
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add crates docs
          git diff --cached --check
          git commit -m 'fix(rust): implement pre-Task-13 review fixes'
          git push origin HEAD:rust-engine
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"

      - name: Dispatch permanent CI
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine

      - name: Report implementation result
        if: always()
        shell: bash
        run: |
          set +e
          engine_sha="$(git -C engine rev-parse HEAD 2>/dev/null || echo unknown)"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="Review-fix v2 result: ${{ job.status }}. Control run: ${{ github.run_id }}. Candidate SHA: ${CANDIDATE_SHA:-not-created}. Engine checkout SHA: ${engine_sha}."

      - name: Remove temporary workflow
        if: always()
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git rebase origin/master
          git rm -f .github/workflows/review-fix-implement-v2-once.yml
          git commit -m 'ci: remove corrected Rust review-fix implementer'
          git push origin HEAD:master

      - name: Close trigger issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}" \
            -f state=closed \
            -f state_reason=completed
