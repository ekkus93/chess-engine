name: JNI diagnostic hardening one-shot

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/jni-error-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: jni-error-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded staging tree
        shell: bash
        run: |
          set -euo pipefail
          base=7089d71671469d50305d9c289c55244b51984b4a
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base" HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/jni_error_hardening_once.py"
          test "${changed[1]}" = ".github/workflows/jni-error-hardening-once.yml"

      - name: Apply fail-closed JNI diagnostics
        run: python3 .github/jni_error_hardening_once.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate JNI hardening
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check -p chess-jni --all-targets --locked
          cargo clippy -p chess-jni --all-targets --locked -- -D warnings
          cargo test -p chess-jni --all-targets --locked
          ! grep -Fq 'exception_check().unwrap_or(false)' crates/chess-jni/src/bridge.rs
          ! grep -Fq 'buffer_bytes(&buffer).unwrap_or_default()' crates/chess-jni/src/bridge.rs
          ! grep -Fq 'String::from_utf8_lossy(&bytes)' crates/chess-jni/src/bridge.rs
          grep -Fq 'last_error_diagnostics_reject_empty_and_invalid_utf8' crates/chess-jni/src/bridge.rs
          grep -Fq 'malformed_native_buffers_are_rejected_without_dereference' crates/chess-jni/src/bridge.rs

      - name: Commit exact JNI hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add crates/chess-jni/src/bridge.rs
          test "$(git diff --cached --name-only)" = "crates/chess-jni/src/bridge.rs"
          git diff --cached --check
          git commit -m "fix: make JNI error diagnostics fail closed" -m "Reject malformed, empty, and invalid-UTF8 native error diagnostics explicitly and stop treating JNI exception-check failures as no pending exception. Preserve original C ABI result codes and add focused regressions."
          git push origin HEAD:master
