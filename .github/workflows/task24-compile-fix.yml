name: Task 24 Compile Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task24-compile-fix.yml

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Correct benchmark fixture mutability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/chess-tools/src/bin/performance.rs')
          text = path.read_text()
          old = '''fn legal_moves_summary(samples: usize, scale: u64) -> Result<BenchmarkSummary, String> {
              let positions = parse_positions()?;'''
          new = '''fn legal_moves_summary(samples: usize, scale: u64) -> Result<BenchmarkSummary, String> {
              let mut positions = parse_positions()?;'''
          if old not in text:
              raise SystemExit('legal_moves_summary fixture declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/chess-tools/src/bin/performance.rs
          git diff --cached --check
          git commit -m 'fix: make legal move benchmark fixtures mutable'
          git push origin HEAD:master

      - name: Record exact helper result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Task 24 compile-fix helper',
              `- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- id: \`${context.runId}\``,
              `- job status: \`${{ job.status }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body,
            });
