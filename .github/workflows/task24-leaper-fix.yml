name: Task 24 Leaper Benchmark Fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task24-leaper-fix.yml

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Prevent leaper benchmark constant folding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/chess-tools/src/bin/performance.rs')
          text = path.read_text()
          old = '''fn leaper_summary(samples: usize, scale: u64) -> Result<BenchmarkSummary, String> {
              run_benchmark("attacks.leaper_sweep", samples, 10_000 * scale, |_| {
                  let mut checksum = 0_u64;
                  for index in 0..Square::COUNT {
                      let current = square(index);
                      checksum ^= pawn_attacks(Color::White, current).bits().rotate_left(3);
                      checksum ^= pawn_attacks(Color::Black, current).bits().rotate_left(7);
                      checksum ^= knight_attacks(current).bits().rotate_left(13);
                      checksum ^= king_attacks(current).bits().rotate_left(17);
                  }
                  Ok(checksum)
              })
          }'''
          new = '''fn leaper_summary(samples: usize, scale: u64) -> Result<BenchmarkSummary, String> {
              run_benchmark("attacks.leaper_lookup", samples, 1_000_000 * scale, |iteration| {
                  let current = square(black_box((iteration & 63) as u8));
                  let color = if iteration & 64 == 0 {
                      Color::White
                  } else {
                      Color::Black
                  };
                  Ok(pawn_attacks(color, current).bits().rotate_left(3)
                      ^ knight_attacks(current).bits().rotate_left(13)
                      ^ king_attacks(current).bits().rotate_left(17))
              })
          }'''
          if old not in text:
              raise SystemExit('leaper benchmark block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/chess-tools/src/bin/performance.rs
          git diff --cached --check
          git commit -m 'fix: prevent leaper benchmark constant folding'
          git push origin HEAD:master

      - name: Record exact helper result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Task 24 leaper-benchmark helper',
              `- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- id: \`${context.runId}\``,
              `- job status: \`${{ job.status }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body,
            });
