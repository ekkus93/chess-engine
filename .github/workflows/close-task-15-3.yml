name: Close Task 15.3

on:
  push:
    branches:
      - rust-engine
    paths:
      - ".github/workflows/close-task-15-3.yml"

permissions:
  contents: write

concurrency:
  group: close-task-15-3
  cancel-in-progress: false

jobs:
  close:
    name: Close Task 15.3 trackers and controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Patch authoritative trackers
        run: python3 scripts/close_task_15_3.py "$GITHUB_WORKSPACE"

      - name: Remove temporary closure controls
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/close-task-15-3.yml \
            scripts/close_task_15_3.py

      - name: Commit clean Task 15.3 closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git diff --cached --check
          git commit -m "docs: close Task 15.3 mate normalization"
          git push origin HEAD:rust-engine
