name: Task 24 Lockfile Refresh

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task24-lockfile.yml

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current.'
          else
            git commit -m 'build: refresh lockfile for Task 24 harness'
            git push origin HEAD:master
          fi

      - name: Record helper result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Task 24 lockfile helper',
              `- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- id: \`${context.runId}\``,
              `- job status: \`${{ job.status }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body,
            });
