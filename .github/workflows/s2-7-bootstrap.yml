name: Temporary S2-7 evidence bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-7-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-7-bootstrap
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate evidence harness
        run: python3 .github/s2_7_evidence_bootstrap.py

      - name: Format, audit, lint, and test
        run: |
          cargo fmt --all
          bash scripts/task_s2_7_pvs_audit.sh
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --test s2_7_pvs
          cargo test --locked -p chess-tools --bin s2_7_pvs

      - name: Build and exercise release evidence tool
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p chess-tools --bin s2_7_pvs
          build_identity="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          export S2_7_SOURCE_SHA="${GITHUB_SHA}"
          export S2_7_BUILD_IDENTITY="${build_identity}"
          target/release/s2_7_pvs deterministic s2-7-deterministic-a
          target/release/s2_7_pvs deterministic s2-7-deterministic-b
          diff -ru s2-7-deterministic-a s2-7-deterministic-b
          target/release/s2_7_pvs clock s2-7-clock
          target/release/s2_7_pvs benchmark 2 | tee s2-7-bootstrap-benchmark.tsv

      - name: Commit validated evidence harness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(search): add S2-7 PVS evidence harness"
          git push origin HEAD:master
