name: Temporary S2-7 implementation bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-7-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-7-bootstrap
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply fail-closed S2-7 patch
        run: |
          python3 .github/s2_7_bootstrap.py
          python3 .github/s2_7_repair.py
          python3 .github/s2_7_policy_test_repair.py

      - name: Format and audit
        run: |
          cargo fmt --all
          bash scripts/task_s2_7_pvs_audit.sh

      - name: Strict lint and focused tests
        run: |
          cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --test s2_7_pvs
          cargo test --locked -p chess-search --all-targets --all-features

      - name: Commit implementation and remove bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(search): add inactive S2-7 PVS candidate"
          git push origin HEAD:master
