name: S2-14 one-shot closure

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/s2-14-close-once.yml'

permissions:
  contents: write

concurrency:
  group: s2-14-close-once
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify bounded staging history
        shell: bash
        run: |
          set -euo pipefail
          source_sha=21406b5e92b6bd42a3a902591dddae22c9b3f16f
          git merge-base --is-ancestor "$source_sha" HEAD
          mapfile -t changed < <(git diff --name-only "$source_sha" HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/s2_14_close_once.py"
          test "${changed[1]}" = ".github/workflows/s2-14-close-once.yml"

      - name: Prepare S2-14 rejected-strength closure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/s2_14_close_once.py
          sed -i 's/S2-15 activation is not authorized/does not authorize S2-15 activation/' scripts/task_v0_2_strength_audit.sh
          grep -Fq "require_literal 'does not authorize S2-15 activation'" scripts/task_v0_2_strength_audit.sh

      - name: Validate intended permanent tree
        shell: bash
        run: |
          set -euo pipefail
          mv .github/s2_14_close_once.py /tmp/s2_14_close_once.py
          mv .github/workflows/s2-14-close-once.yml /tmp/s2-14-close-once.yml
          trap 'mv /tmp/s2_14_close_once.py .github/s2_14_close_once.py; mv /tmp/s2-14-close-once.yml .github/workflows/s2-14-close-once.yml' EXIT
          bash scripts/task_v0_2_strength_audit.sh
          test -f /tmp/tracker-close.yml
          grep -Fq 'Strength tracker authority through S2-14' /tmp/tracker-close.yml
          grep -Fq 'Complete — PVS rejected_strength; v0.1 remains authoritative; inactive' /tmp/tracker-close.yml
          grep -Fq 's2-14-close-once.yml' /tmp/tracker-close.yml
          grep -Fq 's2_14_close_once.py' /tmp/tracker-close.yml

      - name: Commit evidence closure source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md \
            docs/RUST_CHESS_ENGINE_V0_2_S2_14_PRODUCTION_VALIDATION_2026-08-06.md \
            scripts/task_v0_2_strength_audit.sh
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git commit -m "docs: close S2-14 as rejected strength" -m "Record exact PVS production evidence from source 21406b5e92b6bd42a3a902591dddae22c9b3f16f. Both production reports are rejected_strength, activation remains false, and v0.1 remains authoritative."
          git push origin HEAD:master

      - name: Preserve patched permanent tracker workflow
        uses: actions/upload-artifact@v4
        with:
          name: s2-14-patched-tracker-workflow
          path: /tmp/tracker-close.yml
          if-no-files-found: error
          retention-days: 1
