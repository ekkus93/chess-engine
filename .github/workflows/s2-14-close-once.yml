          )
          audit_path.write_text(audit)

          tw = tracker_workflow_path.read_text()
          tw = tw.replace("Strength tracker authority through S2-13", "Strength tracker authority through S2-14")
          tw = tw.replace("Verify progression and evidence through S2-13", "Verify progression and evidence through S2-14")
          tw = tw.replace(
              "          grep -Fq '| S2-14 | Production candidate selection and validation | **Not started** |' \"$tracker\"",
              "          grep -Fq '| S2-14 | Production candidate selection and validation | **Complete — PVS rejected_strength; v0.1 remains authoritative; inactive** |' \"$tracker\""
          )
          tw = tw.replace(
