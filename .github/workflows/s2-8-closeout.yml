name: S2-8 LMR closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-8-closeout.yml
      - .github/s2_8_closeout.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-8-lmr-closeout
  cancel-in-progress: false

jobs:
  closeout:
    name: Correct, validate, and publish S2-8 closeout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct stale ARM64 evidence in staged closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/s2_8_closeout.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('149,653,978', '173,435,085', 1),
              ('149,794,342', '173,461,706', 1),
              ('1.000938', '1.000153', 2),
              ('0.094%', '0.015%', 1),
              ('8953716636', '8953681761', 2),
              (
                  'd89efe92c3382b0f291be0dce958ea7aca1ded7b6ac98b3e2024879ab6910224',
                  '01c0563109c18ec0cb7a3204452f454cac66e897ee05646c592edfd1dee5be85',
                  2,
              ),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'stale evidence replacement {old!r}: expected {expected}, found {count}'
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile .github/s2_8_closeout.py

      - name: Generate closeout, advance tracker, and prepare cleanup
        run: python3 .github/s2_8_closeout.py

      - name: Validate generated closeout tree
        shell: bash
        run: |
          set -euo pipefail
          closeout=docs/RUST_CHESS_ENGINE_V0_2_S2_8_LMR_2026-08-05.md
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md

          test -f "$closeout"
          test ! -e .github/s2_8_closeout.py
          test ! -e .github/workflows/s2-8-closeout.yml

          grep -Fq '**Status:** Complete' "$closeout"
          grep -Fq '**Disposition:** Standalone candidate rejected' "$closeout"
          grep -Fq '**Activation:** false' "$closeout"
          grep -Fq 'Baseline median: `173,435,085 ns`' "$closeout"
          grep -Fq 'Candidate median: `173,461,706 ns`' "$closeout"
          grep -Fq 'Candidate/baseline ratio: `1.000153`' "$closeout"
          grep -Fq 'ARM64 artifact: `8953681761`' "$closeout"
          grep -Fq '01c0563109c18ec0cb7a3204452f454cac66e897ee05646c592edfd1dee5be85' "$closeout"
          ! grep -Fq '149,653,978' "$closeout"
          ! grep -Fq '149,794,342' "$closeout"
          ! grep -Fq '1.000938' "$closeout"
          ! grep -Fq '8953716636' "$closeout"
          ! grep -Fq 'd89efe92c3382b0f291be0dce958ea7aca1ded7b6ac98b3e2024879ab6910224' "$closeout"

          grep -Fq '| S2-8 | Late Move Reductions candidate | **Complete — standalone rejected; inactive for combinations** |' "$tracker"
          grep -Fq '## S2-8 implementation record' "$tracker"
          grep -Fq '# Task S2-8: Late Move Reductions candidate — COMPLETE' "$tracker"
          grep -Fq 'Begin with **S2-9 only**:' "$tracker"
          grep -Fq 'ARM64 ratio `1.000153`' "$tracker"
          grep -Fq 'artifact `8953681761`' "$tracker"
          grep -Fq '01c0563109c18ec0cb7a3204452f454cac66e897ee05646c592edfd1dee5be85' "$tracker"
          ! grep -Fq '1.000938' "$tracker"
          ! grep -Fq '8953716636' "$tracker"
          ! grep -Fq 'd89efe92c3382b0f291be0dce958ea7aca1ded7b6ac98b3e2024879ab6910224' "$tracker"

          bash scripts/task_s2_8_lmr_audit.sh
          bash scripts/task_post_port_review_fix_audit.sh
          cargo fmt --all -- --check
          git diff --check

      - name: Commit completed closeout
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's workflow token may not create, update, or delete workflow files.
          # Restore those two paths for this push; the connected GitHub writer performs
          # the already-validated permanent-workflow update and one-shot cleanup next.
          git checkout HEAD -- .github/workflows/tracker-close.yml
          git checkout HEAD -- .github/workflows/s2-8-closeout.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'closeout produced no changes' >&2
            exit 1
          }
          git commit -m 'docs: close S2-8 LMR'
          git push origin HEAD:master
