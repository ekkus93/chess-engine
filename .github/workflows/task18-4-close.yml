name: Task 18.4 Close

on:
  push:
    branches:
      - task18-4-android-jni
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task18-4-close-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task18-4-android-jni
          fetch-depth: 0

      - name: Close validated Task 18.4 documentation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 466c7b504832afa2bf993cb10dcc0c12aefcf1c5 HEAD
          git merge-base --is-ancestor 1fc49b6126ecb9faa4c0f167b272945d65aebbf1 HEAD
          test ! -e .github/workflows/task18-4-android-build.yml
          test ! -e .github/workflows/task18-4-prepare.yml
          test ! -e .github/workflows/task18-4-fix-compile.yml
          python3 scripts/task18_4_close.py
          grep -F -- '- [x] 18.4 JNI.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] 18.5 Android harness.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] Task 18 gate.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          git rm .github/workflows/task18-4-close.yml scripts/task18_4_close.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RUST_ANDROID_JNI.md docs/RUST_CHESS_ENGINE_PORT_*.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m "docs: close Task 18.4 Android JNI"
          git push origin HEAD:task18-4-android-jni
