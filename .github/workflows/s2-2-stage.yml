name: Engine variant validation

on:
  push:
    branches:
      - master
    paths:
      - crates/chess-tools/src/candidate_validation.rs
      - crates/chess-tools/src/engine_variant.rs
      - crates/chess-tools/src/engine_variant_validation.rs
      - crates/chess-tools/src/lib.rs
      - crates/chess-search/src/**
      - scripts/task_s2_2_variant_validation_audit.sh
      - docs/RUST_CHESS_ENGINE_VARIANT_VALIDATION.md
      - docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
      - .github/workflows/s2-2-stage.yml
  pull_request:
    branches:
      - master
    paths:
      - crates/chess-tools/src/candidate_validation.rs
      - crates/chess-tools/src/engine_variant.rs
      - crates/chess-tools/src/engine_variant_validation.rs
      - crates/chess-tools/src/lib.rs
      - crates/chess-search/src/**
      - scripts/task_s2_2_variant_validation_audit.sh
      - docs/RUST_CHESS_ENGINE_VARIANT_VALIDATION.md
      - docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
      - .github/workflows/s2-2-stage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-variant-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Complete variant protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-variant-validation

      - name: Run permanent S2-2 audit
        run: bash scripts/task_s2_2_variant_validation_audit.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run focused strict Clippy
        run: >-
          cargo clippy --locked
          -p chess-tools
          --all-targets
          --all-features
          -- -D warnings

      - name: Test complete variant protocol
        run: cargo test --locked -p chess-tools engine_variant_validation::tests

      - name: Preserve weight-only protocol compatibility
        run: cargo test --locked -p chess-tools candidate_validation::tests
