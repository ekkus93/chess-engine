name: S4 Final Closure Stage

on:
  push:
    branches: [master]
    paths:
      - .github/s4_final_closure.py
      - .github/workflows/s4-final-closure-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s4-final-closure-stage
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply closed S4 authority state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/s4_final_closure.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/task_s3_evaluation_strength_audit.sh')
          text = path.read_text()
          old = "require_literal 'Active S4 evaluation tuning calibration program' \"$legacy\"\nrequire_literal '`docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_TODO_2026-08-07.md`' \"$legacy\"\nif grep -Fq '| Active S3 evaluation strength program |' \"$legacy\"; then\n  fail 'closed S3 tracker is still classified as active'\nfi"
          new = "require_literal '`docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_TODO_2026-08-07.md`' \"$legacy\"\nrequire_literal 'There is no active implementation TODO.' \"$legacy\"\nfor stale in '| Active S3 evaluation strength program |' '| Active S4 evaluation tuning calibration program |'; do\n  if grep -Fq \"$stale\" \"$legacy\"; then\n    fail \"closed strength/tuning tracker is still classified as active: $stale\"\n  fi\ndone"
          if text.count(old) != 1:
              raise SystemExit(f'S3 closure authority witness: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          sed -i 's/[[:space:]]*$//' \
            docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_TODO_2026-08-07.md \
            docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_SPEC_2026-08-07.md \
            docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_IMPLEMENTATION_REPORT.md \
            docs/LEGACY_TODO_INDEX.md
          git rm .github/s4_final_closure.py .github/workflows/s4-final-closure-stage.yml
          test ! -e .github/s4_final_closure.py
          test ! -e .github/workflows/s4-final-closure-stage.yml
          git diff --check
      - name: Validate closed authority tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/task_s3_evaluation_strength_audit.sh
          bash -n scripts/task_post_port_review_fix_audit.sh
          bash -n scripts/task_s4_evaluation_tuning_calibration_audit.sh
          bash scripts/task_post_port_review_fix_audit.sh
          bash scripts/task_s4_evaluation_tuning_calibration_audit.sh
          grep -Fq '**Status:** Complete — tuning method accepted for future experimentation; no production promotion' docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_TODO_2026-08-07.md
          grep -Fq '# Task S4-12: Final report and closure — COMPLETE (NO PRODUCTION PROMOTION)' docs/RUST_CHESS_ENGINE_S4_EVALUATION_TUNING_CALIBRATION_TODO_2026-08-07.md
          grep -Fq 'There is no active implementation TODO.' docs/LEGACY_TODO_INDEX.md
          grep -Fq '74 TODO-named files total; 2 authority documents; 1 authority index; 71 historical' docs/LEGACY_TODO_INDEX.md
          git diff --check
      - name: Publish closed authority state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add docs scripts
          git diff --cached --check
          git commit -m "docs: close S4 evaluation tuning calibration"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
