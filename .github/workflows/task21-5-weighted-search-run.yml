name: Task 21.5 Weighted Search Run

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-5-weighted-search-run
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Make patch helper indentation-aware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/task21-5-weighted-search.py')
          text = path.read_text()
          old = '''def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              old = dedent(old)
              new = dedent(new)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:160]!r}")
              path.write_text(text.replace(old, new, 1))
          '''
          new = '''def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              old = dedent(old).strip("\\n")
              new = dedent(new).strip("\\n")
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1))
                  return
              if count > 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:160]!r}")

              source_lines = text.splitlines()
              old_lines = old.splitlines()
              matches = []
              for index in range(len(source_lines) - len(old_lines) + 1):
                  if all(
                      source_lines[index + offset].strip() == expected.strip()
                      for offset, expected in enumerate(old_lines)
                  ):
                      matches.append(index)
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected one structural match, found {len(matches)}: {old[:160]!r}"
                  )

              start = matches[0]
              first = source_lines[start]
              indentation = first[: len(first) - len(first.lstrip())]
              replacement = [indentation + line if line else "" for line in new.splitlines()]
              updated = (
                  source_lines[:start]
                  + replacement
                  + source_lines[start + len(old_lines):]
              )
              suffix = "\\n" if text.endswith("\\n") else ""
              path.write_text("\\n".join(updated) + suffix)
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected replace_once implementation')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply and validate weighted search
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/task21-5-weighted-search.log
          : > "$log"

          run_step() {
            name="$1"
            shift
            printf '\n===== %s =====\n' "$name" >> "$log"
            "$@" >> "$log" 2>&1
          }

          status=0
          run_step apply python3 .github/task21-5-weighted-search.py || status=$?
          if [ "$status" -eq 0 ]; then
            run_step fmt cargo fmt --all || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step check cargo check --workspace --all-targets --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step clippy cargo clippy --workspace --all-targets --all-features --locked -- -D warnings || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step tests cargo test -p chess-search --all-features --locked || status=$?
          fi

          {
            printf 'status=%s\n' "$status"
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            cat "$log"
          } > .github/task21-5-weighted-search-result.txt

          if [ "$status" -ne 0 ]; then
            git restore crates/chess-search/src
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/task21-5-weighted-search-result.txt
          if [ "$status" -eq 0 ]; then
            git add crates/chess-search/src
            message='task 21.5: add explicit weighted production search'
          else
            message='ci: record Task 21.5 weighted-search failure'
          fi
          git commit -m "$message"
          git push origin HEAD:rust-engine
          exit "$status"
