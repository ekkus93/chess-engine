name: Task 21.5 Weighted Search Run

on:
  push:
    branches:
      - rust-engine

permissions:
  contents: write

concurrency:
  group: task21-5-weighted-search-run
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply weighted-search integration
        run: python3 .github/task21-5-weighted-search.py

      - name: Format and validate focused search changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p chess-search --all-features --locked

      - name: Commit weighted search
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src
          git commit -m 'task 21.5: add explicit weighted production search'
          git push origin HEAD:rust-engine
