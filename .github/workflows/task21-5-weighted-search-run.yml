name: Task 21.5 Weighted Search Run

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-5-weighted-search-run
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply and validate weighted search
        shell: bash
        run: |
          set -uo pipefail
          log=/tmp/task21-5-weighted-search.log
          : > "$log"

          run_step() {
            name="$1"
            shift
            printf '\n===== %s =====\n' "$name" >> "$log"
            "$@" >> "$log" 2>&1
          }

          status=0
          run_step preprocess python3 .github/task21-5-weighted-search-preprocess.py || status=$?
          if [ "$status" -eq 0 ]; then
            run_step apply python3 .github/task21-5-weighted-search.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step cleanup python3 .github/task21-5-weighted-search-cleanup.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step cleanup2 python3 .github/task21-5-weighted-search-cleanup2.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step cleanup3 python3 .github/task21-5-weighted-search-cleanup3.py || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step fmt cargo fmt --all || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step check cargo check --workspace --all-targets --locked || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step clippy cargo clippy --workspace --all-targets --all-features --locked -- -D warnings || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step tests cargo test -p chess-search --all-features --locked || status=$?
          fi

          {
            printf 'status=%s\n' "$status"
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            cat "$log"
          } > .github/task21-5-weighted-search-result.txt

          if [ "$status" -ne 0 ]; then
            git restore crates/chess-search/src
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/task21-5-weighted-search-result.txt
          if [ "$status" -eq 0 ]; then
            git add crates/chess-search/src
            message='task 21.5: add explicit weighted production search'
          else
            message='ci: record Task 21.5 weighted-search failure'
          fi
          git commit -m "$message"
          git push origin HEAD:rust-engine
          exit "$status"
