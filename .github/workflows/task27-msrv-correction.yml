name: Correct Task 27 MSRV evidence

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task27-msrv-correction.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Correct report and audit to the manifest MSRV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          report = Path('docs/RUST_CHESS_ENGINE_PORT_IMPLEMENTATION_REPORT.md')
          text = report.read_text(encoding='utf-8')
          old = '| Minimum supported Rust | `1.91` | root `Cargo.toml` |'
          new = '| Minimum supported Rust | `1.75` | root `Cargo.toml` |'
          if text.count(old) != 1:
              raise SystemExit(f'report MSRV marker count: {text.count(old)}')
          report.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit = Path('scripts/task_27_full_port_audit.sh')
          text = audit.read_text(encoding='utf-8')
          old = "grep -Fq 'rust-version = \"1.91\"' Cargo.toml"
          new = "grep -Fq 'rust-version = \"1.75\"' Cargo.toml"
          if text.count(old) != 1:
              raise SystemExit(f'audit MSRV marker count: {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              "workspace minimum Rust version is not recorded as 1.91",
              "workspace minimum Rust version is not recorded as 1.75",
              1,
          )
          audit.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/task27-msrv-correction.yml
          git diff --check
          bash -n scripts/task_27_full_port_audit.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_CHESS_ENGINE_PORT_IMPLEMENTATION_REPORT.md scripts/task_27_full_port_audit.sh
          git commit -m 'docs: correct Task 27 MSRV evidence'
          git push origin HEAD:master
