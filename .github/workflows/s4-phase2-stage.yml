name: S4 Phase 2 Trace Stage

on:
  push:
    branches: [master]
    paths:
      - .github/s4_phase2.py
      - .github/s4_phase2_repair.py
      - .github/workflows/s4-phase2-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s4-phase2-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair trace test
        run: python3 .github/s4_phase2_repair.py
      - name: Apply trace patch
        run: python3 .github/s4_phase2.py
      - name: Format staged source
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --locked -p chess-tune --all-targets --all-features -- -D warnings
      - name: Run trace and optimizer tests
        run: cargo test --locked -p chess-tune --all-targets --all-features
      - name: Verify S4 audit syntax
        run: bash -n scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add crates/chess-tune/src/lib.rs crates/chess-tune/src/trace.rs scripts/task_s4_evaluation_tuning_calibration_audit.sh
          git commit -m "feat: add provenance-bound S4 optimizer trace"
          git push origin HEAD:master
