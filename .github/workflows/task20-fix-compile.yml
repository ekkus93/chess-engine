name: Task 20 Compile Corrections

on:
  push:
    branches:
      - task20-self-play-dataset

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'ekkus93'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task20-self-play-dataset
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compiler corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/chess-tools/src/self_play.rs')
          text = path.read_text()
          replacements = {
              'record.moves[..opening_ply_count] != opening.moves.as_slice()': '&record.moves[..opening_ply_count] != opening.moves.as_slice()',
              'game.moves().iter().map(Move::to_uci).collect::<Vec<_>>()': 'game.moves().iter().map(|current| current.to_uci()).collect::<Vec<_>>()',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected replacement count for {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/task20-fix-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tools/src/self_play.rs
          git commit -m 'Fix Task 20 compile ownership'
          git push origin HEAD:task20-self-play-dataset
