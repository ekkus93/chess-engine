name: Rust TUI Ralph

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/chess-tui/**
      - scripts/dev.sh
      - README.md
      - docs/RUST_TUI_**
      - .github/workflows/rust-tui-ralph.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-tui-ralph-master
  cancel-in-progress: false

jobs:
  focused:
    name: Rust TUI focused Ralph gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply current Ralph source corrections
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Color, DrawReason, Game, GameStatus, Move, UciMove/Color, DrawReason, Game, GameStatus, UciMove/' crates/chess-tui/src/app.rs
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('crates/chess-tui/src/ui.rs')
          text = ui.read_text()
          old_error = 'io::Error::new(io::ErrorKind::Other, error.to_string())'
          count = text.count(old_error)
          if count not in (0, 4):
              raise SystemExit(f'unexpected io::Error replacement count: {count}')
          text = text.replace(old_error, 'io::Error::other(error.to_string())')
          old_import = "        orientation_for_config, turn_status, LayoutDecision, MIN_TERMINAL_HEIGHT,\n        MIN_TERMINAL_WIDTH,\n"
          new_import = "        orientation_for_config, turn_status, LayoutDecision, MIN_TERMINAL_HEIGHT,\n        MIN_TERMINAL_WIDTH, STACKED_MIN_TERMINAL_HEIGHT, WIDE_TERMINAL_WIDTH,\n"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('unexpected TUI layout import block')
          old_message = "        let text = format!(\n            \"Terminal too small. Need at least {MIN_TERMINAL_WIDTH}×{MIN_TERMINAL_HEIGHT}; current {}×{}.\",\n            size.width, size.height\n        );\n"
          new_message = "        let text = format!(\n            \"Terminal too small. Need {WIDE_TERMINAL_WIDTH}×{MIN_TERMINAL_HEIGHT} for the wide layout or {MIN_TERMINAL_WIDTH}×{STACKED_MIN_TERMINAL_HEIGHT} for the stacked layout; current {}×{}.\",\n            size.width, size.height\n        );\n"
          if old_message in text:
              text = text.replace(old_message, new_message, 1)
          elif new_message not in text:
              raise SystemExit('unexpected minimum-size message block')
          ui.write_text(text)

          render = Path('crates/chess-tui/src/render.rs')
          text = render.read_text()
          old_layout = "pub const MIN_TERMINAL_WIDTH: u16 = 58;\npub const MIN_TERMINAL_HEIGHT: u16 = 20;\npub const WIDE_TERMINAL_WIDTH: u16 = 100;\n"
          new_layout = "pub const MIN_TERMINAL_WIDTH: u16 = 58;\npub const MIN_TERMINAL_HEIGHT: u16 = 32;\npub const WIDE_TERMINAL_WIDTH: u16 = 80;\npub const STACKED_MIN_TERMINAL_HEIGHT: u16 = 46;\n"
          if old_layout in text:
              text = text.replace(old_layout, new_layout, 1)
          elif new_layout not in text:
              raise SystemExit('unexpected layout constants')
          old_decision = "pub const fn layout_decision(width: u16, height: u16) -> LayoutDecision {\n    if width < MIN_TERMINAL_WIDTH || height < MIN_TERMINAL_HEIGHT {\n        LayoutDecision::TooSmall\n    } else if width >= WIDE_TERMINAL_WIDTH {\n        LayoutDecision::Horizontal\n    } else {\n        LayoutDecision::Vertical\n    }\n}\n"
          new_decision = "pub const fn layout_decision(width: u16, height: u16) -> LayoutDecision {\n    if width >= WIDE_TERMINAL_WIDTH && height >= MIN_TERMINAL_HEIGHT {\n        LayoutDecision::Horizontal\n    } else if width >= MIN_TERMINAL_WIDTH && height >= STACKED_MIN_TERMINAL_HEIGHT {\n        LayoutDecision::Vertical\n    } else {\n        LayoutDecision::TooSmall\n    }\n}\n"
          if old_decision in text:
              text = text.replace(old_decision, new_decision, 1)
          elif new_decision not in text:
              raise SystemExit('unexpected layout decision function')
          old_test = "    fn narrow_layout_decision_is_safe() {\n        assert_eq!(layout_decision(20, 8), LayoutDecision::TooSmall);\n        assert_eq!(layout_decision(70, 24), LayoutDecision::Vertical);\n        assert_eq!(layout_decision(120, 30), LayoutDecision::Horizontal);\n    }\n"
          new_test = "    fn layout_requires_enough_height_for_the_complete_board() {\n        assert_eq!(layout_decision(20, 8), LayoutDecision::TooSmall);\n        assert_eq!(layout_decision(70, 24), LayoutDecision::TooSmall);\n        assert_eq!(layout_decision(79, 45), LayoutDecision::TooSmall);\n        assert_eq!(layout_decision(58, 46), LayoutDecision::Vertical);\n        assert_eq!(layout_decision(80, 32), LayoutDecision::Horizontal);\n        assert_eq!(layout_decision(120, 30), LayoutDecision::TooSmall);\n    }\n"
          if old_test in text:
              text = text.replace(old_test, new_test, 1)
          elif new_test not in text:
              raise SystemExit('unexpected layout test block')
          render.write_text(text)
          PY

      - name: Normalize lockfile and Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit generated or corrected Rust TUI sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock Cargo.toml crates/chess-tui; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock Cargo.toml crates/chess-tui
          git commit -m 'Fix Rust TUI focused validation issues'
          git push origin HEAD:master

      - name: Validate locked metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check TUI
        run: cargo check --locked -p chess-tui --all-targets

      - name: Clippy TUI
        run: cargo clippy --locked -p chess-tui --all-targets -- -D warnings

      - name: Test TUI
        run: cargo test --locked -p chess-tui

      - name: Release-build TUI
        run: cargo build --locked --release -p chess-tui

      - name: Verify repository MSRV for TUI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          cargo +1.75.0 check --locked -p chess-tui
