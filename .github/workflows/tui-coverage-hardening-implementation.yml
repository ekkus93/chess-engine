name: Rust TUI coverage hardening implementation

on:
  push:
    branches:
      - master
    paths:
      - .github/tui_coverage_hardening_patch.py
      - .github/tui_coverage_hardening_fix.py
      - .github/workflows/tui-coverage-hardening-implementation.yml

permissions:
  contents: write

concurrency:
  group: rust-tui-coverage-hardening-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    name: Patch and focused validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust coverage toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Rust 1.75 MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none

      - name: Apply hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tui_coverage_hardening_patch.py
          python3 .github/tui_coverage_hardening_fix.py

      - name: Format patched Rust
        run: cargo fmt --all

      - name: Validate shell syntax
        run: bash -n scripts/dev.sh scripts/tui_coverage.sh

      - name: Focused TUI check
        run: cargo check --locked -p chess-tui --all-targets --all-features

      - name: Focused strict TUI Clippy
        run: cargo clippy --locked -p chess-tui --all-targets --all-features -- -D warnings

      - name: Focused TUI tests
        run: cargo test --locked -p chess-tui --all-targets --all-features

      - name: Explicit Rust 1.75 TUI check
        run: cargo +1.75.0 check --locked -p chess-tui --all-targets --all-features

      - name: Focused llvm-cov summary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tui_coverage.sh clean
          bash scripts/tui_coverage.sh summary
          bash scripts/tui_coverage.sh json
          bash scripts/tui_coverage.sh lcov
          test -s target/chess-tui-coverage-summary.json
          test -s target/chess-tui-lcov.info

      - name: Verify no engine behavior source changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD -- crates/chess-core crates/chess-search crates/chess-book crates/chess-uci | grep -q .; then
            echo '::error::TUI coverage hardening modified authoritative engine/search adapter source.'
            git diff --name-only HEAD -- crates/chess-core crates/chess-search crates/chess-book crates/chess-uci
            exit 1
          fi

      - name: Run TODO authority audit
        run: bash scripts/task_post_port_review_fix_audit.sh

      - name: Commit and publish validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/tui_coverage_hardening_patch.py .github/tui_coverage_hardening_fix.py .github/workflows/tui-coverage-hardening-implementation.yml .github/workflows/ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::No validated source hardening changes were produced.'
            exit 1
          fi
          git commit -m 'Harden Rust TUI test coverage'
          git push origin HEAD:master
