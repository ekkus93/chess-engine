name: Task 17.1 preflight

on:
  push:
    branches:
      - rust-engine

permissions:
  contents: write

concurrency:
  group: task17-preflight-rust-engine
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Skip the second evidence commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "ci: record Task 17.1 preflight 2" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Correct response borrowing in tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/chess-uci/src/lib.rs")
          text = path.read_text()
          text = text.replace("search_command(UciSession", "search_command(&UciSession")
          text = text.replace(
              "search_command(\n            UciSession",
              "search_command(\n            &UciSession",
          )
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Run bounded validation
        if: steps.guard.outputs.skip != 'true'
        id: validate
        shell: bash
        run: |
          set +e
          log=docs/TASK17_1_PREFLIGHT.log
          : > "$log"
          status=0
          run_check() {
            echo "$ $*" | tee -a "$log"
            "$@" >> "$log" 2>&1
            rc=$?
            echo "exit=$rc" | tee -a "$log"
            if [[ $rc -ne 0 && $status -eq 0 ]]; then status=$rc; fi
          }
          run_check cargo fmt --all -- --check
          run_check cargo check --locked --workspace --all-targets --all-features
          run_check cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          run_check cargo test --locked -p chess-uci
          run_check cargo test --locked --workspace --all-features
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit source and evidence
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-uci/src/lib.rs docs/TASK17_1_PREFLIGHT.log
          git diff --cached --check
          git commit -m "ci: record Task 17.1 preflight 2"
          git push origin HEAD:rust-engine

      - name: Fail when validation failed
        if: steps.guard.outputs.skip != 'true' && steps.validate.outputs.status != '0'
        run: exit 1
