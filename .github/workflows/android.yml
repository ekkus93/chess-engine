name: Android JNI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-jni-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-jvm:
    name: Host JVM JNI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build host JNI library
        run: cargo build --locked -p chess-jni --release

      - name: Run host JVM contract tests
        run: >-
          gradle -p android-harness :host-jvm:test
          --no-daemon --stacktrace --console=plain

  android-emulator:
    name: Android API 35 JNI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve hosted Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [[ -z "${NDK_HOME}" || ! -d "${NDK_HOME}" ]]; then
            NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "${NDK_HOME}"
          echo "home=${NDK_HOME}" >> "${GITHUB_OUTPUT}"
          "${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build and stage ARM64 and x86_64 JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
          ANDROID_API_LEVEL: "24"
        run: bash scripts/prepare_android_harness_jni.sh

      - name: Verify native artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARM64=android-harness/android-smoke/src/main/jniLibs/arm64-v8a/libchess_jni.so
          X64=android-harness/android-smoke/src/main/jniLibs/x86_64/libchess_jni.so
          test -s "${ARM64}"
          test -s "${X64}"
          file "${ARM64}" | tee /tmp/chess-arm64.txt
          file "${X64}" | tee /tmp/chess-x64.txt
          grep -F 'ARM aarch64' /tmp/chess-arm64.txt
          grep -F 'x86-64' /tmp/chess-x64.txt
          readelf -Ws "${ARM64}" | grep -F 'Java_com_ekkus93_chessengine_NativeChessEngineBindings_nativeSearch'
          readelf -Ws "${X64}" | grep -F 'Java_com_ekkus93_chessengine_NativeChessEngineBindings_nativeSearch'

      - name: Compile Android library and test APK
        run: >-
          gradle -p android-harness
          :android-smoke:assembleDebug
          :android-smoke:assembleDebugAndroidTest
          --no-daemon --stacktrace --console=plain

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented JNI lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: >-
            gradle -p android-harness
            :android-smoke:connectedDebugAndroidTest
            --no-daemon --stacktrace --console=plain

  close-task-18:
    name: Close Task 18.5 and Task 18 gate
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task18-5-android-harness
          fetch-depth: 0

      - name: Apply guarded closure
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0af14c4bdb7e8de645f27182a788e5eef5297d5f HEAD
          python3 scripts/task18_5_close.py
          git show 0af14c4bdb7e8de645f27182a788e5eef5297d5f:.github/workflows/android.yml > .github/workflows/android.yml
          git rm .github/workflows/task18-5-close.yml scripts/task18_5_close.py

      - name: Verify and commit closure
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '- [x] 18.5 Android harness.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [x] Task 18 gate.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F '**Current phase:** Task 18 complete; Task 19.1 opening-book abstraction is next' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F -- '- [ ] 19.1 Abstraction.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F 'contents: read' .github/workflows/android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android.yml \
            docs/RUST_ANDROID_JNI.md \
            docs/RUST_ANDROID_TEST_HARNESS.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          expected=$(printf '%s\n' \
            '.github/workflows/android.yml' \
            '.github/workflows/task18-5-close.yml' \
            'docs/RUST_ANDROID_JNI.md' \
            'docs/RUST_ANDROID_TEST_HARNESS.md' \
            'docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md' \
            'docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md' \
            'docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md' \
            'scripts/task18_5_close.py')
          actual=$(printf '%s\n' "${changed[@]}")
          test "${actual}" = "${expected}"
          git commit -m "docs: close Task 18.5 and Task 18 gate"
          git push origin HEAD:task18-5-android-harness
