name: Android JNI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-jni-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-lint:
    name: Android/Kotlin lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android lint and app unit tests
        run: >-
          gradle -p android-harness
          :android-smoke:lintDebug
          :android-app:lintDebug
          :android-app:testDebugUnitTest
          --no-daemon --stacktrace --console=plain

  host-jvm:
    name: Host JVM JNI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build host JNI library
        run: cargo build --locked -p chess-jni --release

      - name: Run high-level shared-app bridge tests
        run: cargo test --locked -p chess-jni app_bridge::tests -- --test-threads=1

      - name: Run host JVM contract tests
        run: >-
          gradle -p android-harness :host-jvm:test
          --no-daemon --stacktrace --console=plain

  android-emulator:
    name: Android API 35 JNI and app smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve hosted Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [[ -z "${NDK_HOME}" || ! -d "${NDK_HOME}" ]]; then
            NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "${NDK_HOME}"
          echo "home=${NDK_HOME}" >> "${GITHUB_OUTPUT}"
          "${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build and stage ARM64 and x86_64 JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
          ANDROID_API_LEVEL: "24"
        run: bash scripts/prepare_android_harness_jni.sh

      - name: Verify native artifacts
        shell: bash
        run: |
          set -euo pipefail
          for module in android-smoke android-app; do
            ARM64="android-harness/${module}/src/main/jniLibs/arm64-v8a/libchess_jni.so"
            X64="android-harness/${module}/src/main/jniLibs/x86_64/libchess_jni.so"
            test -s "${ARM64}"
            test -s "${X64}"
            file "${ARM64}" | tee "/tmp/chess-${module}-arm64.txt"
            file "${X64}" | tee "/tmp/chess-${module}-x64.txt"
            grep -F 'ARM aarch64' "/tmp/chess-${module}-arm64.txt"
            grep -F 'x86-64' "/tmp/chess-${module}-x64.txt"
            readelf -Ws "${ARM64}" | grep -F 'Java_com_ekkus93_chessengine_NativeChessEngineBindings_nativeSearch'
            readelf -Ws "${X64}" | grep -F 'Java_com_ekkus93_chessengine_NativeChessAppBindings_nativeCreate'
          done

      - name: Compile Android harness and playable app APKs
        run: >-
          gradle -p android-harness
          :android-smoke:assembleDebug
          :android-smoke:assembleDebugAndroidTest
          :android-app:assembleDebug
          :android-app:assembleDebugAndroidTest
          --no-daemon --stacktrace --console=plain

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented JNI lifecycle and playable app smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            gradle -p android-harness :android-smoke:connectedDebugAndroidTest :android-app:connectedDebugAndroidTest --no-daemon --stacktrace --console=plain
            adb logcat -d | grep -F 'TASK24_ANDROID_METRIC' | sed 's/^.*TASK24_ANDROID_METRIC/TASK24_ANDROID_METRIC/' | sort -u | tee task24-android-performance.txt
            test -s task24-android-performance.txt

      - name: Preserve Android performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: task24-android-performance-${{ github.sha }}
          path: task24-android-performance.txt
          if-no-files-found: error
          retention-days: 30

      - name: Preserve playable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rust-chess-android-debug-${{ github.sha }}
          path: android-harness/android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 30
