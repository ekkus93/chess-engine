name: S3 Closure Docs Stage

on:
  push:
    branches:
      - master
    paths:
      - .github/s3_closure_docs.py
      - .github/workflows/s3-closure-docs-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s3-closure-docs-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply closure wording
        run: python3 .github/s3_closure_docs.py
      - name: Verify closure witnesses
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**Status:** Complete — program closed without promotion' docs/RUST_CHESS_ENGINE_S3_EVALUATION_STRENGTH_SPEC_2026-08-07.md
          grep -Fq '**Final report:** `docs/RUST_CHESS_ENGINE_S3_EVALUATION_STRENGTH_IMPLEMENTATION_REPORT.md`' docs/RUST_CHESS_ENGINE_S3_EVALUATION_STRENGTH_SPEC_2026-08-07.md
          git diff --check
      - name: Commit closure wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add docs/RUST_CHESS_ENGINE_S3_EVALUATION_STRENGTH_SPEC_2026-08-07.md
          git commit -m "docs: close S3 evaluation strength specification"
          git push origin HEAD:master
