name: Close Task 7 if exact CI is green

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  close-task:
    if: github.event.issue.title == '[close-task7-if-green]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Resolve exact green CI evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/rust-engine" --jq '.object.sha')"
          run_record="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=rust-engine&per_page=30" \
              --jq ".workflow_runs | map(select(.head_sha == \"${head_sha}\")) | first | if . == null then \"\" else \"\(.id)|\(.status)|\(.conclusion)\" end"
          )"
          if [[ -z "${run_record}" ]]; then
            echo "No CI run exists for rust-engine SHA ${head_sha}." >&2
            exit 1
          fi
          IFS='|' read -r run_id run_status run_conclusion <<<"${run_record}"
          if [[ "${run_status}" != "completed" || "${run_conclusion}" != "success" ]]; then
            gh api \
              --method POST \
              "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
              -f body="Task 7 remains open: CI run ${run_id} for ${head_sha} is ${run_status}/${run_conclusion}."
            exit 1
          fi
          rust_job="$(
            gh api \
              "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '.jobs | map(select(.name == "Rust workspace quality")) | first | .id'
          )"
          gh run view "${run_id}" --repo "${REPOSITORY}" --log > /tmp/task7-ci.log
          test_count="$(python - <<'PY'
          import re
          text = open('/tmp/task7-ci.log', encoding='utf-8', errors='replace').read()
          counts = [int(value) for value in re.findall(r'test result: ok\. (\d+) passed', text)]
          if not counts:
              raise SystemExit('No passing Rust test count found')
          print(max(counts))
          PY
          )"
          {
            echo "head_sha=${head_sha}"
            echo "run_id=${run_id}"
            echo "rust_job=${rust_job}"
            echo "test_count=${test_count}"
          } >>"${GITHUB_OUTPUT}"

      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
          path: engine

      - name: Close Task 7 in authoritative records
        working-directory: engine
        env:
          HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
          RUN_ID: ${{ steps.evidence.outputs.run_id }}
          RUST_JOB: ${{ steps.evidence.outputs.rust_job }}
          TEST_COUNT: ${{ steps.evidence.outputs.test_count }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          head = os.environ['HEAD_SHA']
          run = os.environ['RUN_ID']
          job = os.environ['RUST_JOB']
          tests = os.environ['TEST_COUNT']

          todo = Path('docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md')
          text = todo.read_text()
          text = text.replace(
              '| 7 | **Implemented, CI pending** — legal filtering, special rules, reversible validation path, and initial perft are present. |',
              '| 7 | **Complete** — legal filtering, special rules, reversible validation, perft, documentation, and exact-SHA CI. |',
          )
          text = text.replace(
              '# Task 7: Complete legal move generation and special rules — IMPLEMENTED, CI PENDING',
              '# Task 7: Complete legal move generation and special rules — COMPLETE',
          )
          for label in [
              'Exact-head rustfmt pass.',
              'Exact-head Cargo check pass.',
              'Exact-head Clippy `-D warnings` pass.',
              'Exact-head unit tests with recorded count.',
              'Exact-head rustdoc `-D warnings` pass.',
              'Exact-head debug and release builds.',
              'Task 7 gate.',
          ]:
              text = text.replace(f'- [ ] {label}', f'- [x] {label}', 1)
          text = text.replace(
              '- Exact CI evidence remains pending.',
              f'- Green implementation SHA: `{head}`.\n'
              f'- CI run/job: `{run}` / `{job}`.\n'
              f'- Results: rustfmt, Cargo check, Clippy with warnings denied, `{tests} passed`, rustdoc with warnings denied, debug build, and release build passed.\n'
              '- First-party warnings: none.\n'
              '- Accepted external notices: GitHub Actions runtime/dependency deprecation notices only.',
          )
          text = re.sub(
              r'## Immediate next operations\n.*\Z',
              '## Immediate next operations\n\n'
              '1. Verify this Task 7 closure commit at its exact SHA through strict CI.\n'
              '2. Begin Task 8 only after the closure SHA is green.\n'
              '3. Formalize the reversible move/undo contract and exhaustive restoration tests.\n'
              '4. Keep every Task 8 subtask synchronized during the next Ralph Loop.\n',
              text,
              flags=re.S,
          )
          todo.write_text(text)

          ralph = Path('docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md')
          status = ralph.read_text()
          status = re.sub(
              r'\*\*Current phase:\*\*.*',
              '**Current phase:** Task 7 complete; exact closure-SHA verification pending',
              status,
              count=1,
          )
          row = f'| 7 | `{head}` | `{run}` / `{job}` | `{tests} passed`; all strict gates green |'
          if re.search(r'^\| 7 \|.*$', status, re.M):
              status = re.sub(r'^\| 7 \|.*$', row, status, flags=re.M)
          else:
              table_end = '| 6 | `cb7124c5712f6b3f8f4540e9e8fabaa2aa242bc0` | `30727972433` | closure green; implementation `49 passed` |'
              status = status.replace(table_end, table_end + '\n' + row)
          status = status.replace(
              'Task 7 remains open pending exact-SHA rustfmt, Cargo check, Clippy, tests, rustdoc, debug, and release evidence.',
              'Task 7 implementation is green at the exact SHA above. The remaining operation is exact closure-SHA verification.',
          )
          ralph.write_text(status)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git diff --cached --check
          git commit -m 'docs: close Task 7 legal move generation milestone'
          git push origin HEAD:rust-engine
          echo "CLOSURE_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"

      - name: Dispatch closure CI
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine

      - name: Report closure
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.evidence.outputs.head_sha }}
          SOURCE_RUN: ${{ steps.evidence.outputs.run_id }}
          SOURCE_JOB: ${{ steps.evidence.outputs.rust_job }}
          TEST_COUNT: ${{ steps.evidence.outputs.test_count }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" \
            -f body="Closed Task 7 at ${CLOSURE_SHA}. Source evidence: ${SOURCE_SHA}, run ${SOURCE_RUN}, job ${SOURCE_JOB}, ${TEST_COUNT} tests passed. Closure CI dispatched."

      - name: Check out master for cleanup
        if: always()
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: control

      - name: Remove one-shot closer
        if: always()
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f .github/workflows/task7-close-if-green.yml ]]; then
            git rm .github/workflows/task7-close-if-green.yml
            git commit -m 'ci: remove Task 7 closer'
            git push origin HEAD:master
          fi

      - name: Close trigger issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}" \
            -f state=closed \
            -f state_reason=completed
