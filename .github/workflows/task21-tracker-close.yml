name: Task 21.1 Tracker Close

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-tracker-close
  cancel-in-progress: false

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Task 21.1 trackers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sha = '8410beb6dc22684052ded86a6f2fe71cf9d1e444'
          rust = '30889939723 / 91929495312'
          android = '30889939726 / 91929459955, 91929459977, 91929460081'

          definitions_path = Path('docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md')
          definitions = definitions_path.read_text()
          start = definitions.index('## 21.1 Weight schema integration')
          end = definitions.index('\n## 21.2 Loss pipeline', start)
          section = definitions[start:end]
          section = section.replace('- [ ] ', '- [x] ')
          if '### Task 21.1 completion evidence' not in section:
              section += f'''\n\n### Task 21.1 completion evidence\n\n- Added 810 stable named tunable scalars while keeping evaluator structural constants outside the tuning vector.\n- Added independently versioned/checksummed evaluator structure and strict version-1 named artifacts with complete training provenance.\n- Contract: `docs/RUST_NAMED_WEIGHT_SCHEMA.md`.\n- Exact validated implementation head: `{sha}`.\n- Rust run/job: `{rust}`.\n- Android run/jobs: `{android}`.\n- All permanent Rust, Android/Kotlin lint, host JNI, and API-35 gates passed. Candidate artifacts remain explicitly inactive.\n'''
          definitions = definitions[:start] + section + definitions[end:]
          definitions = definitions.replace(
              'Task 21.1 named weight-schema integration is next.',
              'Task 21.1 named weight-schema integration is complete; Task 21.2 loss-pipeline work is next.',
          )
          definitions_path.write_text(definitions)

          todo_path = Path('docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md')
          todo = todo_path.read_text()
          todo = todo.replace(
              '| 21–24 | **Not started**. |',
              '| 21 | **In progress** — Task 21.1 complete; Tasks 21.2–21.5 remain. |\n| 22–24 | **Not started**. |',
              1,
          )
          start = todo.index('# Task 21: Named-schema tuning')
          end = todo.index('\n# Task 22:', start)
          section = todo[start:end]
          section = section.replace('# Task 21: Named-schema tuning — NOT STARTED', '# Task 21: Named-schema tuning — IN PROGRESS', 1)
          section = section.replace('- [ ] 21.1 Weights.', '- [x] 21.1 Weights.', 1)
          if '### Task 21.1 completion evidence' not in section:
              section += f'''\n\n### Task 21.1 completion evidence\n\n- Stable 810-scalar named schema, separately versioned structural constants, strict named serialization, complete training provenance, semantic checksums, and focused corruption/round-trip regressions implemented.\n- Exact validated implementation head: `{sha}`.\n- Rust run/job: `{rust}`.\n- Android run/jobs: `{android}`.\n- Task 21.2 loss-pipeline work is next; candidate weights are not automatically activated.\n'''
          todo = todo[:start] + section + todo[end:]
          todo = todo.replace(
              'Task 21.1 named weight-schema integration is next.',
              'Task 21.1 named weight-schema integration is complete; Task 21.2 loss-pipeline work is next.',
          )
          todo_path.write_text(todo)

          ralph_path = Path('docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md')
          ralph = ralph_path.read_text()
          ralph = ralph.replace(
              '**Current phase:** Task 20 offline self-play and versioned datasets complete; Task 21.1 named weight-schema integration is next',
              '**Current phase:** Task 21.1 named weight-schema integration complete; Task 21.2 loss-pipeline work is next',
              1,
          )
          row = f'| 21.1 | `{sha}` | Rust `{rust}`; Android `{android}` | stable 810-scalar named schema, separately versioned structural evaluator contract, strict named artifacts, complete training provenance, semantic checksums, and all permanent gates green |\n'
          if '| 21.1 |' not in ralph:
              table_end = ralph.index('\n\n## Task 17.1 completion')
              ralph = ralph[:table_end] + '\n' + row.rstrip() + ralph[table_end:]
          ralph = ralph.replace(
              'Task 20 is complete. Task 21.1 named weight-schema integration is next.',
              'Task 20 is complete. Task 21.1 named weight-schema integration is complete; Task 21.2 loss-pipeline work is next.',
          )
          if '## Task 21.1 completion' not in ralph:
              ralph = ralph.rstrip() + f'''\n\n## Task 21.1 completion\n\nImplemented and validated:\n\n- 810 stable named tunable scalars;\n- separately versioned and checksummed evaluator structural constants consumed by runtime evaluation;\n- strict version-1 named artifacts with complete trainer, source, dataset, split, seed, iteration, and timestamp provenance;\n- semantic checksums over schemas, structure, metadata, parameter names, and values;\n- explicit candidate non-activation and `docs/RUST_NAMED_WEIGHT_SCHEMA.md`.\n\nEvidence:\n\n- exact validated implementation head: `{sha}`;\n- Rust run/job: `{rust}`;\n- Android run/jobs: `{android}`;\n- all permanent Rust, Android/Kotlin lint, host JNI, and API-35 gates passed.\n\nTask 21.1 is complete. Task 21.2 loss-pipeline work is next.\n'''
          ralph_path.write_text(ralph)
          PY

      - name: Commit tracker closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git commit -m 'docs: close Task 21.1 named weight schema'
          git push origin HEAD:master
