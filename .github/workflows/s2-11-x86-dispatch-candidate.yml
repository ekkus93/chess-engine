name: S2-11 measured x86 sliding dispatch

on:
  push:
    branches:
      - master
    paths:
      - .github/s2_11_x86_dispatch_candidate.py
      - .github/workflows/s2-11-x86-dispatch-candidate.yml

permissions:
  contents: write

concurrency:
  group: s2-11-x86-sliding-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    name: Build explicit architecture dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d0fe7cf9585148d189b729a7ce21697ef181c7a6"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/s2-11-x86-dispatch-candidate.yml"
          test "$(git rev-parse HEAD^^)" = "641d15b86820a095e29577f1e018c4ba59b60487"

      - name: Apply reviewed architecture dispatch
        run: python3 .github/s2_11_x86_dispatch_candidate.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Format and audit source scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "crates/chess-core/src/attacks.rs"
          if grep -RIn --exclude-dir=target -E '#\[allow\(|#\[expect\(' crates/chess-core/src/attacks.rs; then
            echo 'candidate introduced lint suppression' >&2
            exit 1
          fi
          grep -Fq '#[cfg(target_arch = "x86_64")]' crates/chess-core/src/attacks.rs
          grep -Fq '#[cfg(not(target_arch = "x86_64"))]' crates/chess-core/src/attacks.rs
          grep -Fq 'sliding_attacks_ray' crates/chess-core/src/attacks.rs
          grep -Fq 'sliding_attacks_step' crates/chess-core/src/attacks.rs

      - name: Validate x86 implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p chess-core --all-targets --all-features
          cargo clippy --locked -p chess-core --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-core attacks_tests -- --nocapture
          cargo test --locked -p chess-core --all-features

      - name: Compile non-x86 implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --target aarch64-unknown-linux-gnu -p chess-core --all-targets --all-features
          cargo clippy --locked --target aarch64-unknown-linux-gnu -p chess-core --all-targets --all-features -- -D warnings

      - name: Verify exact x86 deterministic workloads
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p chess-tools --bin performance -- profile-perft \
            | tee /tmp/profile-perft.txt
          grep -Fxq $'profile_perft_nodes\t4085603' /tmp/profile-perft.txt
          cargo run --locked --release -p chess-tools --bin performance -- profile-search \
            | tee /tmp/profile-search.txt
          grep -Fxq $'profile_search_nodes\t250000' /tmp/profile-search.txt
          grep -Fxq $'profile_search_qnodes\t242711' /tmp/profile-search.txt
          grep -Fxq $'profile_search_depth\t4' /tmp/profile-search.txt

      - name: Commit isolated architecture dispatch
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/s2_11_x86_dispatch_candidate.py \
            .github/workflows/s2-11-x86-dispatch-candidate.yml \
            .github/workflows/s2-11-sliding-validation.yml
          git add crates/chess-core/src/attacks.rs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/s2_11_x86_dispatch_candidate.py \
            .github/workflows/s2-11-sliding-validation.yml \
            .github/workflows/s2-11-x86-dispatch-candidate.yml \
            crates/chess-core/src/attacks.rs | sort)"
          test "$staged" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: use measured x86 sliding attack dispatch"
          git push origin HEAD:master
