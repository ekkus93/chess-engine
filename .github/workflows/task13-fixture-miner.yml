name: Task 13.5 Fixture Miner

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  mine:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event.issue.title == '[mine-task-13-5-fixtures]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install oracle
        run: python -m pip install --disable-pip-version-check chess==1.11.2
      - name: Mine fixtures
        id: mine
        shell: bash
        run: |
          set -euo pipefail
          output="$(python .github/task13_fixture_miner.py)"
          {
            echo 'output<<EOF'
            echo "${output}"
            echo 'EOF'
          } >>"${GITHUB_OUTPUT}"
      - name: Report and close
        env:
          OUTPUT: ${{ steps.mine.outputs.output }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="${OUTPUT}"
          gh api --method PATCH "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=closed -f state_reason=completed
