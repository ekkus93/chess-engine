name: Fix Task 15.5 test loops

on:
  push:
    branches:
      - rust-engine
    paths:
      - ".github/workflows/fix-task-15-5-test-loops.yml"

permissions:
  contents: write

concurrency:
  group: fix-task-15-5-test-loops
  cancel-in-progress: false

jobs:
  fix:
    name: Apply Task 15.5 test-loop fix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply test-loop fix
        run: python3 scripts/fix_task_15_5_test_loops.py "$GITHUB_WORKSPACE"

      - name: Remove temporary fix controls
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/fix-task-15-5-test-loops.yml \
            scripts/fix_task_15_5_test_loops.py

      - name: Commit clean test-loop fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-search/src/transposition/store.rs
          git diff --cached --check
          git commit -m "fix: iterate TT replacement fixtures idiomatically"
          git push origin HEAD:rust-engine
