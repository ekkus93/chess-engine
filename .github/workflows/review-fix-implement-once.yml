      - name: Format and reject suppression
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if grep --recursive --line-number --include='*.rs' --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify lockfile and metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
          cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        run: >-
          python scripts/differential_oracle.py
          --binary target/release/chess-tools
          --corpus fixtures/differential_corpus.tsv
          --games 12
          --plies 48
          --seed 0xC0FFEE

      - name: Commit clean implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git status --short
          git add crates docs .github/workflows/review-fix-implement-once.yml
          git commit -m "fix(rust): implement pre-Task-13 review fixes"
          git push origin HEAD:rust-engine
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report implementation run
        if: always()
        shell: bash
        run: |
          set +e
          head_sha="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          body=$(cat <<EOF
          One-shot Rust review-fix implementation run.

          - Result: ${{ job.status }}
          - Workflow run: ${{ github.run_id }}
          - Starting event SHA: ${{ github.sha }}
          - Current checkout SHA: ${head_sha}
          - Candidate SHA: ${IMPLEMENTATION_SHA:-not-created}
          EOF
          )
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "[review-fix-implementation] run ${{ github.run_id }}" --body "$body")"
          issue_number="${issue_url##*/}"
          gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
