#[cfg(test)]
mod tests {
    use crate::{Color, Game, GameError, GameStatus, Position, UciMove};

    fn play(game: &mut Game, text: &str) -> crate::GameUndo {
        let syntax = text.parse::<UciMove>().expect("test UCI syntax is valid");
        let current = game
