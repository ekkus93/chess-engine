name: Task 21 Hex Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-hex-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical seed grouping
        shell: bash
        run: |
          set -euo pipefail
          # This exact replacement is the only source mutation performed here.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/chess-tune/src/lib.rs')
          source = path.read_text()
          old = '0xC0FF_EE'
          new = '0x00C0_FFEE'
          if source.count(old) != 1:
              raise SystemExit(f'expected one {old} literal, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit literal correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tune/src/lib.rs
          git commit -m 'task 21.1: normalize deterministic seed literal'
          git push origin HEAD:master
