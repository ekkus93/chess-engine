name: Temporary console TUI migration check

on:
  push:
    paths:
      - .github/workflows/console-tui-migration-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility migration edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          exact(
              'crates/chess-app/src/controller.rs',
              '    fn schedule_if_needed(&mut self) -> Result<(), AppError> {',
              '    pub fn schedule_if_needed(&mut self) -> Result<(), AppError> {',
          )

          exact(
              'crates/chess-tui/src/app.rs',
              '        self.pending_search = None;\n        self.controller.resign_human()?;\n',
              '        self.controller.resign_human()?;\n        self.pending_search = None;\n',
          )
          exact(
              'crates/chess-tui/src/app.rs',
              '        let session = self\n            .session\n            .as_mut()\n            .ok_or_else(|| AppError::InvalidState("no game exists to mark saved".to_owned()))?;\n        self.saved_path = Some(path.clone());\n        session.status_message = Some(format!("Saved to {path}"));',
              '        let session = self\n            .controller\n            .session\n            .as_mut()\n            .ok_or_else(|| AppError::InvalidState("no game exists to mark saved".to_owned()))?;\n        session.status_message = Some(format!("Saved to {path}"));\n        self.saved_path = Some(path.clone());',
          )
          exact(
              'crates/chess-tui/src/app.rs',
              '    fn refresh_terminal_state(&mut self) -> Result<(), AppError> {',
              '    #[doc(hidden)]\n    pub fn refresh_terminal_state(&mut self) -> Result<(), AppError> {',
          )
          exact(
              'crates/chess-tui/src/app.rs',
              '    fn sync_pending_search(&mut self) -> Result<(), AppError> {',
              '    #[doc(hidden)]\n    pub fn schedule_if_needed(&mut self) -> Result<(), AppError> {\n        self.controller.schedule_if_needed()?;\n        self.sync_pending_search()\n    }\n\n    fn sync_pending_search(&mut self) -> Result<(), AppError> {',
          )

          exact(
              'crates/chess-tui/src/ui.rs',
              '    let input_nonempty = !session.move_input.is_empty();',
              '    let input_nonempty = !app.move_input.is_empty();',
          )
          exact(
              'crates/chess-tui/src/ui.rs',
              '                let input = app\n                    .session\n                    .as_ref()\n                    .map(|current| current.move_input.clone())\n                    .unwrap_or_default();',
              '                let input = app.move_input.clone();',
          )
          exact(
              'crates/chess-tui/src/ui.rs',
              '            KeyCode::Backspace => {\n                if let Some(session) = app.session.as_mut() {\n                    session.move_input.pop();\n                }\n            }',
              '            KeyCode::Backspace => {\n                app.move_input.pop();\n            }',
          )
          exact(
              'crates/chess-tui/src/ui.rs',
              '            KeyCode::Esc => {\n                if let Some(session) = app.session.as_mut() {\n                    session.move_input.clear();\n                }\n            }',
              '            KeyCode::Esc => {\n                app.move_input.clear();\n            }',
          )
          exact(
              'crates/chess-tui/src/ui.rs',
              '        format!("Move: {}_", session.move_input)',
              '        format!("Move: {}_", app.move_input)',
          )
          exact(
              'crates/chess-tui/src/ui.rs',
              'fn append_move_character(app: &mut AppState, character: char) {\n    if let Some(session) = app.session.as_mut() {\n        if session.move_input.len() < 5 {\n            session.move_input.push(character.to_ascii_lowercase());\n        }\n    }\n}',
              'fn append_move_character(app: &mut AppState, character: char) {\n    if app.move_input.len() < 5 {\n        app.move_input.push(character.to_ascii_lowercase());\n    }\n}',
          )

          ui_tests = Path('crates/chess-tui/src/ui/hardening_tests.rs')
          text = ui_tests.read_text()
          replacements = [
              ('app.session.as_ref().expect("session").move_input', 'app.move_input', 3),
              ('engine_turn\n        .session\n        .as_ref()\n        .expect("session")\n        .move_input', 'engine_turn.move_input', 1),
              ('self_play\n        .session\n        .as_ref()\n        .expect("session")\n        .move_input', 'self_play.move_input', 1),
              ('assert_eq!(session.saved_path, None);', 'assert_eq!(app.saved_path, None);', 2),
              ('session.saved_path.as_deref()', 'app.saved_path.as_deref()', 2),
              ('app.session.as_ref().expect("session").saved_path', 'app.saved_path', 3),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'ui hardening expected {expected} matches, found {actual}: {old!r}')
              text = text.replace(old, new)
          exact_unused = '    let session = app.session.as_ref().expect("session");\n    assert_eq!(\n        app.saved_path.as_deref(),\n'
          if text.count(exact_unused) != 1:
              raise SystemExit(f'ui hardening unused session seam count={text.count(exact_unused)}')
          text = text.replace(exact_unused, '    assert_eq!(\n        app.saved_path.as_deref(),\n')
          ui_tests.write_text(text)

          render_tests = Path('crates/chess-tui/src/render/hardening_tests.rs')
          text = render_tests.read_text()
          for old in ['        move_input: String::new(),\n', '        saved_path: None,\n']:
              if old not in text:
                  raise SystemExit(f'render hardening expected field missing: {old!r}')
              text = text.replace(old, '')
          render_tests.write_text(text)
          PY
      - name: Format migration
        run: cargo fmt --all
      - name: Resolve workspace lockfile from manifests
        run: cargo check -p chess-tui --all-targets
      - name: Verify shared layer locked
        run: cargo check --locked -p chess-app --all-targets
      - name: Verify TUI locked
        run: cargo check --locked -p chess-tui --all-targets
      - name: Strict Clippy shared and TUI
        run: |
          cargo clippy --locked -p chess-app --all-targets -- -D warnings
          cargo clippy --locked -p chess-tui --all-targets -- -D warnings
      - name: Test shared and TUI
        run: |
          cargo test --locked -p chess-app --all-targets
          cargo test --locked -p chess-tui --all-targets
      - name: Run TUI PTY acceptance suite
        run: bash scripts/dev.sh tui-pty-smoke
      - name: Commit validated migration and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/console-tui-migration-check.yml
          git add Cargo.lock crates/chess-tui crates/chess-app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(chess-tui): validate shared application migration'
          git push origin HEAD:master
