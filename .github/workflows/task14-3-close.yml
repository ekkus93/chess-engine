name: Task 14.3 Closure

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/close_task_14_3.py
      - .github/workflows/task14-3-close.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: task-14-3-closure-rust-engine
  cancel-in-progress: true

jobs:
  close:
    name: Task 14.3 full closure
    if: github.ref == 'refs/heads/rust-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Resolve closure job identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          job_id=""
          for _ in $(seq 1 20); do
            job_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[0].id // empty')"
            if test -n "$job_id"; then
              break
            fi
            sleep 2
          done
          test -n "$job_id"
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"

      - name: Prepare exact closure candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'aa23dcc12bcf2d8615a892d523dc82867c27a2ae95b16f06c0da7a939ef6bf9a  .github/close_task_14_3.py' | sha256sum --check
          python3 .github/close_task_14_3.py "$GITHUB_WORKSPACE" prepare
          cargo fmt --all -- --check
          git diff --check

      - name: Verify workspace and validation assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f fixtures/perft.tsv
          test -f fixtures/differential_corpus.tsv
          test -f requirements/oracle.txt
          test -f scripts/differential_oracle.py
          python3 -m py_compile scripts/differential_oracle.py

      - name: Reject first-party lint suppression
        shell: bash
        run: |
          set -euo pipefail
          if grep \
            --recursive \
            --line-number \
            --include='*.rs' \
            --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' \
            crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests and count coverage
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-features 2>&1 | tee /tmp/task14_3_cargo_test.log
          test_count="$(sed -nE 's/.*test result: ok\. ([0-9]+) passed;.*/\1/p' \
            /tmp/task14_3_cargo_test.log | awk '{ total += $1 } END { print total + 0 }')"
          test "$test_count" -ge 150
          echo "test_count=${test_count}" >> "$GITHUB_OUTPUT"

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Install pinned differential oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/task14_3_oracle
          /tmp/task14_3_oracle/bin/python -m pip install \
            --disable-pip-version-check \
            --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/task14_3_oracle/bin/python scripts/differential_oracle.py \
            --binary target/release/chess-tools \
            --corpus fixtures/differential_corpus.tsv \
            --games 12 \
            --plies 48 \
            --seed 0xC0FFEE

      - name: Close Task 14.3 and remove temporary controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/close_task_14_3.py \
            "$GITHUB_WORKSPACE" \
            close \
            "$GITHUB_RUN_ID" \
            "${{ steps.identity.outputs.job_id }}" \
            "${{ steps.tests.outputs.test_count }}"
          cargo fmt --all -- --check
          git diff --check
          rm .github/close_task_14_3.py .github/workflows/task14-3-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Task 14.3 quiet ordering"
          git push origin HEAD:rust-engine
