name: Task 24 Tracker Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task24-close.yml

permissions:
  contents: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update Task 24 trackers and memory
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          export NOW
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os
          import re

          implementation_head = '45f2263238f93a5ec4f06f4d4cbdef18f9b7def3'
          performance = '30952260264 / 92136936026, 92136935996'
          rust = '30952260291 / 92136935775'
          robustness = '30952260237 / 92136935690, 92136935729, 92136935792'
          android = '30952260236 / 92136936014, 92136936160, 92136936153'
          android_artifact = '8909672738'
          android_metrics = 'legal-move JNI average 1,832,214 ns; fixed-node search 89,106 total nodes in 896,094,777 ns (99,438 nodes/s); cancellation 4,388,550 ns; native heap deltas 1,053,504 bytes at 1 MiB hash and 16,781,168 bytes at 16 MiB hash'
          callgrind = '30950461692 / 92130944944 / 8908923833'
          definitions_section = '# Task 24: Performance hardening and regression budgets\n\n## 24.1 Baseline benchmark suite\n\n- [x] leaper attacks;\n- [x] sliding attacks;\n- [x] legal move generation;\n- [x] make/unmake;\n- [x] full and incremental hash;\n- [x] evaluation;\n- [x] perft positions;\n- [x] fixed-node search set;\n- [x] TT probe/store;\n- [x] cancellation latency;\n- [x] FFI legal-move/search calls.\n\n## 24.2 Profiling\n\n- [x] Profile release perft.\n- [x] Profile fixed-node search.\n- [x] Identify allocation counts.\n- [x] Confirm no recursive board clone.\n- [x] Confirm no normal-evaluation trace allocation.\n- [x] Confirm no string key construction in search.\n\n## 24.3 Optimizations after measurement\n\nMeasured decisions:\n\n- [x] Direct legal generation with check/pin masks was identified as a plausible perft optimization and deferred because it is a correctness-sensitive move-generation redesign.\n- [x] Faster sliding attacks were not justified by the measured profile.\n- [x] Static exchange evaluation / quiescence redesign was identified as a plausible search optimization and deferred because it changes tactical semantics and requires separate score/strength evidence.\n- [x] Incremental evaluation components were not justified by the measured profile.\n- [x] Compact move-list storage was not justified; the audited hot move-generation path is already allocation-free.\n- [x] TT packing changes were not justified; probe/store costs are small and the replacement/score contracts are correctness-sensitive.\n\n## 24.4 Regression policy\n\n- [x] Record reference hardware/toolchain.\n- [x] Establish stable medians and variance.\n- [x] Define acceptable regression tolerance.\n- [x] Add non-flaky CI or scheduled performance comparison.\n- [x] Keep correctness gates independent and mandatory.\n\n## 24.5 Android measurements\n\n- [x] AArch64 nodes/second through the native ARM64 core/C ABI baseline, explicitly not represented as physical-device Android evidence.\n- [x] Native heap deltas by hash size on API-35 Android instrumentation.\n- [x] Android cancellation latency.\n- [x] JNI legal-move and fixed-node search overhead.\n- [x] Repeated Android create/search/stop/destroy lifecycle stability.\n- [x] Sample controller main-thread compliance.\n\n### Task 24 completion evidence\n\n- Complete release harness: `crates/chess-tools/src/bin/performance.rs`.\n- Permanent architecture/source audit: `scripts/task_24_performance_audit.py`.\n- Conservative, unit-tested comparator: `scripts/compare_performance.py` and `scripts/tests/test_compare_performance.py`.\n- Versioned x86-64 and ARM64 references: `benchmarks/task24/`.\n- Permanent performance workflow: `.github/workflows/performance.yml`.\n- Contract and provenance: `docs/RUST_PERFORMANCE_GATES.md`.\n- Exact validated implementation head: `45f2263238f93a5ec4f06f4d4cbdef18f9b7def3`.\n- Performance run/jobs: `30952260264 / 92136936026, 92136935996`.\n- Rust run/job: `30952260291 / 92136935775`.\n- Robustness run/jobs: `30952260237 / 92136935690, 92136935729, 92136935792`.\n- Android run/jobs: `30952260236 / 92136936014, 92136936160, 92136936153`; Android metric artifact `8909672738`.\n- Callgrind run/job/artifact: `30950461692 / 92130944944 / 8908923833`.\n- Callgrind identified `Position::legal_moves` as 98.31% inclusive of perft instruction cost and quiescence as 95.46% inclusive of fixed-node search instruction cost. Both redesign candidates were documented and deferred rather than changing correctness-sensitive production behavior speculatively.\n- Zero-allocation hot-path enforcement, semantic checksums, operation counts, dual-signal timing budgets, and dual-signal allocation budgets are fail-closed and remain independent from exact correctness/robustness gates.\n\n**Task 24 gate:** Performance is measured, bounded, and protected; optimizations do not weaken exact perft, restoration, hash, differential, fuzz, Miri, sanitizer, JNI, or Android results. **COMPLETE.**\n\n---\n'

          path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md")
          text = path.read_text()
          updated, count = re.subn(
              r"# Task 24: Performance hardening and regression budgets\n.*?(?=\n# Task 25:)",
              definitions_section.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Task 24 definitions section replacement failed")
          path.write_text(updated)

          todo_section = dedent(f"""\
          # Task 24: Performance hardening — COMPLETE
          - [x] 24.1 Benchmarks.
          - [x] 24.2 Profiling.
          - [x] 24.3 Measured optimization decisions.
          - [x] 24.4 Regression policy.
          - [x] 24.5 Android measurements.
          - [x] Task 24 gate.

          ### Task 24 completion evidence

          - Complete release benchmark and allocation harness: `crates/chess-tools/src/bin/performance.rs`.
          - Permanent architecture audit and conservative, unit-tested comparator: `scripts/task_24_performance_audit.py`, `scripts/compare_performance.py`, and `scripts/tests/test_compare_performance.py`.
          - Versioned x86-64 and native ARM64 reference baselines: `benchmarks/task24/`.
          - Permanent dual-architecture performance workflow and Android metric artifact capture: `.github/workflows/performance.yml` and `.github/workflows/android.yml`.
          - Contract and provenance: `docs/RUST_PERFORMANCE_GATES.md`.
          - Exact validated implementation head: `{implementation_head}`.
          - Performance run/jobs: `{performance}`.
          - Rust run/job: `{rust}`.
          - Robustness run/jobs: `{robustness}`.
          - Android run/jobs: `{android}`; Android metric artifact `{android_artifact}`.
          - Android metrics: {android_metrics}.
          - Callgrind run/job/artifact: `{callgrind}`; `Position::legal_moves` accounted for 98.31% inclusive perft instruction cost and quiescence accounted for 95.46% inclusive fixed-node-search instruction cost.
          - Direct legal generation and SEE/quiescence redesign were documented as measured candidates and deferred because they require correctness/strength evidence. No speculative production optimization was accepted.
          - Task 25 developer workflows are next. The independent Task 21 tuned-candidate activation gate remains open.
          """)

          path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          text = path.read_text()
          text, count = re.subn(
              r"# Task 24: Performance hardening.*?(?=\n# Task 25:)",
              todo_section.rstrip(),
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Task 24 live tracker replacement failed")
          old_summary = "| 22–24 | **Not started**. |"
          new_summary = (
              "| 22 | **Complete** — advanced evaluation experiments and explicit activation decisions. |\n"
              "| 23 | **Complete** — fuzzing, Miri, sanitizers, leak checks, and permanent minimized regressions. |\n"
              "| 24 | **Complete** — dual-architecture benchmarks, allocation/profile evidence, Android metrics, and regression budgets. |"
          )
          if old_summary not in text:
              raise SystemExit("Program summary Task 22–24 marker missing")
          text = text.replace(old_summary, new_summary, 1)
          next_ops = dedent("""\
          ## Immediate next operations

          1. Begin Task 25 by consolidating bootstrap, fast-validation, full-validation, UCI, Android, self-play, tuning, and generated-artifact workflows into a new-developer path.
          2. Audit the remaining Task 25 documentation and CI checkboxes against repository reality before adding duplicate infrastructure.
          3. Independently, produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep the Task 21 gate open until a candidate passes and is explicitly activated.
          """)
          text, count = re.subn(
              r"## Immediate next operations\n.*\Z",
              next_ops.rstrip() + "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Immediate next operations replacement failed")
          path.write_text(text)

          path = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          text = path.read_text()
          text, count = re.subn(
              r"^\*\*Current phase:\*\*.*$",
              "**Current phase:** Task 24 performance gate complete; Task 25 developer workflows are next while the independent Task 21 activation gate remains open",
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("Ralph current phase replacement failed")
          if "| 24 / gate |" not in text:
              row = (
                  f"| 24 / gate | `{implementation_head}` | "
                  f"CI `{rust}`; Performance `{performance}`; Robustness `{robustness}`; "
                  f"Android `{android}` | dual-architecture baselines, allocation/profile evidence, "
                  "Android metrics, conservative regression budgets, and all independent correctness gates green |\n"
              )
              marker = "\n## Task 0 completion"
              if marker not in text:
                  raise SystemExit("Ralph completion-table insertion marker missing")
              text = text.replace(marker, "\n" + row + marker, 1)
          completion = dedent(f"""\
          ## Task 24 completion

          Implemented and validated:

          - a reproducible release benchmark covering attacks, legal generation, make/unmake, full/incremental hashing, evaluation, representative perft, fixed-node search, TT probe/store, cancellation, and C ABI legal/search calls;
          - fail-closed zero-allocation contracts for the core hot paths and structural audits rejecting recursive position clones, string/FEN search keys, and normal-evaluation tracing allocations;
          - seven-sample x86-64 and native ARM64 references with exact runner/toolchain provenance;
          - a conservative, unit-tested comparator protecting benchmark identity, operation counts, semantic checksums, timing distributions, and allocation distributions;
          - permanent push/manual/weekly Performance workflow artifacts;
          - release Callgrind evidence for perft and fixed-node search;
          - API-35 Android JNI latency, fixed-node throughput, hash-size heap deltas, cancellation latency, repeated lifecycle, and main-thread compliance evidence;
          - a measured decision not to introduce speculative move-generation, quiescence/SEE, sliding, incremental-evaluation, move-list, or TT-layout changes without separate correctness and strength evidence;
          - `docs/RUST_PERFORMANCE_GATES.md`.

          Evidence:

          - exact validated implementation SHA: `{implementation_head}`;
          - Performance run/jobs: `{performance}`;
          - Rust run/job: `{rust}`;
          - Robustness run/jobs: `{robustness}`;
          - Android run/jobs: `{android}`;
          - Android metric artifact: `{android_artifact}`;
          - Android metrics: {android_metrics};
          - Callgrind run/job/artifact: `{callgrind}`;
          - all permanent performance, workspace correctness, differential, fuzz, Miri, sanitizer, leak, JNI, and Android gates passed.

          Task 24 is complete. Task 25 developer workflows are next; the independent Task 21 tuned-candidate activation gate remains open.
          """)
          if "## Task 24 completion" not in text:
              text = text.rstrip() + "\n\n" + completion.strip() + "\n"
          path.write_text(text)

          path = Path("memory.md")
          text = path.read_text()
          memory = dedent(f"""\
          ## {os.environ['NOW']} - GPT-5.6 Thinking - Rust port Task 24 performance gate complete
          - Completed Task 24 on `master` at validated implementation head `{implementation_head}` with a release benchmark/allocation harness, source audit, unit-tested conservative comparator, versioned x86-64/ARM64 references, permanent Performance workflow, Android metric artifacts, and `docs/RUST_PERFORMANCE_GATES.md`.
          - Validation evidence: Performance `{performance}`; Rust `{rust}`; Robustness `{robustness}`; Android `{android}`; Android artifact `{android_artifact}`; Callgrind `{callgrind}`.
          - Android metrics: {android_metrics}.
          - Callgrind measured `Position::legal_moves` at 98.31% inclusive of perft instruction cost and quiescence at 95.46% inclusive of fixed-node-search instruction cost. Direct legal generation and SEE/quiescence redesign remain documented follow-up candidates; no correctness-sensitive production optimization was made speculatively.
          - Task 25 developer workflows are next. The independent Task 21 real tuned-candidate activation gate remains open.
          """)
          path.write_text(text.rstrip() + "\n\n" + memory.strip() + "\n")
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            memory.md
          git diff --cached --check
          git commit -m 'docs: close Task 24 performance gate'
          git push origin HEAD:master

      - name: Record exact closure helper
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Task 24 tracker closure',
              `- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- id: \`${context.runId}\``,
              `- job status: \`${{ job.status }}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body,
            });
