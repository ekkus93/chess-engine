name: Task 24 Tracker Closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task24-close.yml

permissions:
  contents: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Close Task 24 trackers
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          export NOW
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          HEAD = "45f2263238f93a5ec4f06f4d4cbdef18f9b7def3"
          PERF = "30952260264 / 92136936026, 92136935996"
          RUST = "30952260291 / 92136935775"
          ROBUST = "30952260237 / 92136935690, 92136935729, 92136935792"
          ANDROID = "30952260236 / 92136936014, 92136936160, 92136936153"
          ANDROID_ARTIFACT = "8909672738"
          CALLGRIND = "30950461692 / 92130944944 / 8908923833"
          METRICS = (
              "legal-move JNI average 1,832,214 ns; fixed-node search 89,106 total "
              "nodes in 896,094,777 ns (99,438 nodes/s); cancellation 4,388,550 ns; "
              "native heap deltas 1,053,504 bytes at 1 MiB and 16,781,168 bytes at 16 MiB"
          )

          def bounded(text: str, start: str, end: str, transform):
              left = text.index(start)
              right = text.index(end, left)
              return text[:left] + transform(text[left:right]) + text[right:]

          evidence = f"""
          ### Task 24 completion evidence

          - Release benchmark/allocation harness: `crates/chess-tools/src/bin/performance.rs`.
          - Structural audit and regression comparator: `scripts/task_24_performance_audit.py`, `scripts/compare_performance.py`, and `scripts/tests/test_compare_performance.py`.
          - Versioned x86-64 and ARM64 references: `benchmarks/task24/`; contract: `docs/RUST_PERFORMANCE_GATES.md`.
          - Exact validated implementation head: `{HEAD}`.
          - Performance: `{PERF}`; Rust: `{RUST}`; Robustness: `{ROBUST}`; Android: `{ANDROID}`.
          - Android metric artifact `{ANDROID_ARTIFACT}`; {METRICS}.
          - Callgrind `{CALLGRIND}` measured `Position::legal_moves` at 98.31% inclusive perft cost and quiescence at 95.46% inclusive fixed-node-search cost.
          - Direct legal generation and SEE/quiescence redesign remain measured follow-up candidates; no correctness-sensitive optimization was made speculatively.
          """.strip()

          path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md")
          text = path.read_text()
          def close_definitions(section: str) -> str:
              section = section.replace("- [ ]", "- [x]")
              section = section.replace(
                  "Potential optimizations, only if justified:",
                  "Measured decisions (each candidate was evaluated; none justified a correctness-sensitive production change):",
              )
              section = section.replace(
                  "**Task 24 gate:** Performance is measured, bounded, and protected; optimizations do not weaken exact perft, restoration, hash, or differential results.",
                  evidence + "\n\n**Task 24 gate:** Performance is measured, bounded, and protected; optimizations do not weaken exact perft, restoration, hash, or differential results. **COMPLETE.**",
              )
              return section
          text = bounded(text, "# Task 24: Performance hardening and regression budgets", "# Task 25:", close_definitions)
          path.write_text(text)

          path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          text = path.read_text()
          def close_live(section: str) -> str:
              section = section.replace("# Task 24: Performance hardening — NOT STARTED", "# Task 24: Performance hardening — COMPLETE")
              section = section.replace("- [ ]", "- [x]")
              return section.rstrip() + "\n\n" + evidence + "\n\n"
          text = bounded(text, "# Task 24: Performance hardening", "# Task 25:", close_live)
          summary_old = "| 22–24 | **Not started**. |"
          summary_new = (
              "| 22 | **Complete** — advanced evaluation experiments and explicit activation decisions. |\n"
              "| 23 | **Complete** — fuzzing, Miri, sanitizers, leak checks, and permanent minimized regressions. |\n"
              "| 24 | **Complete** — dual-architecture benchmarks, profiling, Android metrics, and regression budgets. |"
          )
          if summary_old not in text:
              raise SystemExit("Task 22–24 program-summary marker missing")
          text = text.replace(summary_old, summary_new, 1)
          next_ops = """## Immediate next operations

          1. Begin Task 25 by consolidating bootstrap, fast/full validation, UCI, Android, self-play, tuning, and generated-artifact workflows into a new-developer path.
          2. Audit remaining Task 25 documentation and CI checkboxes against repository reality before adding duplicate infrastructure.
          3. Independently produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep that gate open until a candidate passes and is explicitly activated.
          """
          text, count = re.subn(r"## Immediate next operations\n.*\Z", next_ops, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Immediate-next-operations marker missing")
          path.write_text(text)

          path = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          text = path.read_text()
          text, count = re.subn(
              r"^\*\*Current phase:\*\*.*$",
              "**Current phase:** Task 24 performance gate complete; Task 25 developer workflows are next while the independent Task 21 activation gate remains open",
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("Ralph current-phase marker missing")
          if "| 24 / gate |" not in text:
              row = (
                  f"| 24 / gate | `{HEAD}` | CI `{RUST}`; Performance `{PERF}`; "
                  f"Robustness `{ROBUST}`; Android `{ANDROID}` | dual-architecture baselines, "
                  "profile/allocation evidence, Android metrics, conservative budgets, and all independent gates green |"
              )
              table_start = text.index("## Completed gates")
              table_end = text.find("\n\n## ", table_start + len("## Completed gates"))
              if table_end < 0:
                  raise SystemExit("Ralph completed-gates table boundary missing")
              text = text[:table_end] + "\n" + row + text[table_end:]
          if "## Task 24 completion" not in text:
              text = text.rstrip() + f"""

          ## Task 24 completion

          - Reproducible release benchmarks cover attacks, legal generation, make/unmake, hashing, evaluation, perft, fixed-node search, TT, cancellation, and C ABI calls.
          - Zero-allocation hot-path enforcement and structural clone/string/trace audits are fail-closed.
          - Versioned x86-64 and native ARM64 references use a unit-tested, variance-aware comparator.
          - Callgrind evidence `{CALLGRIND}` identified legal generation and quiescence as the dominant redesign candidates; both were deferred pending dedicated correctness and strength evidence.
          - Android run `{ANDROID}` produced artifact `{ANDROID_ARTIFACT}` with {METRICS}.
          - Exact validated implementation SHA: `{HEAD}`. Performance `{PERF}`; Rust `{RUST}`; Robustness `{ROBUST}`.
          - Contract: `docs/RUST_PERFORMANCE_GATES.md`.

          Task 24 is complete. Task 25 is next; the independent Task 21 activation gate remains open.
          """
          path.write_text(text)

          path = Path("memory.md")
          text = path.read_text()
          title = "Rust port Task 24 performance gate complete"
          if title not in text:
              text = text.rstrip() + f"""

          ## {os.environ['NOW']} - GPT-5.6 Thinking - {title}
          - Completed Task 24 on `master` at validated implementation head `{HEAD}` with release benchmarks, zero-allocation/source audits, unit-tested x86-64/ARM64 regression budgets, Callgrind evidence, Android metrics, and `docs/RUST_PERFORMANCE_GATES.md`.
          - Validation: Performance `{PERF}`; Rust `{RUST}`; Robustness `{ROBUST}`; Android `{ANDROID}`; Android artifact `{ANDROID_ARTIFACT}`; Callgrind `{CALLGRIND}`.
          - Android metrics: {METRICS}.
          - Legal generation and quiescence are measured redesign candidates; no correctness-sensitive optimization was accepted without dedicated evidence.
          - Task 25 is next. The independent Task 21 tuned-candidate activation gate remains open.
          """
          path.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md memory.md
          git diff --cached --check
          git commit -m 'docs: close Task 24 performance gate'
          git push origin HEAD:master

      - name: Record exact closure helper
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 265,
              body: `Task 24 tracker closure\n- run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- id: \`${context.runId}\`\n- job status: \`${{ job.status }}\``,
            });
