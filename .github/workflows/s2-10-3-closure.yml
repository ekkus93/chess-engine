name: S2-10.3 late quiet-move pruning closure

on:
  push:
    branches:
      - master
    paths:
      - .github/s2_10_3_close.py
      - .github/workflows/s2-10-3-closure.yml

permissions:
  contents: write

concurrency:
  group: s2-10-3-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    name: Audit and record S2-10.3 disposition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9f0ba7267ceab406a8bb1fa3cb9cc0d0699fe226"

      - name: Produce fail-closed decision record
        run: python3 .github/s2_10_3_close.py

      - name: Run inherited search audits
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/task_s2_8_lmr_audit.sh
          bash scripts/task_s2_9_null_move_validation_audit.sh
          git diff --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate unchanged search tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p chess-search --all-targets --all-features
          cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings

      - name: Commit decision record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md \
            docs/RUST_CHESS_ENGINE_V0_2_S2_10_3_LATE_QUIET_MOVE_PRUNING_2026-08-06.md
          git diff --cached --exit-code && {
            echo "expected S2-10.3 closure changes are missing" >&2
            exit 1
          }
          git commit -m "search: defer S2-10.3 late quiet-move pruning"
          git push origin HEAD:master
