name: Task 20 Trusted Tracker Closure

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: task20-trusted-tracker-closure
  cancel-in-progress: false

jobs:
  close:
    if: >-
      github.actor == 'ekkus93' &&
      github.event.pull_request.title == '[run-task20-closure-pr]' &&
      github.event.pull_request.head.ref == 'task20-closure-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Task 20 closure branch
        uses: actions/checkout@v4
        with:
          ref: task20-tracker-closure
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply and verify tracker closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/task20_close.py
          git diff --check
          git rm scripts/task20_close.py
          git rm -f .github/workflows/task20-close.yml .github/task20-close-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
                  docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
                  docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
                  docs/RUST_SELF_PLAY_DATASET.md
          git commit -m 'Close Task 20 trackers'
          git push origin HEAD:task20-tracker-closure

      - name: Remove trusted workflow from master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Delete trusted closure controller
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/task20-close-trusted.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove Task 20 closure controller'
          git push origin HEAD:master
