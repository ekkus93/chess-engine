name: Android Second Corrections Promotion Probe

on:
  push:
    branches:
      - master
    paths:
      - android-harness/host-jvm/src/test/kotlin/com/ekkus93/chessengine/PromotionPathEvidenceTest.kt
      - .github/workflows/android-second-corrections-promotion-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Bounded real-engine promotion-path probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build host JNI library
        run: cargo build --locked -p chess-jni --release

      - name: Execute bounded promotion-path evidence search
        env:
          PROMOTION_EVIDENCE_PATH: ${{ github.workspace }}/promotion-path-evidence.txt
        run: >-
          gradle -p android-harness :host-jvm:test
          --tests com.ekkus93.chessengine.PromotionPathEvidenceTest
          --no-daemon --stacktrace --console=plain
          | tee promotion-path-gradle.log

      - name: Verify blocker evidence exists
        run: |
          set -euo pipefail
          test -s promotion-path-evidence.txt
          grep -F 'RESULT=NOT_FOUND' promotion-path-evidence.txt
          if grep -Fq 'RESULT=FOUND' promotion-path-evidence.txt; then
            echo 'bounded probe found a promotion path; blocker disposition is invalid' >&2
            exit 1
          fi
          cat promotion-path-evidence.txt

      - name: Preserve promotion-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-second-corrections-promotion-probe-${{ github.sha }}
          path: |
            promotion-path-evidence.txt
            promotion-path-gradle.log
          if-no-files-found: error
          retention-days: 30
