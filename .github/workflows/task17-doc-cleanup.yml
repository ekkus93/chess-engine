name: Task 17.1 documentation cleanup

on:
  push:
    branches:
      - rust-engine

permissions:
  contents: write

concurrency:
  group: task17-doc-cleanup-rust-engine
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Skip cleanup commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "docs: remove stale Task 17.1 next markers" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale markers
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          text = path.read_text()
          old = "Task 17.1 protocol loop is next."
          count = text.count(old)
          if count == 0:
              raise SystemExit("no stale Task 17.1 marker found")
          path.write_text(
              text.replace(
                  old,
                  "Task 17.1 protocol loop is complete; Task 17.2 UCI search worker is next.",
              )
          )
          print(f"replaced {count} stale marker(s)")
          PY
          grep -F -- 'Task 17.1 protocol loop is complete; Task 17.2 UCI search worker is next.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          ! grep -F -- 'Task 17.1 protocol loop is next.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          git diff --cached --check
          git commit -m "docs: remove stale Task 17.1 next markers"
          git push origin HEAD:rust-engine
