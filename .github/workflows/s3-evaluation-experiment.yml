name: S3 Evaluation Experiment

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s3-evaluation-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-evaluation-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    name: S3 dataset and grouped tuning
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release tooling
        run: cargo build --locked --release -p chess-tools --bin chess-tools

      - name: Write frozen self-play config
        shell: bash
        run: |
          cat > /tmp/s3-self-play.txt <<'EOF'
          schema=1
          games=32
          seed=1395864373
          maximum_plies=256
          white_limit=depth:1
          white_tt_mib=1
          white_check_extension=false
          black_limit=depth:1
          black_tt_mib=1
          black_check_extension=false
          claimable_draw=accept
          opening_positions=exclude
          split_train=70
          split_validation=20
          split_test=10
          opening_path=fixtures/self_play_openings.tsv
          EOF

      - name: Generate deterministic S3 dataset twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/s3-data /tmp/s3-data-first
          target/release/chess-tools s3-self-play "$GITHUB_SHA" /tmp/s3-self-play.txt /tmp/s3-data | tee /tmp/s3-self-play-first.log
          cp -a /tmp/s3-data /tmp/s3-data-first
          rm -rf /tmp/s3-data
          target/release/chess-tools s3-self-play "$GITHUB_SHA" /tmp/s3-self-play.txt /tmp/s3-data | tee /tmp/s3-self-play-second.log
          cmp -r /tmp/s3-data-first /tmp/s3-data
          cmp /tmp/s3-self-play-first.log /tmp/s3-self-play-second.log
          target/release/chess-tools s3-self-play-validate /tmp/s3-data | tee /tmp/s3-self-play-validation.log
          grep -Fxq $'admitted_for_tuning\ttrue' /tmp/s3-self-play-validation.log

      - name: Write frozen tuning configs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3-configs
          groups=(
            material_and_piece_square
            mobility_and_activity
            pawn_structure
            king_safety_and_space
            endgame_king_activity
            full_existing_evaluator
          )
          candidate_ids=(
            5995213947818487857
            5995213947818487858
            5995213947818487859
            5995213947818487860
            5995213947818487861
            5995213947818487862
          )
          seeds=(1395864401 1395864402 1395864403 1395864404 1395864405 1395864406)
          for index in "${!groups[@]}"; do
            group="${groups[$index]}"
            cat > "/tmp/s3-configs/${group}.txt" <<EOF
          CHESS_TUNING_CONFIG	1
          engine_identifier=5995211731466014277
          initial_weight_identifier=4774188637087157829
          candidate_weight_identifier=${candidate_ids[$index]}
          source_commit=${GITHUB_SHA}
          generated_at_unix_seconds=1786110300
          maximum_iterations=8
          advance_iterations=8
          learning_rate=0.5
          step_decay=0.602
          perturbation_size=2.0
          perturbation_decay=0.101
          stability_constant=10.0
          minimum_weight=-2000
          maximum_weight=2000
          regularization_strength=0.0001
          random_seed=${seeds[$index]}
          k_minimum=0.1
          k_maximum=3.0
          k_intervals=20
          EOF
          done

      - name: Tune all existing-evaluator groups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s3-tuning
          groups=(
            material_and_piece_square
            mobility_and_activity
            pawn_structure
            king_safety_and_space
            endgame_king_activity
            full_existing_evaluator
          )
          for group in "${groups[@]}"; do
            target/release/chess-tools tune-group \
              "$group" \
              "/tmp/s3-configs/${group}.txt" \
              /tmp/s3-data \
              "/tmp/s3-tuning/${group}" \
              | tee "/tmp/s3-tuning/${group}.log"
            test -f "/tmp/s3-tuning/${group}/ACTIVATION_DISABLED"
            test -f "/tmp/s3-tuning/${group}/s3-summary.tsv"
            grep -Fxq $'activated\tfalse' "/tmp/s3-tuning/${group}/s3-summary.tsv"
          done

      - name: Prove a grouped run is byte deterministic
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/s3-tuning/pawn_structure /tmp/pawn-first
          cp /tmp/s3-tuning/pawn_structure.log /tmp/pawn-first.log
          rm -rf /tmp/s3-tuning/pawn_structure
          target/release/chess-tools tune-group \
            pawn_structure \
            /tmp/s3-configs/pawn_structure.txt \
            /tmp/s3-data \
            /tmp/s3-tuning/pawn_structure \
            | tee /tmp/s3-tuning/pawn_structure.log
          cmp -r /tmp/pawn-first /tmp/s3-tuning/pawn_structure
          cmp /tmp/pawn-first.log /tmp/s3-tuning/pawn_structure.log

      - name: Record grouped held-out loss evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo -e 'group\tmask_fingerprint\ttraining_loss_delta\tvalidation_loss_delta\tactivated'
            for summary in /tmp/s3-tuning/*/s3-summary.tsv; do
              group="$(awk -F '\t' '$1=="group" {print $2}' "$summary")"
              mask="$(awk -F '\t' '$1=="mask_fingerprint" {print $2}' "$summary")"
              train="$(awk -F '\t' '$1=="training_loss_delta" {print $2}' "$summary")"
              valid="$(awk -F '\t' '$1=="validation_loss_delta" {print $2}' "$summary")"
              active="$(awk -F '\t' '$1=="activated" {print $2}' "$summary")"
              printf '%s\t%s\t%s\t%s\t%s\n' "$group" "$mask" "$train" "$valid" "$active"
            done
          } | tee /tmp/s3-group-losses.tsv

      - name: Assemble evidence package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s3-evidence
          cp -a /tmp/s3-data s3-evidence/dataset
          cp -a /tmp/s3-configs s3-evidence/tuning-configs
          cp -a /tmp/s3-tuning s3-evidence/tuning
          cp /tmp/s3-self-play*.log s3-evidence/
          cp /tmp/s3-group-losses.tsv s3-evidence/
          printf '%s\n' "$GITHUB_SHA" > s3-evidence/source-sha.txt
          printf 'activated\tfalse\n' > s3-evidence/ACTIVATION_DISABLED

      - name: Upload S3 experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3-evaluation-experiment-${{ github.sha }}
          path: s3-evidence
          if-no-files-found: error
          retention-days: 30
