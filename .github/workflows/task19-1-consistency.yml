name: Task 19.1 Tracker Consistency

on:
  push:
    branches:
      - task19-1-opening-book-abstraction
  pull_request:
    branches:
      - rust-engine
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task19-1-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair Task 19 summary labels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task19-1-opening-book-abstraction
          fetch-depth: 0

      - name: Apply guarded summary repair
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/task19_1_tracker_consistency.py ]]; then
            echo "Consistency script is already absent; no action required."
            exit 0
          fi
          git merge-base --is-ancestor a27ef64ae467dd0997f96b21d9ec873c15a112ef HEAD
          python3 scripts/task19_1_tracker_consistency.py
          git rm scripts/task19_1_tracker_consistency.py

      - name: Verify and commit summary repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No consistency changes to commit."
            exit 0
          fi
          grep -F '# Task 19: Opening book — IN PROGRESS' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F 'Task 19.1 opening-book abstraction is complete. Task 19.2 backend format is next.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [x] 19.1 Abstraction.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] 19.2 Format.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] Task 19 gate.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          git diff --cached --check
          git commit -m "docs: align Task 19 summary status"
          git push origin HEAD:task19-1-opening-book-abstraction
