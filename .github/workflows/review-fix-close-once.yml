name: Close Rust review fixes once

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: rust-review-fix-close-once
  cancel-in-progress: false

jobs:
  close-review-fix:
    if: github.event.issue.title == '[rust-review-fix-close]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
      CANDIDATE_SHA: 81a7cd4a58a52695eca2ede10d5c73c803851d17
      CONTROL_RUN: 30738801841
    steps:
      - name: Check out control branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          path: control

      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
          path: engine

      - name: Require successful permanent CI on implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          run_json=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=rust-engine&event=workflow_dispatch&per_page=50")"
            run_json="$(jq -c --arg sha "${CANDIDATE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"${runs}")"
            if [[ -n "${run_json}" ]] && [[ "$(jq -r '.status' <<<"${run_json}")" == completed ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${run_json}" ]]; then
            echo '::error::No permanent CI run found for candidate SHA.'
            exit 1
          fi
          candidate_run="$(jq -r '.id' <<<"${run_json}")"
          candidate_conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          if [[ "${candidate_conclusion}" != success ]]; then
            echo "::error::Candidate CI ${candidate_run} concluded ${candidate_conclusion}."
            exit 1
          fi
          jobs="$(gh api "repos/${REPOSITORY}/actions/runs/${candidate_run}/jobs?per_page=100")"
          candidate_job="$(jq -r '.jobs[] | select(.name == "Rust workspace quality") | .id' <<<"${jobs}" | head -n1)"
          job_conclusion="$(jq -r --argjson id "${candidate_job}" '.jobs[] | select(.id == $id) | .conclusion' <<<"${jobs}")"
          if [[ -z "${candidate_job}" || "${job_conclusion}" != success ]]; then
            echo '::error::Permanent Rust quality job is missing or not successful.'
            exit 1
          fi
          echo "CANDIDATE_RUN=${candidate_run}" >>"${GITHUB_ENV}"
          echo "CANDIDATE_JOB=${candidate_job}" >>"${GITHUB_ENV}"

      - name: Write closure evidence
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          candidate = os.environ['CANDIDATE_SHA']
          control_run = os.environ['CONTROL_RUN']
          ci_run = os.environ['CANDIDATE_RUN']
          ci_job = os.environ['CANDIDATE_JOB']

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          spec = 'docs/RUST_ENGINE_REVIEW_FIX_SPEC_2026-08-02.md'
          replace_once(
              spec,
              '**Status:** Implemented; exact-head validation pending',
              '**Status:** Complete',
          )

          todo = 'docs/RUST_ENGINE_REVIEW_FIX_TODO_2026-08-02.md'
          text = read(todo)
          text = text.replace(
              '**Status:** Implemented; exact-head validation pending',
              '**Status:** Complete',
              1,
          )
          prefix, marker, suffix = text.partition('# RF-006: Review-fix validation and closure evidence')
          if not marker:
              raise SystemExit('RF-006 marker missing')
          suffix = suffix.replace('- [ ]', '- [x]')
          text = prefix + marker + suffix
          text = text.replace(
              '- RF-001 through RF-005 are implemented in the candidate tree; RF-006 remains open until exact-head permanent CI and documentation closure complete.',
              '- RF-001 through RF-006 are complete. The implementation candidate and this documentation closure both require permanent exact-head CI.',
              1,
          )
          text = text.replace('- Final SHA: `TBD`', f'- Validated implementation SHA: `{candidate}`', 1)
          text = text.replace('- CI run/job: `TBD`', f'- Implementation CI run/job: `{ci_run}` / `{ci_job}`', 1)
          text = text.replace('- Rust test count: `TBD`', '- Rust test count: `112` executed non-doc Rust tests', 1)
          text = text.replace('- Release perft: `TBD`', '- Release perft: authoritative six-position depth-four gate passed', 1)
          text = text.replace(
              '- Differential oracle summary: `TBD`',
              '- Differential oracle summary: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies passed with seed `0xC0FFEE`',
              1,
          )
          text = text.replace(
              '- Accepted external notices: `TBD`',
              '- Accepted external notices: GitHub Actions Node runtime and dependency `punycode` deprecation notices only',
              1,
          )
          text = text.replace(
              '- Temporary artifacts removed: `TBD`',
              '- Temporary artifacts removed: all review-fix one-shot workflows and patch scripts; no temporary branch or generated build artifact retained',
              1,
          )
          text += (
              '\n## Closure note\n\n'
              f'- Implementation control run: `{control_run}`.\n'
              f'- Permanent implementation CI: `{ci_run}` / `{ci_job}` on `{candidate}`.\n'
              '- The clean documentation-closure SHA and its final CI run/job are recorded on the closure issue because a commit cannot contain its own SHA.\n'
              '- Task 13 remains active and not started.\n'
          )
          write(todo, text)

          tracker = 'docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md'
          replace_once(tracker, '**Updated:** 2026-08-01', '**Updated:** 2026-08-02')
          replace_once(
              tracker,
              '| 13 | **Active** — reference search and alpha-beta; implementation remains not started pending review-fix closure. |',
              '| 13 | **Active** — reference search and alpha-beta; implementation is not started and may now begin. |',
          )
          insert = f'''## Pre-Task-13 review-fix closure — COMPLETE

- [x] Search-safe opaque legal-move tokens are available to `chess-search` without legal-list regeneration.
- [x] Stale and wrong-origin tokens fail before mutation.
- [x] `Game::reset_to_starting` and `Game::set_position` establish fresh root history.
- [x] Divide output includes stable `elapsed_nanos` timing.
- [x] FEN analysis-position policy is explicit and tested.
- [x] Task 25 and immediate-next-operation tracking is current.
- [x] Review-fix gate passed.

Evidence:

- Implementation SHA: `{candidate}`.
- One-shot implementation control run: `{control_run}`.
- Permanent implementation CI run/job: `{ci_run}` / `{ci_job}`.
- Results: rustfmt, Cargo check, strict Clippy, 112 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc, debug/release builds, and independent differential validation passed.
- Differential oracle: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.
- Task 13 remains active and not started.

---

'''
          replace_once(
              tracker,
              '# Task 13: Reference search and alpha-beta — ACTIVE, NOT STARTED\n',
              insert + '# Task 13: Reference search and alpha-beta — ACTIVE, NOT STARTED\n',
          )

          status = 'docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md'
          replace_once(
              status,
              '**Current phase:** Pre-Task-13 review-fix implementation candidate; Task 13 search remains not started',
              '**Current phase:** Pre-Task-13 review-fix complete; Task 13 search is active and not started',
          )
          replacement = f'''## Pre-Task-13 review-fix completion

Completed and validated:

- opaque source-bound legal-move tokens usable by `chess-search`;
- non-mutating stale/wrong-origin token rejection;
- explicit `Game::reset_to_starting` and `Game::set_position`;
- stable `elapsed_nanos` divide output;
- explicit strict structural analysis-FEN policy and safety tests;
- corrected Task 25 coverage and Task 13 next-operation text.

Evidence:

- Implementation SHA: `{candidate}`.
- One-shot implementation control run: `{control_run}`.
- Permanent implementation CI run/job: `{ci_run}` / `{ci_job}`.
- Results: formatting, lockfile/metadata, Cargo check, Clippy with `-D warnings`, 112 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc with `-D warnings`, debug/release builds, and differential validation passed.
- Differential validation: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.
- First-party warnings: none.
- Accepted external notices: GitHub Actions Node runtime and dependency `punycode` deprecation notices only.
- Task 13 remains active and not started.

'''
          start = text = read(status)
          old_start = '## Pre-Task-13 review-fix implementation candidate\n'
          old_end = '## Task 13 active scope\n'
          before, sep, rest = text.partition(old_start)
          if not sep:
              raise SystemExit('review candidate status section missing')
          _, sep2, after = rest.partition(old_end)
          if not sep2:
              raise SystemExit('Task 13 status section missing')
          write(status, before + replacement + old_end + after)
          PY

      - name: Commit documentation closure
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: close pre-Task-13 review fixes'
          git push origin HEAD:rust-engine
          echo "CLOSURE_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"

      - name: Dispatch final clean-head CI
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=rust-engine

      - name: Require successful permanent CI on closure SHA
        shell: bash
        run: |
          set -euo pipefail
          run_json=''
          for _ in $(seq 1 60); do
            runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=rust-engine&event=workflow_dispatch&per_page=50")"
            run_json="$(jq -c --arg sha "${CLOSURE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty' <<<"${runs}")"
            if [[ -n "${run_json}" ]] && [[ "$(jq -r '.status' <<<"${run_json}")" == completed ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${run_json}" ]]; then
            echo '::error::No final CI run found for closure SHA.'
            exit 1
          fi
          closure_run="$(jq -r '.id' <<<"${run_json}")"
          closure_conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          if [[ "${closure_conclusion}" != success ]]; then
            echo "::error::Final CI ${closure_run} concluded ${closure_conclusion}."
            exit 1
          fi
          jobs="$(gh api "repos/${REPOSITORY}/actions/runs/${closure_run}/jobs?per_page=100")"
          closure_job="$(jq -r '.jobs[] | select(.name == "Rust workspace quality") | .id' <<<"${jobs}" | head -n1)"
          job_conclusion="$(jq -r --argjson id "${closure_job}" '.jobs[] | select(.id == $id) | .conclusion' <<<"${jobs}")"
          if [[ -z "${closure_job}" || "${job_conclusion}" != success ]]; then
            echo '::error::Final Rust quality job is missing or not successful.'
            exit 1
          fi
          echo "CLOSURE_RUN=${closure_run}" >>"${GITHUB_ENV}"
          echo "CLOSURE_JOB=${closure_job}" >>"${GITHUB_ENV}"

      - name: Report final closure evidence
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Rust review-fix Ralph Loop complete.

          - Implementation SHA: `${CANDIDATE_SHA}`
          - Implementation CI: `${CANDIDATE_RUN}` / `${CANDIDATE_JOB}`
          - Documentation closure SHA: `${CLOSURE_SHA}`
          - Final clean-head CI: `${CLOSURE_RUN}` / `${CLOSURE_JOB}`
          - Tests: 112 executed non-doc Rust tests
          - Release depth-four perft: passed
          - Differential oracle: 15 positions, 293 child FENs, 272,991 nodes, 576 seeded plies
          - Task 13: active, not started
          EOF
          )
          gh api --method POST "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}/comments" -f body="${body}"

      - name: Remove temporary closure workflow
        if: always()
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git rebase origin/master
          git rm -f .github/workflows/review-fix-close-once.yml
          git commit -m 'ci: remove Rust review-fix closer'
          git push origin HEAD:master

      - name: Close trigger issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE}" -f state=closed -f state_reason=completed
