name: S3 Phase 1 Stage

on:
  push:
    branches:
      - master
    paths:
      - .github/s3_phase1.py
      - .github/workflows/s3-phase1-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s3-phase1-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply S3 phase 1 changes
        run: python3 .github/s3_phase1.py

      - name: Format generated Rust changes
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run focused chess-core tests
        run: cargo test --locked -p chess-core editor_mutation_is_hash_neutral_until_the_caller_updates_hash_state -- --exact

      - name: Run UCI process tests
        run: cargo test --locked -p chess-uci --test uci_process

      - name: Run S3 guardrail audit
        run: bash scripts/task_s3_evaluation_strength_audit.sh

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit validated phase 1 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            crates/chess-core/src/lib.rs \
            crates/chess-core/src/position/mod.rs \
            crates/chess-core/src/position/editor.rs \
            crates/chess-uci/tests/uci_process.rs \
            docs/RUST_MAKE_UNMAKE.md \
            docs/RUST_CHESS_ENGINE_S3_EVALUATION_STRENGTH_SPEC_2026-08-07.md \
            docs/RUST_CHESS_ENGINE_S3_BASELINE_2026-08-07.md \
            scripts/task_post_port_review_fix_audit.sh \
            scripts/task_s3_evaluation_strength_audit.sh
          git diff --cached --exit-code && {
            echo "No S3 phase 1 source changes to commit"
            exit 0
          }
          git commit -m "feat: harden S3 evaluation baseline guardrails"
          git push origin HEAD:master
