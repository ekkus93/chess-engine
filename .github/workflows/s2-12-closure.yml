name: S2-12 Syzygy decision closure

on:
  push:
    branches:
      - master
    paths:
      - .github/s2_12_close.py
      - .github/workflows/s2-12-closure.yml

permissions:
  contents: write

concurrency:
  group: s2-12-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    name: Close S2-12 and preserve permanent audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "73a32fa2426713136fb4719e1e1c71ce9aea38c8"
          test "$(git rev-parse HEAD^^)" = "c4597231e2122b4fb1ef4e7a39b7028ffe8d6ce2"
          test "$(git rev-parse HEAD^^^)" = "302e59b1c935703a35cfc3cb95b44e7229472950"
          changed="$(git diff --name-only HEAD^^^ HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/s2_12_close.py \
            .github/workflows/s2-12-closure.yml | sort)"
          test "$changed" = "$expected"

      - name: Apply reviewed closure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/s2_12_close.py

      - name: Validate closure content and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          report=docs/RUST_CHESS_ENGINE_V0_2_S2_12_SYZYGY_DECISION_2026-08-06.md
          audit=.github/workflows/tracker-close.yml

          grep -Fq '| S2-12 | Optional Syzygy tablebase decision/integration | **Complete — deferred; no compliant backend integrated; inactive** |' "$tracker"
          grep -Fq '| S2-13 | API, UCI, ABI/JNI, Android, CI, and documentation integration | **Not started** |' "$tracker"
          grep -Fq '# Task S2-12: Optional Syzygy tablebase decision/integration — COMPLETE (DEFERRED)' "$tracker"
          grep -Fq '# Task S2-13: API, UCI, ABI/JNI, Android, CI, and documentation integration — NOT STARTED' "$tracker"
          s2_12="$(sed -n '/^# Task S2-12:/,/^# Task S2-13:/p' "$tracker")"
          test "$(grep -Fc -- '- [x]' <<<"$s2_12")" -eq 24
          test "$(grep -Fc -- '- [ ]' <<<"$s2_12")" -eq 0
          s2_13="$(sed -n '/^# Task S2-13:/,/^# Task S2-14:/p' "$tracker")"
          test "$(grep -Fc -- '- [x]' <<<"$s2_13")" -eq 0
          test "$(grep -Fc -- '- [ ]' <<<"$s2_13")" -gt 0

          grep -Fq '**Status:** Complete — deferred' "$report"
          grep -Fq '**Disposition:** `deferred_insufficient_evidence`' "$report"
          grep -Fq '**Activation:** `false`' "$report"
          grep -Fq '**Decision baseline SHA:** `302e59b1c935703a35cfc3cb95b44e7229472950`' "$report"
          grep -Fq '`c9c6fef0dddc05d2e242c183acf5833149ab676d`' "$report"
          grep -Fq '`417562c482e0938981c2fbb2dacae2e018849cd7`' "$report"
          grep -Fq '`03882f25149661595d82ea1ed393d744f03c907f`' "$report"
          grep -Fq 'ignores the boolean return from `tb_init`' "$report"

          grep -Fq 'Strength tracker authority through S2-12' "$audit"
          grep -q '^permissions:' "$audit"
          grep -q '^  contents: read$' "$audit"
          if grep -q '^  contents: write$' "$audit"; then
            echo 'generated permanent tracker audit can write repository contents' >&2
            exit 1
          fi

          git add -N "$report"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/tracker-close.yml \
            docs/RUST_CHESS_ENGINE_V0_2_S2_12_SYZYGY_DECISION_2026-08-06.md \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md | sort)"
          test "$changed" = "$expected"
          git diff --quiet -- Cargo.toml Cargo.lock crates

      - name: Preserve generated permanent audit
        uses: actions/upload-artifact@v4
        with:
          name: s2-12-generated-tracker-audit-${{ github.sha }}
          path: .github/workflows/tracker-close.yml
          if-no-files-found: error
          retention-days: 30

      - name: Commit documentation decision
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/RUST_CHESS_ENGINE_V0_2_S2_12_SYZYGY_DECISION_2026-08-06.md \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/RUST_CHESS_ENGINE_V0_2_S2_12_SYZYGY_DECISION_2026-08-06.md \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md | sort)"
          test "$staged" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record S2-12 Syzygy decision"
          git push origin HEAD:master
