name: Task 22 formatter

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task22-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and publish
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-tools/src/advanced_evaluation.rs crates/chess-tools/src/lib.rs
          if git diff --cached --quiet; then
            echo "Task 22 source already formatted."
            exit 0
          fi
          git diff --cached --check
          git commit -m "style: format Task 22 evidence protocol"
          git push origin HEAD:rust-engine
