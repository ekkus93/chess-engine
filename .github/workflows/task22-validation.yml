name: Task 22 tracker closure

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task22-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - name: Apply Task 22 documentation and tracker closure
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/task22-docs.patch.gz.b64 <<'TASK22_DOCS'
          
          TASK22_DOCS
          base64 -d /tmp/task22-docs.patch.gz.b64 | gzip -d > /tmp/task22-docs.patch
          git apply --index /tmp/task22-docs.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close Task 22 evidence gate"
          git push origin HEAD:rust-engine
