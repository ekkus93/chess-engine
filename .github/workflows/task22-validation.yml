name: Task 22 validation

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task22-validation.yml
      - crates/chess-tools/src/advanced_evaluation.rs
      - crates/chess-tools/src/lib.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run chess-tools tests
        run: cargo test --locked -p chess-tools
      - name: Run controlled Task 22 evidence
        run: cargo test --locked -p chess-tools task22_controlled_evidence_run -- --ignored --nocapture
