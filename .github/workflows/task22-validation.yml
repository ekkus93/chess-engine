name: Task 22 compile fix

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task22-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - name: Apply compile fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path("crates/chess-tools/src/advanced_evaluation.rs")
          text = source.read_text()
          old = "use chess_core::{Color, Game, Position, SearchHistory};"
          new = "use chess_core::{Color, Position, SearchHistory};"
          if old not in text:
              raise SystemExit("expected Task 22 import not found")
          source.write_text(text.replace(old, new, 1))
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-tools/src/advanced_evaluation.rs
          git diff --cached --check
          git commit -m "fix: remove unused Task 22 import"
          git push origin HEAD:rust-engine
