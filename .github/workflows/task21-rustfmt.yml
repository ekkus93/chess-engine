name: Task 21 Rustfmt

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-rustfmt
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --all

      - name: Commit formatted Task 21 source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/chess-tune/src/lib.rs crates/chess-search/src/weights.rs crates/chess-search/src/lib.rs; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tune/src/lib.rs crates/chess-search/src/weights.rs crates/chess-search/src/lib.rs
          git commit -m 'task 21.1: apply canonical Rust formatting'
          git push origin HEAD:master
