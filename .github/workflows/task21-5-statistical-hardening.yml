name: Task 21.5 Production Control Match

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-5-production-control-match
  cancel-in-progress: false

jobs:
  control:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add production control match
        run: python3 .github/task21-5-production-control-test.py

      - name: Validate protocol and run 400-game control
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p chess-tools --all-features --locked
          cargo test -p chess-tools production_control_match_runs_four_hundred_games -- --ignored --nocapture

      - name: Commit production control regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tools/src/candidate_validation.rs
          git commit -m 'test: add Task 21.5 production control match'
          git push origin HEAD:rust-engine
