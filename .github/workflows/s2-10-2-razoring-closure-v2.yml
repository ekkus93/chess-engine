name: S2-10.2 razoring closure v2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-10-2-razoring-closure-v2.yml

permissions:
  contents: write

concurrency:
  group: s2-10-2-razoring-closure-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    name: Audit and record deferred razoring decision
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact starting point and fail-closed prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e2a08373b33b44f177dd86cb5a13cdfbff7bee9d

          spec=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_SPEC_2026-08-05.md
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          futility=docs/RUST_CHESS_ENGINE_V0_2_S2_10_1_FUTILITY_2026-08-06.md
          policy=crates/chess-search/src/search_policy.rs
          search=crates/chess-search/src/alpha_beta.rs

          grep -Fq 'Evaluate only after futility evidence.' "$tracker"
          grep -Fq 'Razoring is evaluated only if profiling and node evidence justify it after futility work.' "$spec"
          grep -Fq 'It must not turn an uncertain frontier into an exact score without verification.' "$spec"
          grep -Fq '**Disposition:** `defer`' "$futility"
          grep -Fq 'frontier_futility_attempts()` was exactly zero' "$futility"
          grep -Fq '(1 << 7, ExperimentalSearchFeature::Razoring)' "$policy"
          grep -Fq 'Self::Razoring => "razoring"' "$policy"
          if grep -Eiq '\brazor(ing)?\b' "$search"; then
            echo 'production alpha-beta unexpectedly contains razoring logic' >&2
            exit 1
          fi
          if grep -Fq 'RAZORING_SEARCH_POLICY_ID' "$policy"; then
            echo 'unexpected retained razoring candidate identity' >&2
            exit 1
          fi

      - name: Record S2-10.2 decision
        shell: bash
        run: |
          set -euo pipefail
          export STAGING_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          import os

          tracker_path = Path('docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md')
          tracker = tracker_path.read_text()
          old_summary = '| S2-10 | Optional frontier and quiet-move pruning candidates | **In progress — S2-10.1 deferred; S2-10.2 and S2-10.3 not started** |'
          new_summary = '| S2-10 | Optional frontier and quiet-move pruning candidates | **In progress — S2-10.1 and S2-10.2 deferred; S2-10.3 not started** |'
          if tracker.count(old_summary) != 1:
              raise SystemExit('unexpected S2-10 summary marker count')
          tracker = tracker.replace(old_summary, new_summary)

          old_block = '''## S2-10.2 Razoring

          - [ ] Evaluate only after futility evidence.
          - [ ] Specify verification behavior.
          - [ ] Never convert uncertain frontier values into exact results without proof.
          - [ ] Protect tactical and mate-sensitive contexts.
          - [ ] Record independent disposition.
          '''
          new_block = '''## S2-10.2 Razoring — COMPLETE (DEFERRED)

          - [x] Evaluate only after futility evidence. The prerequisite is not met: S2-10.1 produced no executable futility evidence under the accepted full-window baseline and was deferred.
          - [x] Specify verification behavior. No candidate was implemented. Any future candidate must treat the razor test as a probe, verify a prospective fail-low through legal quiescence against the original alpha bound, and fall through to the normal full search whenever the probe raises alpha or is ambiguous.
          - [x] Never convert uncertain frontier values into exact results without proof. A future verified fail-low may produce only an upper-bound result; it must not publish an exact transposition-table entry from the razor probe.
          - [x] Protect tactical and mate-sensitive contexts. No candidate was retained. Future reconsideration must exclude checks, forced evasions, mate-score windows, promotions, and tactically unstable or low-material frontier positions unless separately proven safe.
          - [x] Record independent disposition. `defer`, activation `false`; no correctness or strength match was run because no behaviorally distinct candidate passed the prerequisite gate.

          **S2-10.2 gate:** Complete with `defer`. The required futility evidence does not exist. Implementing razoring now would bypass the ordered evidence gate or couple it to rejected/inactive search candidates. Production code, policy identity, diagnostics, evaluation, adapters, and defaults remain unchanged.
          '''
          if tracker.count(old_block) != 1:
              raise SystemExit('unexpected S2-10.2 block marker count')
          tracker_path.write_text(tracker.replace(old_block, new_block))

          staging = os.environ['STAGING_SHA']
          report = f'''# Rust Chess Engine v0.2 S2-10.2 Razoring Decision

          **Status:** Complete — deferred
          **Date:** 2026-08-06
          **Disposition:** `defer`
          **Activation:** `false`
          **Starting master SHA:** `90c5c1ef0afa615b1d63a0b7857c0809133ef4e4`
          **Decision staging SHA:** `{staging}`
          **Tracker:** `docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md`
          **Specification:** `docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_SPEC_2026-08-05.md`
          **Prerequisite:** `docs/RUST_CHESS_ENGINE_V0_2_S2_10_1_FUTILITY_2026-08-06.md`

          ## Decision

          S2-10.2 is complete with `defer`. No razoring policy, margin, diagnostics mutation, search branch, test-only activation path, or production behavior is retained. This does not establish that razoring is intrinsically weak; it records that the ordered prerequisite evidence does not exist.

          ## Prerequisite finding

          The tracker permits razoring only after futility evidence. The specification permits it only when profiling and node evidence justify it after futility work. S2-10.1 produced no executable evidence:

          - the accepted engine remains full-window fail-soft alpha-beta;
          - the strict futility candidate recorded exactly zero attempts;
          - the wide-window draft violated the non-PV contract;
          - PVS, which provides systematic null-window contexts, was independently rejected and remains inactive;
          - all futility implementation, policy, margin, diagnostics mutation, and candidate tests were removed rather than retained as dead configuration.

          Implementing razoring now would therefore bypass the evidence order, create an inert candidate, or silently combine it with rejected/inactive search behavior.

          ## Required future verification semantics

          Any reconsidered candidate must satisfy all of these conditions:

          1. Eligibility is shallow, explicitly bounded, outside check, forced-evasion, mate-score, promotion, tactically unstable, and unproven low-material contexts.
          2. Static evaluation plus a typed versioned margin requests only a razor probe; it is not an exact result.
          3. The probe uses legal quiescence verification against the original alpha bound.
          4. Only a verified fail-low may return early, and that return is an upper bound.
          5. A probe that raises alpha, is ambiguous, or encounters any arithmetic/capacity/internal failure falls through to the unchanged full search.
          6. The probe never creates an exact transposition-table entry. Any upper-bound storage must be separately specified and depth-safe.
          7. Dedicated regressions cover checks, evasions, mate distance, promotions, quiet defenses, tactical instability, and low-material/endgame positions.
          8. Attempts, verified fail-lows, fall-throughs, and prunes are independently counted without allocation or silent exact-aggregation overflow.

          ## Correctness and strength disposition

          No behaviorally distinct candidate passed the prerequisite gate. Consequently:

          - candidate correctness matrix: not run;
          - fixed-node strength match: not run;
          - clock strength match: not run;
          - activation: `false`.

          An identical-policy match would only reproduce the frozen 0.5 control and would not constitute razoring evidence.

          ## Production impact

          None. The authoritative policy/checksum, alpha-beta, quiescence, TT semantics, diagnostics, evaluation weights, UCI, Rust API, C ABI, JNI, Android behavior, package version, and defaults remain unchanged. `ExperimentalSearchFeature::Razoring` remains unsupported by policy validation, and production alpha-beta contains no razoring branch.

          ## Reconsideration gate

          Reconsider only after independently accepted futility evidence, or as an explicitly approved combination with a new complete policy identity and independent combined-semantics proof. Full correctness plus separate fixed-node and clock strength reports remain mandatory. No rejected candidate may be silently enabled merely to exercise razoring.
          '''
          Path('docs/RUST_CHESS_ENGINE_V0_2_S2_10_2_RAZORING_2026-08-06.md').write_text(report.replace('\n          ', '\n').lstrip())
          PY
          git diff --check

      - name: Commit documentation closure to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md \
                  docs/RUST_CHESS_ENGINE_V0_2_S2_10_2_RAZORING_2026-08-06.md
          git commit -m 'search: defer S2-10.2 razoring candidate'
          git push origin HEAD:master
