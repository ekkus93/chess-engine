name: S2-14 PVS reselection once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/s2-14-reselect-pvs-once.yml'

permissions:
  contents: write

concurrency:
  group: s2-14-pvs-reselection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reselect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply PVS reselection and remove rejected candidate code
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/s2_14_reselect_pvs.py
          chmod +x scripts/task_s2_14_candidate_audit.sh
          cargo fmt --all

      - name: Validate cleaned candidate tree
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/task_s2_14_candidate_audit.sh
          bash -n scripts/task_s2_14_candidate_audit.sh
          cargo fmt --all -- --check
          cargo check --locked -p chess-search -p chess-tools --all-targets --all-features
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search search_policy
          cargo test --locked -p chess-tools --bin s2_14_production
          git diff --check
          test ! -e crates/chess-tools/src/bin/s2_14_candidate.rs
          if grep -R -E 'S2_14_SEE_LMR|s2_14_see_lmr' crates scripts/task_s2_14_candidate_audit.sh; then
            echo 'rejected SEE+LMR code remains after cleanup' >&2
            exit 1
          fi
          grep -Fq 'SearchPolicySet::principal_variation_search_candidate()' crates/chess-tools/src/bin/s2_14_production.rs
          grep -Fq "S2_14_MAX_MEDIAN_TIME_RATIO: '1.05'" .github/workflows/s2-14-candidate-preflight.yml

      - name: Commit only cleaned permanent S2-14 files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/s2_14_reselect_pvs.py .github/workflows/s2-14-reselect-pvs-once.yml
          git add \
            crates/chess-search/src/search_policy.rs \
            crates/chess-tools/src/bin/s2_14_candidate.rs \
            crates/chess-tools/src/bin/s2_14_production.rs \
            scripts/task_s2_14_candidate_audit.sh \
            .github/workflows/s2-14-candidate-preflight.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/s2_14_reselect_pvs.py \
            .github/workflows/s2-14-candidate-preflight.yml \
            .github/workflows/s2-14-reselect-pvs-once.yml \
            crates/chess-search/src/search_policy.rs \
            crates/chess-tools/src/bin/s2_14_candidate.rs \
            crates/chess-tools/src/bin/s2_14_production.rs \
            scripts/task_s2_14_candidate_audit.sh | sort)"
          test "$staged" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'strength: reselect PVS for S2-14 production validation'
          git push origin HEAD:master
