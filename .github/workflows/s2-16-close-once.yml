name: S2-16 one-shot no-promotion closure

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/s2-16-close-once.yml'

permissions:
  contents: write

concurrency:
  group: s2-16-close-once
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Verify bounded staging scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 677cd2a4d2a4a4f3c376f7bf47fae412171206fb HEAD)" = "677cd2a4d2a4a4f3c376f7bf47fae412171206fb"
          actual="$(git diff --name-only 677cd2a4d2a4a4f3c376f7bf47fae412171206fb..HEAD | sort)"
          expected="$(printf '%s\n' '.github/s2_16_close.py' '.github/workflows/s2-16-close-once.yml' | sort)"
          test "$actual" = "$expected"

      - name: Run bounded closure transformer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/s2_16_close.py
          python3 .github/s2_16_close.py
          git diff --check

      - name: Commit closure authority and report
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_SPEC_2026-08-05.md \
            docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_IMPLEMENTATION_REPORT.md \
            docs/LEGACY_TODO_INDEX.md \
            scripts/task_post_port_review_fix_audit.sh \
            scripts/task_v0_2_strength_audit.sh \
            .github/workflows/tracker-close.yml
          git diff --cached --check
          git commit -m "docs: close S2-16 without v0.2 promotion"
          git push origin HEAD:master
