name: Apply Task 24 Initial Implementation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply Task 24 implementation directly to master
        shell: bash
        env:
          TASK24_PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "${TASK24_PATCH_GZIP_BASE64}" | base64 --decode | gzip --decompress > /tmp/task24.patch
          echo 'f83211e49c4aeb02aa76c931cd11b27b98cb0aca98229602a4e25961c842e11a  /tmp/task24.patch' | sha256sum --check
          git apply --index /tmp/task24.patch
          git rm --force .github/workflows/source-export.yml .github/source-export-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "perf: establish Task 24 measurement gates"
          git push origin HEAD:master
