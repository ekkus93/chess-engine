name: Source Export

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf /tmp/chess-engine-master.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-master-source
          path: /tmp/chess-engine-master.tar.gz
          if-no-files-found: error
          retention-days: 1
