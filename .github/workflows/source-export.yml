name: Source Export

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf /tmp/chess-engine-master.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: chess-engine-master-source
          path: /tmp/chess-engine-master.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Record export run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/source-export-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/source-export-run.txt
          git commit -m "ci: record Task 24 source export run"
          git push
