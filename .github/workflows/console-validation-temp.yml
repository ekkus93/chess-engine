name: Temporary Rust console validation

on:
  push:
    paths:
      - .github/workflows/console-validation-temp.yml
      - crates/chess-console/**
      - crates/chess-app/**
      - crates/chess-tui/**
      - Cargo.toml
      - scripts/dev.sh

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all
      - name: Resolve lockfile and compile console
        run: cargo check -p chess-console --all-targets
      - name: Verify locked console
        run: cargo check --locked -p chess-console --all-targets
      - name: Strict Clippy
        run: |
          cargo clippy --locked -p chess-app --all-targets -- -D warnings
          cargo clippy --locked -p chess-console --all-targets -- -D warnings
          cargo clippy --locked -p chess-tui --all-targets -- -D warnings
      - name: Focused tests
        run: |
          cargo test --locked -p chess-app --all-targets
          cargo test --locked -p chess-console --all-targets
          cargo test --locked -p chess-tui --all-targets
      - name: Real console process acceptance
        run: bash scripts/dev.sh console-smoke
      - name: Preserve TUI PTY acceptance
        run: bash scripts/dev.sh tui-pty-smoke
      - name: Commit validated lockfile/formatting and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/console-validation-temp.yml
          git add Cargo.lock crates/chess-console Cargo.toml scripts/dev.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(chess-console): validate console application checkpoint'
          git push origin HEAD:master
