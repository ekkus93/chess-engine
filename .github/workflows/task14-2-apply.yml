name: Task 14.2 Apply

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '128'
    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: master
          path: control
      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          path: target
      - name: Resolve whether application is pending
        id: guard
        working-directory: target
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" == 'e18c3cbeec1c221f8dfcb902cf552c8857766b8b' ]]; then
            echo 'run=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'Task 14.2 is no longer pending at the guarded closure head.'
            echo 'run=false' >>"${GITHUB_OUTPUT}"
          fi
      - name: Install Rust toolchain
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and format Task 14.2
        if: steps.guard.outputs.run == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python ../control/.github/apply_task_14_2.py .
          cargo fmt --all
          git diff --check
      - name: Run focused search validation
        if: steps.guard.outputs.run == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          cargo check --locked -p chess-search --all-targets --all-features
          cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-features
      - name: Commit and push implementation
        if: steps.guard.outputs.run == 'true'
        id: commit
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/alpha_beta.rs \
                  crates/chess-search/src/lib.rs \
                  crates/chess-search/src/move_ordering.rs \
                  crates/chess-search/src/quiescence.rs \
                  crates/chess-search/src/reference.rs \
                  docs/RUST_TACTICAL_MOVE_ORDERING.md
          git commit -m 'feat: implement Task 14.2 tactical ordering'
          git push origin HEAD:rust-engine
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
      - name: Report success
        if: steps.guard.outputs.run == 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Applied Task 14.2 tactical ordering at ${SHA}; permanent rust-engine CI will provide authoritative evidence."
          gh api --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed
