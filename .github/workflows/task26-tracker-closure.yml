name: Task 26 tracker closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task26-tracker-closure.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact Task 26 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          IMPLEMENTATION = "80cf18f77d3901e8285553211a45d51b530b5579"

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          # Close the detailed Task 26 checklist without touching Task 27.
          path = "docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md"
          text = read(path)
          start = text.index("# Task 26: v0.1 functional-engine signoff")
          end = text.index("\n---\n\n# Task 27: Full port-program signoff", start)
          section = text[start:end]
          if "Task 26 evidence:" in section:
              raise SystemExit("Task 26 definitions evidence already exists")
          section = section.replace("- [ ]", "- [x]")
          section = replace_once(
              section,
              "**Task 26 gate:** The Rust engine is a correct, playable, portable v0.1 chess engine and can become the preferred implementation for new integrations.",
              "**Task 26 gate:** The Rust engine is a correct, playable, portable v0.1 chess engine and can become the preferred implementation for new integrations. **COMPLETE.**\n\nTask 26 evidence:\n\n- Exact validated signoff implementation: `80cf18f77d3901e8285553211a45d51b530b5579`.\n- Rust CI: `30962735433 / 92169954502, 92169954449`; 377 passed, 4 ignored, release perft, warning-free docs, native AArch64, playable UCI smoke, and differential oracle passed.\n- Android: `30962735439 / 92169954196, 92169954245, 92169954247`; dual-ABI JNI, host JVM, lint, APKs, five API-35 tests, and artifact `8913595215` passed.\n- Robustness: `30962735450 / 92169954098, 92169954164, 92169954171`; fuzzing, Miri, ASan/LSan, and TSan passed.\n- Performance: `30962735451 / 92169954438, 92169954397`; x86-64 and native AArch64 budgets passed with artifacts `8913539885` and `8913538200`.\n- Signoff report: `docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md`; permanent audit: `scripts/task_26_v0_1_audit.sh`; playable transcript smoke: `scripts/task_26_uci_smoke.sh`.\n- Open-issue audit found no unresolved P0/P1 correctness issue. Task 21 tuned-candidate activation remains independently open.",
              "Task 26 gate",
          )
          write(path, text[:start] + section + text[end:])

          # Close the authoritative live tracker and advance only to Task 27.
          path = "docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md"
          text = read(path)
          text = replace_once(text, "| 25 | **Partial**. |\n| 26–27 | **Not started**. |", "| 25 | **Complete** — CI, documentation, commands, scheduled controls, and generated-artifact policy. |\n| 26 | **Complete** — correct, playable, portable v0.1 functional-engine signoff. |\n| 27 | **Not started** — full port-program signoff. |", "program summary")
          old_task26 = """# Task 26: v0.1 signoff — NOT STARTED
          - [ ] 26.1 Rules.
          - [ ] 26.2 Search.
          - [ ] 26.3 Adapters.
          - [ ] 26.4 Quality.
          - [ ] 26.5 Evidence.
          - [ ] Task 26 gate.
          """
          new_task26 = """# Task 26: v0.1 functional-engine signoff — COMPLETE
          - [x] 26.1 Rules.
          - [x] 26.2 Search.
          - [x] 26.3 Adapters.
          - [x] 26.4 Quality.
          - [x] 26.5 Evidence.
          - [x] Task 26 gate.

          ### Task 26 completion evidence

          - Exact validated signoff implementation: `80cf18f77d3901e8285553211a45d51b530b5579`.
          - Rust CI: `30962735433 / 92169954502, 92169954449`; 377 passed, 4 ignored, release depth-four perft, warning-free docs, debug/release builds, native AArch64, exact playable UCI smoke, and differential validation passed.
          - Differential validation covered 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies.
          - Android: `30962735439 / 92169954196, 92169954245, 92169954247`; ARM64/x86-64 JNI verification, host JVM, lint, APK/test APK, five API-35 tests, and metric artifact `8913595215` passed.
          - Robustness: `30962735450 / 92169954098, 92169954164, 92169954171`; fuzzing, Miri, ASan/LSan, and TSan passed.
          - Performance: `30962735451 / 92169954438, 92169954397`; x86-64 and native AArch64 budgets passed; artifacts `8913539885`, `8913538200`.
          - Report: `docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md`; permanent audit: `scripts/task_26_v0_1_audit.sh`; real UCI smoke: `scripts/task_26_uci_smoke.sh`.
          - No unresolved P0/P1 correctness issue was found. Task 21 tuned-candidate activation remains independently open.
          """
          text = replace_once(text, old_task26, new_task26, "live Task 26 block")
          old_next = """1. Begin Task 26 v0.1 functional-engine signoff against the specification, with exact evidence for rules, search, adapters, quality, and release behavior.
          2. Audit the Task 26 checklist against the already completed gates before adding duplicate validation or release infrastructure.
          3. Independently produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep that gate open until a candidate passes and is explicitly activated."""
          new_next = """1. Begin Task 27 full port-program signoff by auditing optional capabilities, migration policy, final-report coverage, and release evidence against repository reality.
          2. Reuse the permanent Task 26 rules/search/adapter/quality evidence rather than duplicating validation infrastructure.
          3. Independently produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep that gate open until a candidate passes and is explicitly activated."""
          text = replace_once(text, old_next, new_next, "immediate next operations")
          write(path, text)

          # Record the completed gate in the compact Ralph status table.
          path = "docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md"
          text = read(path)
          text = replace_once(
              text,
              "**Current phase:** Task 25 developer-workflow gate complete; Task 26 v0.1 functional-engine signoff is next while the independent Task 21 activation gate remains open",
              "**Current phase:** Task 26 v0.1 functional-engine signoff complete; Task 27 full port-program signoff is next while the independent Task 21 activation gate remains open",
              "Ralph current phase",
          )
          lines = text.splitlines()
          marker = "| 25 / gate |"
          indexes = [index for index, line in enumerate(lines) if line.startswith(marker)]
          if len(indexes) != 1:
              raise SystemExit(f"Ralph Task 25 row: expected one match, found {len(indexes)}")
          row = "| 26 / gate | `80cf18f77d3901e8285553211a45d51b530b5579` | Rust `30962735433 / 92169954502, 92169954449`; Android `30962735439 / 92169954196, 92169954245, 92169954247`; Robustness `30962735450 / 92169954098, 92169954164, 92169954171`; Performance `30962735451 / 92169954438, 92169954397` | complete rules, search, UCI, safe API, C ABI, JNI, quality, perft, differential, robustness, and performance signoff; 377 Rust tests and playable UCI transcript green; Task 21 activation remains open |"
          if row in lines:
              raise SystemExit("Ralph Task 26 row already exists")
          lines.insert(indexes[0] + 1, row)
          write(path, "\n".join(lines) + "\n")

          # Finalize the implementation report with exact Task 26 evidence.
          path = "docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md"
          text = read(path)
          text = replace_once(text, "**Status:** Task 26 signoff evidence candidate", "**Status:** Task 26 functional-engine signoff complete", "report status")
          text = replace_once(text, "**Authoritative validated implementation:** `332967613098f30348489a73249e822c9eb70bc3`", "**Functional implementation baseline:** `332967613098f30348489a73249e822c9eb70bc3`  \n**Exact validated Task 26 signoff implementation:** `80cf18f77d3901e8285553211a45d51b530b5579`", "report identities")
          old_layer = """The Task 26 report and permanent signoff audit are documentation/validation
          changes layered after that implementation commit. They do not change chess
          rules, evaluation, search, ABI, JNI, UCI, or default weights. Task 21 remains an
          independent tuned-candidate activation gate and is not silently satisfied by
          this functional v0.1 signoff."""
          new_layer = """The exact Task 26 signoff implementation adds only this evidence report, a
          permanent fail-closed signoff audit, a real playable UCI transcript smoke, and
          CI wiring. It does not change chess rules, evaluation, search, ABI, JNI, UCI,
          or default weights. Task 21 remains an independent tuned-candidate activation
          gate and is not silently satisfied by this functional v0.1 signoff."""
          text = replace_once(text, old_layer, new_layer, "report evidence boundary")
          old_runs = """| Rust CI | `30961532055` | `92166350205`, `92166350197` | x86-64 and native AArch64 passed |
          | Android | `30961532041` | `92166348287`, `92166348320`, `92166348342` | lint, host JVM, API-35 passed |
          | Robustness | `30961532058` | `92166349950`, `92166349982`, `92166350010` | sanitizers, fuzzing, Miri passed |
          | Performance | `30961532076` | `92166304634`, `92166304602` | x86-64 and AArch64 budgets passed |"""
          new_runs = """| Rust CI | `30962735433` | `92169954502`, `92169954449` | x86-64 and native AArch64 passed |
          | Android | `30962735439` | `92169954247`, `92169954245`, `92169954196` | lint, host JVM, API-35 passed |
          | Robustness | `30962735450` | `92169954171`, `92169954098`, `92169954164` | sanitizers, fuzzing, Miri passed |
          | Performance | `30962735451` | `92169954438`, `92169954397` | x86-64 and AArch64 budgets passed |"""
          text = replace_once(text, old_runs, new_runs, "report run table")
          text = replace_once(text, "Selected x86-64 medians from run `30961532076`, job `92166304634`:", "Selected x86-64 medians from run `30962735451`, job `92169954438`:", "performance run")
          metric_replacements = {
              "| Sliding attack sweep | 9,530 ns/op | zero |": "| Sliding attack sweep | 10,072 ns/op | zero |",
              "| Legal move generation | 2,351 ns/op | zero |": "| Legal move generation | 2,158 ns/op | zero |",
              "| Full hash recomputation | 46 ns/op | zero |": "| Full hash recomputation | 52 ns/op | zero |",
              "| Incremental hash update | 74 ns/op | zero |": "| Incremental hash update | 77 ns/op | zero |",
              "| Full evaluation | 706 ns/op | zero |": "| Full evaluation | 717 ns/op | zero |",
              "| Starting-position perft d4 | 15,931,778 ns | zero |": "| Starting-position perft d4 | 14,712,461 ns | zero |",
              "| Kiwipete perft d3 | 7,731,993 ns | zero |": "| Kiwipete perft d3 | 7,064,686 ns | zero |",
              "| Starting search, 20,000 nodes | 79,624,224 ns | bounded |": "| Starting search, 20,000 nodes | 76,994,469 ns | bounded |",
              "| Tactical search, 20,000 nodes | 110,339,499 ns | bounded |": "| Tactical search, 20,000 nodes | 108,317,654 ns | bounded |",
              "| FFI fixed-node search | 20,171,680 ns | bounded |": "| FFI fixed-node search | 19,793,134 ns | bounded |",
              "- x86-64: `8913113760`": "- x86-64: `8913539885`",
              "- native AArch64: `8913112922`": "- native AArch64: `8913538200`",
              "Android API-35 measurements from artifact `8913187479`:": "Android API-35 measurements from artifact `8913595215`:",
              "| Legal-move JNI average | 568,462 ns |": "| Legal-move JNI average | 70,524 ns |",
              "| Fixed-node wall time | 962,665,763 ns |": "| Fixed-node wall time | 1,252,134,961 ns |",
              "| Fixed-node throughput | 92,561 nodes/s |": "| Fixed-node throughput | 71,163 nodes/s |",
              "| Cancellation response | 242,673 ns |": "| Cancellation response | 1,715,438 ns |",
              "| Native heap delta, 16 MiB TT | 16,781,552 bytes |": "| Native heap delta, 16 MiB TT | 16,782,144 bytes |",
              "metric artifact: 8913187479": "metric artifact: 8913595215",
          }
          for old, new in metric_replacements.items():
              text = replace_once(text, old, new, f"report metric {old}")
          old_uci = """Task 26 also installs a permanent runtime smoke that sends:

          ```text
          position startpos
          go depth 1
          ```

          and requires one completed-depth `info` line with a legal PV followed by one
          legal, non-null `bestmove`. The full subprocess integration suite remains the
          authoritative protocol test."""
          new_uci = """The permanent Task 26 runtime smoke produced this exact playable transcript:

          ```text
          > position startpos
          > go depth 1
          < info depth 1 seldepth 1 score cp 44 nodes 21 nps 21000 time 0 hashfull 0 pv b1c3
          < bestmove b1c3
          ```

          The smoke requires one completed-depth `info` line with a legal PV followed by
          one legal, non-null `bestmove`. The full subprocess integration suite remains
          the authoritative protocol test."""
          text = replace_once(text, old_uci, new_uci, "report UCI transcript")
          write(path, text)

          # Append durable memory only once.
          path = "memory.md"
          text = read(path)
          marker = "2026-08-05T00:20:00Z - GPT-5.6 Thinking - Rust port Task 26 v0.1 functional-engine signoff complete"
          if marker in text:
              raise SystemExit("Task 26 memory entry already exists")
          entry = """

          2026-08-05T00:20:00Z - GPT-5.6 Thinking - Rust port Task 26 v0.1 functional-engine signoff complete

          - Exact validated signoff implementation: `80cf18f77d3901e8285553211a45d51b530b5579`.
          - Rust CI `30962735433`, Android `30962735439`, Robustness `30962735450`, and Performance `30962735451` all passed.
          - The permanent Task 26 audit, real playable UCI smoke, and `docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md` close rules, search, adapter, quality, and evidence signoff.
          - Task 27 full port-program signoff is next. Task 21 tuned-candidate activation remains independently open.
          """
          write(path, text.rstrip() + entry + "\n")
          PY

          git diff --check
          grep -Fq '# Task 26: v0.1 functional-engine signoff — COMPLETE' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -Fq '**Task 26 gate:**' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -Fq '**COMPLETE.**' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -Fq '**Status:** Task 26 functional-engine signoff complete' docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md
          bash scripts/task_26_v0_1_audit.sh

      - name: Commit tracker closure directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md \
            memory.md
          git diff --cached --check
          git commit -m 'docs: close Task 26 v0.1 signoff'
          git push origin HEAD:master
