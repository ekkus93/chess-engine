name: S2-14 candidate source apply once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/s2-14-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply frozen S2-14 source candidate
        run: |
          python3 .github/s2_14_apply.py
          sed -i 's/assert_eq!(production.pair_count, 200);/assert_eq!(production.pair_count, 1_000);/' crates/chess-tools/src/bin/s2_14_production.rs
          sed -i 's/EngineVariantResourceProtocol::FixedNodes(8)/EngineVariantResourceProtocol::FixedNodes(2_000)/' crates/chess-tools/src/bin/s2_14_production.rs

      - name: Format and validate source candidate
        run: |
          cargo fmt --all
          bash scripts/task_s2_14_candidate_audit.sh
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_14_candidate
          cargo test --locked -p chess-tools --bin s2_14_production
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings

      - name: Commit exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-search/src/search_policy.rs \
                  crates/chess-tools/src/bin/s2_14_candidate.rs \
                  crates/chess-tools/src/bin/s2_14_production.rs \
                  scripts/task_s2_14_candidate_audit.sh
          git diff --cached --check
          git commit -m 'strength: freeze S2-14 SEE plus LMR candidate'
          git push origin HEAD:master
