name: Task 21.5 Candidate Integration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-5-candidate-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply weighted match controller and module wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/task21-5-candidate-self-play.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/chess-tools/src/lib.rs')
          text = path.read_text()
          marker = 'pub mod self_play;\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected chess-tools module marker')
          if 'pub mod candidate_validation;\n' not in text:
              text = text.replace(marker, 'pub mod candidate_validation;\n' + marker, 1)
          path.write_text(text)
          PY

      - name: Validate candidate protocol
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p chess-tools --all-features --locked

      - name: Commit candidate protocol integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chess-tools/src
          git commit -m 'task 21.5: integrate candidate validation protocol'
          git push origin HEAD:rust-engine
