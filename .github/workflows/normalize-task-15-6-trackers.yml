name: Normalize Task 15.6 trackers

on:
  push:
    branches:
      - rust-engine
    paths:
      - ".github/workflows/normalize-task-15-6-trackers.yml"

permissions:
  contents: write

concurrency:
  group: normalize-task-15-6-trackers
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize tracker wording and controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Normalize tracker wording
        run: python3 scripts/normalize_task_15_6_trackers.py "$GITHUB_WORKSPACE"

      - name: Remove temporary normalization controls
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/normalize-task-15-6-trackers.yml \
            scripts/normalize_task_15_6_trackers.py

      - name: Commit clean tracker normalization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git diff --cached --check
          git commit -m "docs: normalize Task 15.6 tracker state"
          git push origin HEAD:rust-engine
