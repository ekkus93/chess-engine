name: S2-3 diagnostics staging

on:
  push:
    branches:
      - master
    paths:
      - scripts/s2_3_stage.py
      - scripts/s2_3_stage_runner.py
      - .github/workflows/s2-3-stage.yml

permissions:
  contents: write

concurrency:
  group: s2-3-diagnostics-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Apply exact diagnostics patch
        run: python3 scripts/s2_3_stage_runner.py

      - name: Format
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test diagnostics and workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Remove one-shot source patches
        run: git rm scripts/s2_3_stage.py scripts/s2_3_stage_runner.py

      - name: Commit validated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add -A -- crates/chess-search scripts/s2_3_stage.py scripts/s2_3_stage_runner.py
          git diff --cached --check
          git commit -m 'feat: add deterministic search diagnostics'
          git push origin HEAD:master
