name: Apply Task 15.3

on:
  push:
    branches:
      - rust-engine
    paths:
      - ".github/workflows/apply-task-15-3.yml"

permissions:
  contents: write

concurrency:
  group: apply-task-15-3
  cancel-in-progress: false

jobs:
  apply:
    name: Apply mate-score normalization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Apply Task 15.3 patch
        run: python3 scripts/apply_task_15_3.py "$GITHUB_WORKSPACE"

      - name: Remove temporary implementation controls
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-task-15-3.yml \
            scripts/apply_task_15_3.py

      - name: Commit Task 15.3 implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/chess-search/src/lib.rs \
            crates/chess-search/src/transposition.rs \
            crates/chess-search/src/transposition_score.rs \
            docs/RUST_TRANSPOSITION_TABLE_ENTRY.md \
            docs/RUST_TRANSPOSITION_TABLE_MATE_NORMALIZATION.md
          git diff --cached --check
          git commit -m "search: normalize transposition mate scores"
          git push origin HEAD:rust-engine
