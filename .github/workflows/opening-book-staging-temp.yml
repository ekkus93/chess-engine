name: Opening book staging

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  format-lock-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format opening-book integration
        run: cargo fmt --all
      - name: Regenerate lockfile
        run: cargo generate-lockfile
      - name: Check interactive frontends
        run: cargo check --locked -p chess-app -p chess-tui -p chess-console --all-targets
      - name: Run strict interactive Clippy
        run: cargo clippy --locked -p chess-app -p chess-tui -p chess-console --all-targets -- -D warnings
      - name: Test shared app, TUI, and console
        run: cargo test --locked -p chess-app -p chess-tui -p chess-console
      - name: Run console PTY acceptance
        run: bash scripts/dev.sh console-pty-smoke
      - name: Preserve formatted sources and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: opening-book-staging-${{ github.sha }}
          path: |
            Cargo.lock
            crates/chess-app/src/book.rs
            crates/chess-app/src/interactive_worker.rs
            crates/chess-app/src/lib.rs
            crates/chess-tui/src/worker.rs
            crates/chess-console/tests/opening_book_acceptance.rs
          if-no-files-found: error
