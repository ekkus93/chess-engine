name: Task 11 Kiwipete diagnostic once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task11-kiwipete-diagnostic-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check supplied and canonical Kiwipete positions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check chess==1.11.2
          python - <<'PY' > docs/TASK11_KIWIPETE_DIAGNOSTIC_TEMP.txt
          import chess

          supplied = "r3k2r/p1ppqpb1/bn2pnp1/2pP4/1p2P3/2N2N2/PPQBBPPP/R3K2R w KQkq - 0 1"
          canonical = "r3k2r/p1ppqpb1/bn2pnp1/2pP4/1p2P3/2N2N2/PPPBQPPP/R3K2R w KQkq - 0 1"

          def perft(board, depth):
              if depth == 0:
                  return 1
              total = 0
              for move in list(board.legal_moves):
                  board.push(move)
                  total += perft(board, depth - 1)
                  board.pop()
              return total

          print(f"chess_version={chess.__version__}")
          for name, fen in [("supplied", supplied), ("canonical", canonical)]:
              board = chess.Board(fen)
              print(f"{name} valid={board.is_valid()} fen={board.fen(en_passant='fen')}")
              for depth in range(1, 5):
                  print(f"{name} d{depth}={perft(board, depth)}")
              print(f"{name} legal={','.join(sorted(move.uci() for move in board.legal_moves))}")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TASK11_KIWIPETE_DIAGNOSTIC_TEMP.txt
          git commit -m "test(core): record Kiwipete oracle diagnostic"
          git push origin HEAD:rust-engine
