name: S2-13 source snapshot

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-13-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact staging parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "670e432b6aa7639ab525833a7d69d30f890eaf5c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/s2-13-source-snapshot.yml"

      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=chess-engine/ HEAD -o chess-engine-${GITHUB_SHA}.tar.gz
          sha256sum chess-engine-${GITHUB_SHA}.tar.gz > chess-engine-${GITHUB_SHA}.tar.gz.sha256

      - name: Preserve source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: s2-13-source-${{ github.sha }}
          path: |
            chess-engine-${{ github.sha }}.tar.gz
            chess-engine-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
