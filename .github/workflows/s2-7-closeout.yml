name: Temporary S2-7 closeout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-7-closeout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-7-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact S2-7 closeout
        run: python3 .github/s2_7_closure.py

      - name: Validate audits and tracker state
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/task_s2_7_pvs_audit.sh
          bash scripts/task_post_port_review_fix_audit.sh
          python3 - <<'PY'
          from pathlib import Path

          tracker = Path('docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md').read_text(encoding='utf-8')
          closeout = Path('docs/RUST_CHESS_ENGINE_V0_2_S2_7_PVS_2026-08-05.md').read_text(encoding='utf-8')

          required = [
              '# Task S2-7: Principal Variation Search candidate — COMPLETE',
              '| S2-7 | Principal Variation Search candidate | **Complete — standalone rejected; inactive** |',
              '## S2-7 implementation record',
              '- Begin with S2-8 only.',
          ]
          for needle in required:
              if needle not in tracker:
                  raise SystemExit(f'missing tracker closure witness: {needle}')
          s2_7 = tracker.split('# Task S2-7:', 1)[1].split('# Task S2-8:', 1)[0]
          if '- [ ]' in s2_7:
              raise SystemExit('S2-7 retains unchecked work')
          s2_8 = tracker.split('# Task S2-8:', 1)[1].split('# Task S2-9:', 1)[0]
          if '- [ ]' not in s2_8:
              raise SystemExit('S2-8 is not preserved as the next incomplete task')
          if '**Status:** Complete' not in closeout:
              raise SystemExit('S2-7 closeout is not complete')
          if '**Disposition:** Standalone candidate rejected' not in closeout:
              raise SystemExit('S2-7 disposition is missing')
          if '**Activation:** false' not in closeout:
              raise SystemExit('S2-7 closeout does not preserve inactivity')
          if '31059515279' not in closeout or 'a6bd183065e77605c55459e750ac0ea2ffbd9dd3' not in closeout:
              raise SystemExit('exact permanent evidence is missing')
          print('S2-7 closeout tracker validation passed')
          PY

      - name: Commit validated closeout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close S2-7 PVS evaluation"
          git push origin HEAD:master
