name: Bootstrap Rust Engine CI Dispatch

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.id == 30715685758
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch current rust-engine CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine
