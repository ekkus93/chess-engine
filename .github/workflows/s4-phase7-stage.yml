name: S4 Phase 7 Candidate Registry Stage

on:
  push:
    branches: [master]
    paths:
      - .github/s4_phase7.py
      - .github/workflows/s4-phase7-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s4-phase7-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply registry integration patch
        run: python3 .github/s4_phase7.py
      - name: Format staged source
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --locked -p chess-tools --all-targets --all-features -- -D warnings
      - name: Run tool regressions
        run: cargo test --locked -p chess-tools --all-targets --all-features
      - name: Verify S4 audit syntax
        run: bash -n scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated registry integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add crates/chess-tools/src/tuning_cli.rs scripts/task_s4_evaluation_tuning_calibration_audit.sh
          git commit -m "feat: register S4 tuning candidates fail closed"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
