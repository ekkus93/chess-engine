name: Close Task 18.2

on:
  push:
    branches:
      - task18-2-c-abi

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task18-2-c-abi
          fetch-depth: 0
      - name: Apply fail-closed Task 18.2 evidence and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/task18_2_close.py
          python3 scripts/task18_2_close.py
          rm scripts/task18_2_close.py
          rm .github/workflows/task18_2_close.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close Task 18.2 C ABI"
          git push origin HEAD:task18-2-c-abi
