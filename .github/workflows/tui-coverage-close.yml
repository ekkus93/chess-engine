name: Rust TUI coverage hardening closure

on:
  push:
    branches:
      - master
    paths:
      - .github/tui_coverage_close.py
      - .github/workflows/tui-coverage-close.yml

permissions:
  contents: write

concurrency:
  group: rust-tui-coverage-hardening-closure
  cancel-in-progress: true

jobs:
  close:
    name: Close coverage hardening authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply closure bookkeeping
        run: python3 .github/tui_coverage_close.py

      - name: Validate authority audit
        run: bash scripts/task_post_port_review_fix_audit.sh

      - name: Verify completed TODO and report
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Status: complete — Rust TUI test/coverage hardening validated' docs/RUST_TUI_TEST_COVERAGE_HARDENING_TODO.md
          grep -Fq 'Status: complete — targeted Rust TUI hardening' docs/RUST_TUI_TEST_COVERAGE_HARDENING_IMPLEMENTATION.md
          grep -Fq 'Active implementation TODO: `docs/RUST_TUI_TODO.md`.' docs/LEGACY_TODO_INDEX.md
          grep -Fq '73 historical' docs/LEGACY_TODO_INDEX.md
          if grep -Fq '| Active Rust TUI test/coverage hardening |' docs/LEGACY_TODO_INDEX.md; then
            echo '::error::Coverage hardening TODO still classified active.'
            exit 1
          fi

      - name: Commit closure records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_TUI_TEST_COVERAGE_HARDENING_TODO.md \
            docs/RUST_TUI_TEST_COVERAGE_HARDENING_IMPLEMENTATION.md \
            docs/LEGACY_TODO_INDEX.md \
            scripts/task_post_port_review_fix_audit.sh
          git diff --cached --check
          git commit -m 'Close Rust TUI coverage hardening program'
          git push origin HEAD:master
