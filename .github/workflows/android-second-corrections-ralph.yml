name: Android Second Corrections Ralph

on:
  push:
    branches:
      - master
    paths:
      - .github/android_second_corrections_ralph.py
      - .github/workflows/android-second-corrections-ralph.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  ralph:
    name: Execute second-corrections tracker
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Execute bounded second-corrections Ralph loop
        run: python3 .github/android_second_corrections_ralph.py
