name: Task 18.3 evidence closure

on:
  push:
    branches:
      - task18-3-c-abi-tests
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task18-3-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated implementation ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0789ac65590ccafb55b2b86b73873edfba1c7b55 HEAD
          test "$(git branch --show-current)" = "task18-3-c-abi-tests"

      - name: Apply fail-closed documentation updates
        run: |
          set -euo pipefail
          python3 scripts/task18_3_close.py
          grep -F -- '- [x] Native C or Rust-through-ABI smoke harness.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] 18.3 C tests.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] 18.4 JNI.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] Task 18 gate.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- 'Task 18.3 C ABI tests complete; Task 18.4 Android JNI is next' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F -- '30841137129' docs/RUST_C_ABI_TESTS.md
          grep -F -- '91778174797' docs/RUST_C_ABI_TESTS.md

      - name: Remove one-shot closure assets
        run: |
          set -euo pipefail
          rm scripts/task18_3_close.py
          rm .github/workflows/task18-3-close.yml

      - name: Commit and push exact closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RUST_C_ABI_TESTS.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            scripts/task18_3_close.py \
            .github/workflows/task18-3-close.yml
          git diff --cached --check
          git commit -m "docs: record Task 18.3 completion evidence"
          git push origin HEAD:task18-3-c-abi-tests
