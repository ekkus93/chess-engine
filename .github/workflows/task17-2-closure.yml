name: Task 17.2 closure

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine

permissions:
  contents: write

concurrency:
  group: task17-2-closure-rust-engine
  cancel-in-progress: true

jobs:
  close-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Close Task 17.2 trackers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          definitions_path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md")
          definitions = definitions_path.read_text()
          start = definitions.index("## 17.2 UCI search worker")
          end = definitions.index("## 17.3 Time manager", start)
          section = definitions[start:end]
          open_count = section.count("- [ ]")
          if open_count not in (0, 5):
              raise SystemExit(f"unexpected Task 17.2 open-box count: {open_count}")
          if open_count == 5:
              definitions = definitions[:start] + section.replace("- [ ]", "- [x]") + definitions[end:]
              definitions_path.write_text(definitions)

          todo_path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          todo = todo_path.read_text()
          todo = todo.replace("- [ ] 17.2 Search worker.", "- [x] 17.2 Search worker.", 1)
          evidence = """### Task 17.2 completion evidence

- Implementation: `crates/chess-uci/src/main.rs` and `crates/chess-uci/src/worker.rs`.
- One adapter-owned `SearchWorkerSlot` owns at most one named worker thread; there is no process-global mutable search control.
- Every request owns a detached game snapshot, search history, fixed-capacity transposition table, and request-local `SearchStopFlag`.
- Replacement `go`, successful `position`, `ucinewgame`, `stop`, `quit`, input EOF, and slot drop all use deterministic stop-and-join behavior.
- Malformed position commands preserve both live session state and the active worker. Successful replacements stop only after the parser commits the new state.
- Depth, node, move-time, combined finite, and infinite requests map to production `SearchLimits`. Clock/increment/moves-to-go allocation remains fail-loud and deferred to Task 17.3.
- Search-result formatting and `bestmove` remain assigned to Task 17.4.
- Contract documentation: `docs/RUST_UCI_SEARCH_WORKER.md`.
- Exact validated implementation SHA: `d058353692f9f7c350e55dfae2d1a7c21ac64666`.
- Validation PR/run/job: `#212` / `30788461155` / `91606833594`.
- Validation passed formatting, locked workspace check, strict Clippy, all tests, authoritative release perft, rustdoc, debug/release builds, and the differential oracle.
- Task 17.2 is complete. Task 17.3 UCI time manager is next.

"""
          task18 = "# Task 18: Safe API, C ABI, and JNI — NOT STARTED"
          if "### Task 17.2 completion evidence" not in todo:
              todo = todo.replace(task18, evidence + task18, 1)

          immediate = todo.index("## Immediate next operations")
          todo = todo[:immediate] + """## Immediate next operations

1. Implement Task 17.3 as a pure UCI clock-allocation layer that converts side-to-move clocks, increments, and moves-to-go into validated soft and hard `SearchLimits` budgets.
2. Reserve a deterministic safety margin and reject zero or internally inconsistent budgets instead of silently falling back to fixed depth.
3. Keep `go movetime`, explicit depth/node limits, and `go infinite` behavior unchanged.
4. Add boundary tests for very low time, increment-only contribution, missing moves-to-go, asymmetric clocks, and combined limits.
5. Feed allocated budgets into the completed Task 17.2 worker without moving mutable search control out of the request-local stop token.
6. Leave periodic `info` and final `bestmove` formatting for Task 17.4.
"""
          todo_path.write_text(todo)

          status_path = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          status = status_path.read_text()
          status = status.replace(
              "**Current phase:** Task 17.1 complete; Task 17.2 UCI search worker is next",
              "**Current phase:** Task 17.2 complete; Task 17.3 UCI time manager is next",
              1,
          )
          row = "| 17.2 | `d058353692f9f7c350e55dfae2d1a7c21ac64666` | `30788461155` / `91606833594` | adapter-owned worker, request-local cancellation, replacement/shutdown joins, five focused tests, and full permanent-quality gate green |"
          if row not in status:
              lines = status.splitlines()
              insertion = next(
                  index + 1
                  for index, line in enumerate(lines)
                  if line.startswith("| 17.1 |")
              )
              lines.insert(insertion, row)
              status = "\n".join(lines) + ("\n" if status.endswith("\n") else "")

          if "## Task 17.2 completion" not in status:
              marker = "## Task 12 completion"
              section = """## Task 17.2 completion

Implemented and validated:

- one adapter-owned worker slot per Linux UCI process;
- one named worker thread per active search, with no process-global mutable search control;
- immutable `SearchRequest` snapshots expanded into detached position, history, table, options, and limits;
- request-local explicit stop flags for finite and infinite searches;
- deterministic stop-and-join semantics for replacement `go`, `stop`, successful state replacement, `quit`, EOF, and drop;
- typed failure propagation for time-manager deferral, invalid limits, table allocation, search execution, thread spawn, and worker panic;
- exact Task 17.3 boundary for clock allocation and Task 17.4 boundary for output;
- `docs/RUST_UCI_SEARCH_WORKER.md`.

Evidence:

- Exact validated implementation SHA: `d058353692f9f7c350e55dfae2d1a7c21ac64666`.
- Validation PR/run/job: `#212` / `30788461155` / `91606833594`.
- Five focused worker and protocol-lifecycle tests passed with the complete workspace suite.
- Formatting, locked check, strict Clippy, authoritative release perft, rustdoc, debug/release builds, and the differential oracle all passed.
- Validation corrections were limited to canonical rustfmt output and removal of one test-only production method; no lint suppression or semantic relaxation was introduced.
- Task 17.3 owns deterministic clock allocation. Task 17.4 owns periodic search information and final move output.

"""
              status = status.replace(marker, section + marker, 1)
          status_path.write_text(status)
          PY

      - name: Verify closure
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '- [x] Adapter-owned worker thread.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] Safe new-game/position replacement rules.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] 17.2 Search worker.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '**Current phase:** Task 17.2 complete; Task 17.3 UCI time manager is next' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F -- '| 17.2 | `d058353692f9f7c350e55dfae2d1a7c21ac64666` | `30788461155` / `91606833594` |' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          test -f docs/RUST_UCI_SEARCH_WORKER.md

      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git diff --cached --check
          git commit -m "docs: close Task 17.2 search worker"
          git push origin HEAD:rust-engine
