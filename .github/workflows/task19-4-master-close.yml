name: Task 19.4 Tracker Closure

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: task19-4-tracker-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_USER: ${{ github.event.pull_request.user.login }}
      PR_HEAD: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify trusted trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_TITLE" = '[run-task19-4-closure-pr]'
          test "$PR_USER" = 'ekkus93'
          test "$PR_HEAD" = 'task19-4-closure-trigger'
          test "$PR_HEAD_REPO" = 'ekkus93/chess-engine'
          test "$REPOSITORY" = 'ekkus93/chess-engine'

      - uses: actions/checkout@v4
        with:
          ref: task19-4-tracker-closure
          fetch-depth: 0

      - name: Apply guarded tracker closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '11bd62a4a5a4c4a093f1e0e879d17586817e2df2'
          python3 .github/task19_4_close.py
          rm .github/task19_4_close.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Close Task 19.4 trackers'
          git push origin HEAD:task19-4-tracker-closure

      - name: Remove trusted closure trigger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git switch -C master origin/master
          git rm .github/workflows/task19-4-master-close.yml
          git commit -m 'ci: remove Task 19.4 tracker closure trigger'
          git push origin HEAD:master
