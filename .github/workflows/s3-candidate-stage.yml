name: S3 Candidate Registry Stage

on:
  push:
    branches:
      - master
    paths:
      - .github/s3_candidate_stage.py
      - .github/workflows/s3-candidate-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s3-candidate-registry-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Expose S3 candidate module
        run: python3 .github/s3_candidate_stage.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Candidate registry tests
        run: cargo test --locked -p chess-tools 's3_candidate::'
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit validated module exposure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add crates/chess-tools/src/lib.rs crates/chess-tools/src/s3_candidate.rs
          git diff --cached --exit-code && {
            echo "No candidate-registry changes to commit"
            exit 0
          }
          git commit -m "feat: integrate S3 candidate registry"
          git push origin HEAD:master
