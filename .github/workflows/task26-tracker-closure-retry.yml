name: Task 26 tracker closure retry

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task26-tracker-closure-retry.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply validated Task 26 evidence
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^[[:space:]]*python3 - <<'\''PY'\''$/ { capture = 1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/task26-tracker-closure.yml > /tmp/task26-close.py
          test -s /tmp/task26-close.py
          python3 /tmp/task26-close.py

          sed -i 's/[[:space:]]\+$//' docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path('memory.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

          git diff --check
          grep -Fq '# Task 26: v0.1 functional-engine signoff — COMPLETE' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -Fq '**Task 26 gate:**' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -Fq '**COMPLETE.**' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -Fq '**Status:** Task 26 functional-engine signoff complete' docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md
          bash scripts/task_26_v0_1_audit.sh

      - name: Commit tracker closure directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md \
            memory.md
          git diff --cached --check
          git commit -m 'docs: close Task 26 v0.1 signoff'
          git push origin HEAD:master
