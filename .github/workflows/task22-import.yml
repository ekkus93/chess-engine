name: Task 22 implementation import

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task22-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - name: Import implementation and remove helpers
        shell: bash
        run: |
          cat > /tmp/advanced-evaluation.b64 <<'TASK22_B64'
          
          TASK22_B64
          base64 -d /tmp/advanced-evaluation.b64 | gzip -d > crates/chess-tools/src/advanced_evaluation.rs
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path("crates/chess-tools/src/lib.rs")
          text = path.read_text()
          marker = "//! Deterministic offline validation primitives for the Rust chess engine.\n\n"
          declaration = "pub mod advanced_evaluation;\n"
          if declaration not in text:
              if marker not in text:
                  raise SystemExit("chess-tools module marker missing")
              text = text.replace(marker, marker + declaration, 1)
              path.write_text(text)
          PYTHON
          rm -f .github/workflows/task22-source-export.yml .github/workflows/task22-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Task 22 evidence protocol"
          git push origin HEAD:rust-engine
