name: S2-1 policy identity integration

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-1-integrate.yml

permissions:
  contents: write

concurrency:
  group: s2-1-policy-identity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair staged policy serializer
        run: python3 -c "from pathlib import Path; p=Path('crates/chess-tools/src/policy_io.rs'); t=p.read_text(); a='            \"{FORMAT_MARKER}\\\\n\",'; b='            \"{}\\\\n\",'; assert t.count(a)==1; t=t.replace(a,b,1); a='        ),\\n        set.schema_version,'; b='        ),\\n        FORMAT_MARKER,\\n        set.schema_version,'; assert t.count(a)==1; p.write_text(t.replace(a,b,1))"

      - name: Apply integration patch
        run: python3 scripts/s2_1_integrate.py

      - name: Remove temporary integration helpers
        run: git rm .github/workflows/s2-1-integrate.yml scripts/s2_1_integrate.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          bash scripts/task_s2_1_policy_identity_audit.sh
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo run --locked --release -p chess-tools -- policy-export > /tmp/search-policy.txt
          cargo run --locked --release -p chess-tools -- policy-validate /tmp/search-policy.txt

      - name: Commit integrated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add .
          git commit -m 'feat: implement S2-1 policy and variant identity'
          git push origin HEAD:master
