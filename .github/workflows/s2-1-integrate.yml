name: S2-1 policy identity integration

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-1-integrate.yml

permissions:
  contents: write

concurrency:
  group: s2-1-policy-identity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply S2-1 integration
        run: |
          python3 scripts/s2_1_integrate.py
          python3 scripts/s2_1_finalize.py

      - name: Remove temporary integration helpers
        run: git rm .github/workflows/s2-1-integrate.yml scripts/s2_1_integrate.py scripts/s2_1_finalize.py

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          bash scripts/task_s2_1_policy_identity_audit.sh
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo run --locked --release -p chess-tools -- policy-export > /tmp/search-policy.txt
          cargo run --locked --release -p chess-tools -- policy-validate /tmp/search-policy.txt

      - name: Commit integrated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add .
          git commit -m 'feat: implement S2-1 policy and variant identity'
          git push origin HEAD:master
