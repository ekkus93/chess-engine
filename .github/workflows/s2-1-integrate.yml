name: S2-1 policy identity integration

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-1-integrate.yml

permissions:
  contents: write

concurrency:
  group: s2-1-policy-identity-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate explicit policy and variant identity
