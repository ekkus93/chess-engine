name: Temporary exact console local-workflow validation

on:
  push:
    paths:
      - .github/workflows/console-final-exact-local-temp.yml

permissions:
  contents: write

env:
  CONSOLE_TARGET_SHA: 591e1d304275674b8f6b83f11a83944853615ac4

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact intended source
        run: |
          git checkout --detach "$CONSOLE_TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$CONSOLE_TARGET_SHA"
      - name: Run supported fast gate on exact source
        run: bash scripts/dev.sh fast
      - name: Run focused console process acceptance on exact source
        run: bash scripts/dev.sh console-smoke
      - name: Run TUI PTY acceptance on exact source
        run: bash scripts/dev.sh tui-pty-smoke
      - name: Return to trigger commit and self-delete after success
        shell: bash
        run: |
          set -euo pipefail
          git checkout master
          git rm .github/workflows/console-final-exact-local-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(chess-console): validate exact final developer workflows'
          git push origin HEAD:master
