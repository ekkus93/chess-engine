name: Task 12 format and validate once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task12-wire-and-validate-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: task12-format-and-validate-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Report validator identity
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --body "Task 12 formatter/validator run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT started for $(git rev-parse HEAD)."

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-task12

      - name: Apply exact rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(search): apply Task 12 rustfmt"
            git push origin HEAD:rust-engine
          fi

      - name: Run strict gates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
          cargo build --locked --workspace --all-features
          cargo build --locked --workspace --all-features --release

      - name: Exercise evaluator tooling
        shell: bash
        run: |
          set -euo pipefail
          target/release/chess-tools eval
          target/release/chess-tools eval-bench 20000
          target/release/chess-tools weights-export > /tmp/chess-eval-weights.txt
          target/release/chess-tools weights-validate /tmp/chess-eval-weights.txt

      - name: Report validator success
        if: success()
        shell: bash
        run: |
          gh issue comment 1 --body "Task 12 formatter/validator run $GITHUB_RUN_ID succeeded for candidate $(git rev-parse HEAD)."

      - name: Report validator failure
        if: failure()
        shell: bash
        run: |
          gh issue comment 1 --body "Task 12 formatter/validator run $GITHUB_RUN_ID failed for candidate $(git rev-parse HEAD)."
