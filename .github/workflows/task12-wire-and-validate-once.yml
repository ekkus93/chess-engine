name: Task 12 wire and validate once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task12-wire-and-validate-once.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: task12-wire-and-validate-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Report validator identity
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --body "Task 12 validator run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT started for $(git rev-parse HEAD)."

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-task12

      - name: Wire tooling and status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/chess-tools/src/lib.rs")
          text = lib.read_text()
          old_header = """#![forbid(unsafe_code)]
          //! Deterministic offline validation primitives for the Rust chess engine.

          use core::fmt;
          use std::io::{BufRead, Write};

          use chess_core::{Move, Position, UciMove};
          """
          new_header = """#![forbid(unsafe_code)]
          //! Deterministic offline validation primitives for the Rust chess engine.

          mod weights_io;

          use core::fmt;
          use std::{
              hint::black_box,
              io::{BufRead, Write},
              time::Instant,
          };

          use chess_core::{Move, Position, UciMove};
          use chess_search::{
              evaluate_term, evaluate_trace as search_evaluate_trace, EvaluationTerm, EvaluationTrace,
              EvaluationWeightSet,
          };

          pub use weights_io::{deserialize_weight_set, serialize_weight_set};
          """
          if text.count(old_header) != 1:
              raise SystemExit("unexpected chess-tools header")
          text = text.replace(old_header, new_header)
          anchor = "fn sanitize_error(error: &ToolError) -> String {"
          addition = '''/// One stable evaluator benchmark result.
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct EvaluationBenchmarkRow {
              /// Stable coarse evaluator term name.
              pub term: &'static str,
              /// Number of evaluations performed.
              pub iterations: u64,
              /// Wall-clock duration in nanoseconds.
              pub elapsed_nanos: u128,
              /// Deterministic accumulator preventing dead-code elimination.
              pub checksum: i64,
          }

          /// Returns the named static-evaluation trace for `fen`.
          pub fn evaluation_trace(fen: &str) -> Result<EvaluationTrace, ToolError> {
              let position = parse_position(fen)?;
              Ok(search_evaluate_trace(&position))
          }

          /// Benchmarks every major evaluator group and the complete evaluation.
          pub fn benchmark_evaluation(
              fen: &str,
              iterations: u64,
          ) -> Result<Vec<EvaluationBenchmarkRow>, ToolError> {
              if iterations == 0 {
                  return Err(ToolError::new("evaluation benchmark requires at least one iteration"));
              }
              let position = parse_position(fen)?;
              let weight_set = EvaluationWeightSet::baseline();
              weight_set
                  .validate()
                  .map_err(|error| ToolError::new(error.to_string()))?;
              let mut rows = Vec::with_capacity(EvaluationTerm::ALL.len());
              for term in EvaluationTerm::ALL {
                  let started = Instant::now();
                  let mut checksum = 0_i64;
                  for _ in 0..iterations {
                      let score = evaluate_term(
                          black_box(&position),
                          black_box(&weight_set.weights),
                          black_box(term),
                      );
                      checksum = checksum.wrapping_add(i64::from(black_box(score.centipawns())));
                  }
                  rows.push(EvaluationBenchmarkRow {
                      term: term.name(),
                      iterations,
                      elapsed_nanos: started.elapsed().as_nanos(),
                      checksum,
                  });
              }
              Ok(rows)
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit("unexpected sanitize_error anchor")
          lib.write_text(text.replace(anchor, addition + anchor))

          todo = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          text = todo.read_text()
          old_summary = """| 9 | **Active, not started** — Zobrist hashing and repetition identity. |
          | 10–24 | **Not started**. |
          | 25 | **Partial**. |
          """
          new_summary = """| 9 | **Complete** — Zobrist hashing and repetition identity. |
          | 10 | **Complete** — game history and draw semantics. |
          | 11 | **Complete** — authoritative perft and differential validation. |
          | 12 | **Active** — baseline evaluator and trace. |
          | 13–24 | **Not started**. |
          | 25 | **Partial**. |
          """
          if text.count(old_summary) != 1:
              raise SystemExit("unexpected TODO program summary")
          todo.write_text(text.replace(old_summary, new_summary))

          status = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          text = status.read_text()
          old_phase = "**Current phase:** Task 12 baseline evaluator and trace active; implementation not started"
          new_phase = "**Current phase:** Task 12 baseline evaluator and trace active; implementation candidate under validation"
          if text.count(old_phase) != 1:
              raise SystemExit("unexpected Ralph phase")
          status.write_text(text.replace(old_phase, new_phase))
          PY

      - name: Format candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Commit formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-search crates/chess-tools/src docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git commit -m "feat(search): materialize Task 12 evaluator candidate"
          git push origin HEAD:rust-engine
          git push origin --delete task12-temp

      - name: Run strict gates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
          cargo build --locked --workspace --all-features
          cargo build --locked --workspace --all-features --release

      - name: Exercise evaluator tooling
        shell: bash
        run: |
          set -euo pipefail
          target/release/chess-tools eval
          target/release/chess-tools eval-bench 20000
          target/release/chess-tools weights-export > /tmp/chess-eval-weights.txt
          target/release/chess-tools weights-validate /tmp/chess-eval-weights.txt

      - name: Report validator success
        if: success()
        shell: bash
        run: |
          gh issue comment 1 --body "Task 12 validator run $GITHUB_RUN_ID succeeded for candidate $(git rev-parse HEAD)."

      - name: Report validator failure
        if: failure()
        shell: bash
        run: |
          gh issue comment 1 --body "Task 12 validator run $GITHUB_RUN_ID failed for candidate $(git rev-parse HEAD)."
