name: S2-9 null-move feasibility

on:
  push:
    branches:
      - master
    paths:
      - .github/s2_9_feasibility.py
      - .github/workflows/s2-9-feasibility.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-9-null-move-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    name: Record and validate S2-9.1 disposition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate decision, audit, and tracker update
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/s2_9_feasibility.py
          sed -i 's/[[:space:]]\+$//' docs/RUST_CHESS_ENGINE_V0_2_S2_9_NULL_MOVE_FEASIBILITY_2026-08-05.md

      - name: Validate feasibility tree
        shell: bash
        run: |
          set -euo pipefail
          decision=docs/RUST_CHESS_ENGINE_V0_2_S2_9_NULL_MOVE_FEASIBILITY_2026-08-05.md
          audit=scripts/task_s2_9_null_move_feasibility_audit.sh
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md

          test -f "$decision"
          test -f "$audit"
          test ! -e .github/s2_9_feasibility.py

          bash -n "$audit"
          bash "$audit"
          bash scripts/task_s2_8_lmr_audit.sh
          bash scripts/task_post_port_review_fix_audit.sh
          cargo fmt --all -- --check
          git diff --check

          grep -Fq '**Disposition:** `implement`' "$decision"
          grep -Fq '**Activation:** `false`' "$decision"
          grep -Fq '| S2-9 | Optional null-move pruning decision/candidate | **In progress — feasibility complete; implementation approved** |' "$tracker"
          grep -Fq 'Begin with **S2-9.2 only**:' "$tracker"

      - name: Commit feasibility disposition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'S2-9.1 feasibility produced no changes' >&2
            exit 1
          }
          git commit -m 'docs: record S2-9 null-move feasibility'
          git push origin HEAD:master
