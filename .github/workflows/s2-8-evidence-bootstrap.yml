name: Temporary S2-8 evidence bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-8-evidence-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-8-evidence
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply S2-8 evidence harness
        run: python3 .github/s2_8_evidence_bootstrap.py

      - name: Audit format lint and test
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          bash scripts/task_s2_8_lmr_audit.sh
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-tools --bin s2_8_lmr
          cargo build --locked --release -p chess-tools --bin s2_8_lmr

      - name: Generate bounded deterministic and benchmark smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          build_identity="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          export S2_8_SOURCE_SHA="${GITHUB_SHA}"
          export S2_8_BUILD_IDENTITY="${build_identity}"
          target/release/s2_8_lmr deterministic s2-8-deterministic-bootstrap
          target/release/s2_8_lmr benchmark 1 | tee s2-8-bootstrap-benchmark.tsv

      - name: Commit validated evidence harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: add permanent S2-8 LMR evidence"
          git push origin HEAD:master
