name: Task 10 formatter once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task10-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-core/src/game.rs crates/chess-core/src/lib.rs
          git commit -m "style(core): format Task 10 game model"
          git push origin HEAD:rust-engine
