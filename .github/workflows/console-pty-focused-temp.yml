name: Console PTY focused verification

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  console-pty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run console PTY smoke
        run: bash scripts/dev.sh console-pty-smoke
