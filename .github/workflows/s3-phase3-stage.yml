name: S3 Phase 3 Stage

on:
  push:
    branches:
      - master
    paths:
      - .github/s3_phase3.py
      - .github/s3_phase3_fix.py
      - .github/workflows/s3-phase3-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s3-phase3-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply S3 phase 3 changes
        run: |
          python3 .github/s3_phase3_fix.py
          python3 .github/s3_phase3.py
          python3 - <<'PY'
          from pathlib import Path

          cli = Path('crates/chess-tools/src/s3_cli.rs')
          cli_text = cli.read_text()
          for block in [
              '''pub(crate) fn dataset_text(directory: &Path) -> Result<String, String> {
              let path = directory.join(DATASET_NAME);
              fs::read_to_string(&path)
                  .map_err(|error| format!("failed to read S3 dataset {path:?}: {error}"))
          }

          ''',
              '''pub(crate) fn manifest_text(directory: &Path) -> Result<String, String> {
              let path = directory.join(MANIFEST_NAME);
              fs::read_to_string(&path)
                  .map_err(|error| format!("failed to read S3 manifest {path:?}: {error}"))
          }

          ''',
          ]:
              if block not in cli_text:
                  raise SystemExit(f'missing dead helper block: {block.splitlines()[0]}')
              cli_text = cli_text.replace(block, '', 1)
          cli.write_text(cli_text)

          report = Path('crates/chess-tools/src/tuning/report.rs')
          report_text = report.read_text()
          old = '            optimizer.checkpoint(),\n        )\n        .expect("masked report builds");'
          new = '            &optimizer.checkpoint(),\n        )\n        .expect("masked report builds");'
          if report_text.count(old) != 1:
              raise SystemExit(f'expected one masked-report checkpoint witness, found {report_text.count(old)}')
          report.write_text(report_text.replace(old, new, 1))

          s3 = Path('crates/chess-tools/src/s3.rs')
          s3_text = s3.read_text()

          def insert_before_literal(text: str, literal: str, insertion: str) -> str:
              if text.count(literal) != 1:
                  raise SystemExit(f'expected one anchor {literal!r}, found {text.count(literal)}')
              index = text.index(literal)
              line_start = text.rfind('\n', 0, index) + 1
              return text[:line_start] + insertion + text[line_start:]

          if 'exact_invocation={}' not in s3_text:
              s3_text = insert_before_literal(
                  s3_text,
                  'writeln!(output, "search_policy_schema={}", self.search_policy_schema)',
                  '        writeln!(output, "exact_invocation={}", self.exact_invocation)\n'
                  '            .expect("String write cannot fail");\n',
              )

          if 'total_position_rows={}' not in s3_text:
              s3_text = insert_before_literal(
                  s3_text,
                  'writeln!(output, "checksum={:016x}", self.checksum)',
                  '        writeln!(output, "total_position_rows={}", self.total_position_rows)\n'
                  '            .expect("String write cannot fail");\n'
                  '        writeln!(output, "eligible_position_rows={}", self.eligible_position_rows)\n'
                  '            .expect("String write cannot fail");\n'
                  '        writeln!(output, "excluded_position_rows={}", self.excluded_position_rows)\n'
                  '            .expect("String write cannot fail");\n',
              )

          if s3_text.count('exact_invocation={}') != 1:
              raise SystemExit('exact invocation serialization is not unique')
          if s3_text.count('total_position_rows={}') != 1:
              raise SystemExit('row-count serialization is not unique')
          if 'const KEYS: [&str; 25]' not in s3_text:
              raise SystemExit('manifest parser does not declare the 25-field schema')
          s3.write_text(s3_text)
          PY

      - name: Format generated Rust changes
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run chess-tune tests
        run: cargo test --locked -p chess-tune

      - name: Run tuning report tests
        run: cargo test --locked -p chess-tools 'tuning::report::tests::'

      - name: Run S3 library tests
        run: cargo test --locked -p chess-tools 's3::'

      - name: Exercise S3 CLI usage and legacy tuning tests
        run: cargo test --locked -p chess-tools --bin chess-tools

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit validated phase 3 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add \
            crates/chess-tools/src/s3.rs \
            crates/chess-tools/src/s3_cli.rs \
            crates/chess-tools/src/main.rs \
            crates/chess-tools/src/tuning_cli.rs \
            crates/chess-tools/src/tuning/report.rs \
            docs/RUST_CHESS_ENGINE_S3_PIPELINE.md
          git diff --cached --exit-code && {
            echo "No S3 phase 3 source changes to commit"
            exit 0
          }
          git commit -m "feat: add S3 reproducible dataset and group tuning CLI"
          git push origin HEAD:master
