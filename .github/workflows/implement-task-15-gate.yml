name: Implement Task 15 gate

on:
  push:
    branches:
      - rust-engine
    paths:
      - ".github/workflows/implement-task-15-gate.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: implement-task-15-gate
  cancel-in-progress: false

jobs:
  implement:
    name: Integrate TT into production alpha-beta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle.txt

      - name: Apply Task 15 integration
        run: python3 scripts/implement_task_15_gate.py "$GITHUB_WORKSPACE"

      - name: Format
        run: cargo fmt --all

      - name: Run exclusion audit
        run: python3 scripts/task_14_5_exclusion_audit.py

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run release TT integration witnesses
        run: |
          set -euo pipefail
          cargo test --locked -p chess-search --release transposition_move_ordering_reduces_fixed_narrow_window_tree
          cargo test --locked -p chess-search --release warm_table_exact_root_hit_reduces_nodes_and_preserves_result

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug and release workspaces
        run: |
          cargo build --locked --workspace --all-features
          cargo build --locked --workspace --all-features --release

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        run: python scripts/differential_oracle.py --binary target/release/chess-tools --corpus fixtures/differential_corpus.tsv --games 12 --plies 48 --seed 0xC0FFEE

      - name: Remove temporary implementation controls
        run: |
          git rm \
            .github/workflows/implement-task-15-gate.yml \
            scripts/implement_task_15_gate.py

      - name: Commit clean implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/chess-search/src/alpha_beta.rs \
            crates/chess-search/src/lib.rs \
            crates/chess-search/src/move_ordering.rs \
            crates/chess-search/tests/search_transposition.rs \
            docs/RUST_TRANSPOSITION_TABLE_SEARCH_INTEGRATION.md
          git diff --cached --check
          git commit -m "feat: integrate TT into alpha-beta search"
          git push origin HEAD:rust-engine

      - name: Report successful implementation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[task-15-gate-implementation-success]" \
            --body "Run: $GITHUB_RUN_ID
Commit: $(git rev-parse HEAD)

Production alpha-beta TT integration, strict gates, release witnesses, perft, rustdoc, builds, and differential oracle all passed." || true

      - name: Report failed implementation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[task-15-gate-implementation-failed]" \
            --body "Run: $GITHUB_RUN_ID" || true

