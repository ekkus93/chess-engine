name: Task 18.5 Bootstrap

on:
  push:
    branches:
      - task18-5-android-harness
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task18-5-bootstrap-${{ github.ref }}
  cancel-in-progress: true

# Guarded one-shot writer for the Task 18.5 implementation.
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task18-5-android-harness
          fetch-depth: 0

      - name: Generate Android/JVM harness
        run: python3 scripts/task18_5_bootstrap.py

      - name: Verify generated scope
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/build_android_jni.sh
          test -x scripts/prepare_android_harness_jni.sh
          test -f android-harness/host-jvm/build.gradle.kts
          test -f android-harness/android-smoke/build.gradle.kts
          test -f .github/workflows/android.yml
          grep -F 'executionThreadName' crates/chess-jni/kotlin/src/main/kotlin/com/ekkus93/chessengine/ChessEngine.kt
          grep -F 'connectedDebugAndroidTest' .github/workflows/android.yml

      - name: Remove one-shot bootstrap assets
        run: git rm .github/workflows/task18-5-bootstrap.yml scripts/task18_5_bootstrap.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/android.yml \
            android-harness \
            crates/chess-jni/kotlin/src/main/kotlin/com/ekkus93/chessengine/ChessEngine.kt \
            docs/RUST_ANDROID_TEST_HARNESS.md \
            scripts/build_android_jni.sh \
            scripts/prepare_android_harness_jni.sh
          git diff --cached --check
          git commit -m "test: add Task 18.5 Android harness"
          git push origin HEAD:task18-5-android-harness
