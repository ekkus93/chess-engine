name: S4 Evaluation Tuning Calibration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s4-evaluation-tuning-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify S4 audit syntax
        run: bash -n scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Run S4 calibration audit
        run: bash scripts/task_s4_evaluation_tuning_calibration_audit.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict tuning Clippy
        run: cargo clippy --locked -p chess-tune -p chess-tools --all-targets --all-features -- -D warnings
      - name: Run tuning regressions
        run: cargo test --locked -p chess-tune --all-targets --all-features
      - name: Run S3/S4 tooling regressions
        run: cargo test --locked -p chess-tools --all-targets --all-features
