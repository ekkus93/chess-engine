name: S2-3 tracker closure

on:
  push:
    branches:
      - master
    paths:
      - scripts/tracker_close.py
      - .github/workflows/tracker-close.yml

permissions:
  contents: write

concurrency:
  group: s2-3-tracker-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close S2-3 tracker gate
        run: python3 scripts/tracker_close.py

      - name: Remove temporary closure script
        run: git rm scripts/tracker_close.py

      - name: Validate tracker and permanent audits
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash scripts/task_post_port_review_fix_audit.sh
          bash scripts/task_s2_1_policy_identity_audit.sh
          bash scripts/task_s2_2_variant_validation_audit.sh
          bash scripts/task_s2_3_baseline_audit.sh
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          grep -Fq '| S2-3 | Baseline strength, diagnostics, and performance capture | **Complete** |' "$tracker"
          grep -Fq '# Task S2-3: Baseline strength, diagnostics, and performance capture — COMPLETE' "$tracker"
          grep -Fq 'Begin with **S2-4 only**' "$tracker"
          if grep -A60 -F '# Task S2-3:' "$tracker" | grep -m1 -F '# Task S2-4:' >/dev/null; then
            :
          fi
          test "$(sed -n '/# Task S2-3:/,/# Task S2-4:/p' "$tracker" | grep -Fc -- '- [ ]')" -eq 0

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phillip Chin'
          git config user.email 'ekkus93@gmail.com'
          git add -A -- docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md scripts
          git commit -m 'docs: close S2-3 baseline gate'
          git push origin HEAD:master
