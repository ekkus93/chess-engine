name: Strength tracker audit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strength-tracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker-audit:
    name: Strength tracker authority and S2-9 closure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run inherited and active strength audits
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/task_post_port_review_fix_audit.sh
          bash scripts/task_s2_1_policy_identity_audit.sh
          bash scripts/task_s2_2_variant_validation_audit.sh
          bash scripts/task_s2_3_baseline_audit.sh
          bash scripts/task_s2_4_see_audit.sh
          bash scripts/task_s2_5_see_ordering_audit.sh
          bash scripts/task_s2_6_quiescence_audit.sh
          bash scripts/task_s2_7_pvs_audit.sh
          bash scripts/task_s2_8_lmr_audit.sh
          bash scripts/task_s2_9_null_move_feasibility_audit.sh
          bash scripts/task_s2_9_search_null_transition_audit.sh
          bash scripts/task_s2_9_null_move_policy_audit.sh
          bash scripts/task_s2_9_null_move_validation_audit.sh

      - name: Verify completed S2-9 progression
        shell: bash
        run: |
          set -euo pipefail
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          final=docs/RUST_CHESS_ENGINE_V0_2_S2_9_NULL_MOVE_2026-08-06.md
          workflow=.github/workflows/s2-9-null-policy.yml

          grep -Fq '| S2-8 | Late Move Reductions candidate | **Complete — standalone rejected; inactive for combinations** |' "$tracker"
          grep -Fq '| S2-9 | Optional null-move pruning decision/candidate | **Complete — standalone rejected; inactive** |' "$tracker"
          grep -Fq '| S2-10 | Optional frontier and quiet-move pruning candidates | **Not started** |' "$tracker"
          grep -Fq '## S2-9 feasibility record' "$tracker"
          grep -Fq '## S2-9.2 transition record' "$tracker"
          grep -Fq '## S2-9.3 conservative policy record' "$tracker"
          grep -Fq '## S2-9.4 validation record' "$tracker"
          grep -Fq '# Task S2-9: Optional null-move pruning decision/candidate — COMPLETE' "$tracker"
          grep -Fq '# Task S2-10: Optional frontier and quiet-move pruning candidates — NOT STARTED' "$tracker"
          grep -Fq 'Begin with **S2-10.1 only**:' "$tracker"

          grep -Fq '**Status:** Complete — standalone activation rejected' "$final"
          grep -Fq '**Disposition:** `rejected_strength`' "$final"
          grep -Fq '**Activation:** `false`' "$final"

          s2_9="$(sed -n '/# Task S2-9:/,/# Task S2-10:/p' "$tracker")"
          test "$(grep -Fc -- '- [x]' <<<"$s2_9")" -eq 23
          test "$(grep -Fc -- '- [ ]' <<<"$s2_9")" -eq 0
          s2_10="$(sed -n '/# Task S2-10:/,/# Task S2-11:/p' "$tracker")"
          test "$(grep -Fc -- '- [x]' <<<"$s2_10")" -eq 0
          test "$(grep -Fc -- '- [ ]' <<<"$s2_10")" -gt 0

          test -f "$workflow"
          grep -q '^permissions:' "$workflow"
          grep -q '^  contents: read$' "$workflow"
          if grep -q 'contents: write' "$workflow"; then
            echo "permanent S2-9 workflow can write repository contents" >&2
            exit 1
          fi

          for path in \
            .github/s2_9_feasibility.py \
            .github/workflows/s2-9-feasibility.yml \
            .github/s2_9_2_transition.py \
            .github/s2_9_2_audit_fix.py \
            .github/workflows/s2-9-2-transition.yml \
            .github/s2_9_3_policy.py \
            .github/s2_9_3_finalize.py \
            .github/workflows/s2-9-3-stage.yml \
            .github/s2_9_4_finalize.py \
            .github/workflows/s2-9-4-stage.yml \
            .github/workflows/s2-9-4-finalize.yml; do
            test ! -e "$path"
          done
