name: Task 19.2 Remove Unused Constant

on:
  push:
    branches:
      - task19-2-opening-book-format
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task19-2-remove-unused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task19-2-opening-book-format
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove redundant constant and self-clean
        run: |
          set -euo pipefail
          sed -i '/^const MAX_MOVE_BYTES: usize = 8;$/d' crates/chess-book/src/indexed.rs
          cargo fmt --all
          git rm .github/workflows/task19-2-remove-unused.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-book/src/indexed.rs
          git diff --cached --check
          git commit -m "fix: remove unused book constant"
          git push origin HEAD:task19-2-opening-book-format
