name: S2-6 quiescence redesign validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-6-quiescence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    name: Linux x86-64 correctness, strength, and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-s2-6-quiescence-x86-64

      - name: Audit S2-6 architecture
        run: bash scripts/task_s2_6_quiescence_audit.sh

      - name: Check formatting and strict Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings

      - name: Run focused search and evidence tests
        run: |
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_6_quiescence

      - name: Build release evidence tool
        run: cargo build --locked --release -p chess-tools --bin s2_6_quiescence

      - name: Record exact build identity
        shell: bash
        run: |
          set -euo pipefail
          build_identity="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          echo "S2_6_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "S2_6_BUILD_IDENTITY=${build_identity}" >> "$GITHUB_ENV"

      - name: Generate byte-identical deterministic evidence twice
        run: |
          target/release/s2_6_quiescence deterministic s2-6-deterministic-a
          target/release/s2_6_quiescence deterministic s2-6-deterministic-b
          diff -ru s2-6-deterministic-a s2-6-deterministic-b

      - name: Generate clock development evidence
        run: target/release/s2_6_quiescence clock s2-6-clock

      - name: Preserve the existing zero-allocation hot-path gate
        run: cargo run --locked --release -p chess-tools --bin performance -- allocation-audit

      - name: Capture seven-sample x86-64 end-to-end distribution
        run: target/release/s2_6_quiescence benchmark 7 | tee s2-6-linux-x86-64.tsv

      - name: Preserve x86-64 S2-6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-6-quiescence-linux-x86-64-${{ github.sha }}
          path: |
            s2-6-deterministic-a
            s2-6-clock
            s2-6-linux-x86-64.tsv
          if-no-files-found: error
          retention-days: 30

  linux-arm64:
    name: Linux ARM64 correctness and performance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-s2-6-quiescence-arm64

      - name: Audit and test S2-6 on native ARM64
        run: |
          bash scripts/task_s2_6_quiescence_audit.sh
          cargo check --locked -p chess-search -p chess-tools --all-targets --all-features
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_6_quiescence

      - name: Build release evidence tool
        run: cargo build --locked --release -p chess-tools --bin s2_6_quiescence

      - name: Record exact build identity
        shell: bash
        run: |
          set -euo pipefail
          build_identity="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          echo "S2_6_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "S2_6_BUILD_IDENTITY=${build_identity}" >> "$GITHUB_ENV"

      - name: Generate native ARM64 deterministic evidence
        run: target/release/s2_6_quiescence deterministic s2-6-deterministic-arm64

      - name: Preserve the existing ARM64 zero-allocation hot-path gate
        run: cargo run --locked --release -p chess-tools --bin performance -- allocation-audit

      - name: Capture seven-sample ARM64 end-to-end distribution
        run: target/release/s2_6_quiescence benchmark 7 | tee s2-6-linux-arm64.tsv

      - name: Preserve ARM64 S2-6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-6-quiescence-linux-arm64-${{ github.sha }}
          path: |
            s2-6-deterministic-arm64
            s2-6-linux-arm64.tsv
          if-no-files-found: error
          retention-days: 30
