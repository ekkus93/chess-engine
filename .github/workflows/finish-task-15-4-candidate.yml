name: Finish Task 15.4 candidate

on:
  push:
    branches:
      - rust-engine
    paths:
      - ".github/workflows/finish-task-15-4-candidate.yml"

permissions:
  contents: write

concurrency:
  group: finish-task-15-4-candidate
  cancel-in-progress: false

jobs:
  finish:
    name: Patch, format, and clean candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Patch candidate files
        run: python3 scripts/finish_task_15_4_candidate.py "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Remove temporary candidate controls
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/finish-task-15-4-candidate.yml \
            scripts/finish_task_15_4_candidate.py

      - name: Commit clean Task 15.4 candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/chess-search/src/lib.rs \
            crates/chess-search/src/transposition.rs \
            crates/chess-search/src/transposition/probe.rs \
            docs/RUST_TRANSPOSITION_TABLE_PROBE_SEMANTICS.md
          git diff --cached --check
          git commit -m "feat(search): complete Task 15.4 probe semantics"
          git push origin HEAD:rust-engine
