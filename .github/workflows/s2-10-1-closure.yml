name: S2-10.1 deferred closure

on:
  push:
    branches:
      - master
    paths:
      - .github/s2_10_1_closure.py
      - .github/workflows/s2-10-1-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-10-1-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deferred disposition record
        run: python3 .github/s2_10_1_closure.py
      - name: Validate closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash scripts/task_post_port_review_fix_audit.sh
          grep -F '**Status:** Complete — deferred' docs/RUST_CHESS_ENGINE_V0_2_S2_10_1_FUTILITY_2026-08-06.md
          grep -F '## S2-10.1 Futility pruning — COMPLETE (DEFERRED)' docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          test ! -e .github/s2_10_1_closure.py
          test ! -e .github/workflows/s2-10-1-closure.yml
          test ! -e .github/s2_10_1_generator.py
          test ! -e .github/s2_10_1_generator_fix.py
          test ! -e .github/workflows/s2-10-1-generator.yml
      - name: Publish documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'expected closure changes'; exit 1; }
          git commit -m "docs: record S2-10.1 deferred disposition"
          git push origin HEAD:master
