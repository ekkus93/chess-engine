name: Task 19.2 Trusted Closure

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: task19-2-trusted-closure
  cancel-in-progress: false

jobs:
  close:
    if: >-
      github.event.pull_request.title == '[run-task19-2-closure-pr]'
      && github.event.pull_request.user.login == 'ekkus93'
      && github.event.pull_request.head.ref == 'task19-2-trusted-trigger'
      && github.event.pull_request.head.repo.full_name == 'ekkus93/chess-engine'
      && github.repository == 'ekkus93/chess-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Apply guarded Task 19.2 closure
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/task19_2_close.py
          test -f .github/workflows/task19-2-close.yml
          git merge-base --is-ancestor 781e876563e8b21bb50e6fa83af6afe92b260910 HEAD
          python3 scripts/task19_2_close.py
          git rm scripts/task19_2_close.py .github/workflows/task19-2-close.yml
          grep -F -- '- [x] Choose Polyglot or a versioned project-specific indexed format.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] 19.2 Format.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] 19.3 Policies.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [ ] Task 19 gate.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F '**Current phase:** Task 19.2 versioned indexed format complete; Task 19.3 selection policies are next' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F '## Completion evidence' docs/RUST_OPENING_BOOK_FORMAT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_OPENING_BOOK_FORMAT.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          git diff --cached --check
          git commit -m "docs: close Task 19.2"
          git push origin HEAD:rust-engine

      - name: Remove trusted trigger from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          git rm .github/workflows/task19-2-master-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove Task 19.2 trusted closure trigger"
          git push origin HEAD:master
