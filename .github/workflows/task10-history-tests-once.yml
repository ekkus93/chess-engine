name: Task 10 history tests once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task10-history-tests-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add explicit history-boundary coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/chess-core/src/game.rs")
          text = path.read_text()
          marker = "    #[test]\n    fn search_history_is_detached_and_reversible() {\n"
          insertion = """    #[test]
          fn illegal_game_move_does_not_change_position_or_history() {
              let mut game = Game::starting();
              let snapshot = game.clone();
              let illegal = crate::Move::new(
                  "e2".parse().expect("test square is valid"),
                  "e5".parse().expect("test square is valid"),
                  crate::MoveKind::Quiet,
              );

              assert!(matches!(game.make_move(illegal), Err(GameError::Rules(_))));
              assert_eq!(game, snapshot);
          }

          #[test]
          fn repetition_count_respects_the_irreversible_halfmove_boundary() {
              let current = position("8/8/8/8/8/8/R3K3/7k w - - 2 1");
              let hash = current.zobrist();
              let history = crate::SearchHistory {
                  hashes: vec![hash, hash, hash ^ 1, hash],
                  root_len: 4,
              };

              assert_eq!(history.repetition_count(&current), 2);
          }

          """
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f"expected one search-history test marker, found {count}")
          path.write_text(text.replace(marker, insertion + marker))
          PY
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-core/src/game.rs
          git commit -m "test(core): cover game transaction and history boundary"
          git push origin HEAD:rust-engine
