name: Dispatch Rust Engine CI

on:
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.issue.number == 1 &&
       github.event.comment.body == '/dispatch-rust-engine-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '1'
      EVENT_NAME: ${{ github.event_name }}
      EVENT_COMMENT_ID: ${{ github.event.comment.id }}
      EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Resolve one-shot dispatch command
        id: command
        shell: bash
        run: |
          set -euo pipefail

          comment_id="${EVENT_COMMENT_ID:-}"
          comment_body="${EVENT_COMMENT_BODY:-}"

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            latest_comment="$(
              gh api \
                --method GET \
                "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
                -f per_page=100 \
                --jq 'last | "\(.id)|\(.body)"'
            )"
            IFS='|' read -r comment_id comment_body <<<"${latest_comment}"
          fi

          if [[ "${comment_body}" != "/dispatch-rust-engine-ci" ]]; then
            printf 'No pending dispatch command.\n'
            printf 'dispatch=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          printf 'dispatch=true\n' >>"${GITHUB_OUTPUT}"
          printf 'comment_id=%s\n' "${comment_id}" >>"${GITHUB_OUTPUT}"

      - name: Dispatch CI on rust-engine
        if: steps.command.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine

      - name: Consume dispatch command
        if: steps.command.outputs.dispatch == 'true'
        shell: bash
        env:
          COMMENT_ID: ${{ steps.command.outputs.comment_id }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body='/dispatch-rust-engine-ci — dispatched'
