name: Android current UI gallery

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve hosted Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [[ -z "${NDK_HOME}" || ! -d "${NDK_HOME}" ]]; then
            NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -d "${NDK_HOME}"
          echo "home=${NDK_HOME}" >> "${GITHUB_OUTPUT}"

      - name: Build and stage Android JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
          ANDROID_API_LEVEL: "24"
        run: bash scripts/prepare_android_harness_jni.sh

      - name: Build playable APK
        run: >-
          gradle -p android-harness :android-app:assembleDebug
          --no-daemon --stacktrace --console=plain

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture exact current UI gallery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p android-current-ui-gallery
            adb install -r android-harness/android-app/build/outputs/apk/debug/android-app-debug.apk

            tap_node() {
              label="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml window.xml >/dev/null
              coords="$(python3 -c 'import re,sys,xml.etree.ElementTree as ET
label=sys.argv[1]
root=ET.parse("window.xml").getroot()
for n in root.iter("node"):
    if n.attrib.get("text")==label or n.attrib.get("content-desc")==label:
        nums=[int(x) for x in re.findall(r"\\d+", n.attrib["bounds"])]
        print((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
        break
else:
    raise SystemExit("node not found: "+label)' "$label")"
              adb shell input tap $coords
              sleep 1
            }

            tap_desc_prefix() {
              prefix="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml window.xml >/dev/null
              coords="$(python3 -c 'import re,sys,xml.etree.ElementTree as ET
prefix=sys.argv[1]
root=ET.parse("window.xml").getroot()
for n in root.iter("node"):
    desc=n.attrib.get("content-desc","")
    if desc==prefix or desc.startswith(prefix+" "):
        nums=[int(x) for x in re.findall(r"\\d+", n.attrib["bounds"])]
        print((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
        break
else:
    raise SystemExit("content description not found: "+prefix)' "$prefix")"
              adb shell input tap $coords
              sleep 0.25
            }

            capture() {
              adb exec-out screencap -p > "android-current-ui-gallery/$1"
              test -s "android-current-ui-gallery/$1"
            }

            adb shell am force-stop com.ekkus93.chessapp
            adb shell am start -W -n com.ekkus93.chessapp/.MainActivity >/dev/null
            sleep 2
            tap_node "Start game"
            capture game-white-top.png

            tap_desc_prefix "h2"
            tap_desc_prefix "h3"
            sleep 2
            capture game-white-after-engine.png

            adb shell input swipe 540 1650 540 650 500
            sleep 1
            capture game-white-lower.png

            tap_node "New game"
            capture dialog-new-game.png
            tap_node "Cancel"

            tap_node "Restart"
            capture dialog-restart.png
            tap_node "Cancel"

            tap_node "Resign"
            capture dialog-resign.png
            tap_node "Cancel"

            adb shell am force-stop com.ekkus93.chessapp
            adb shell am start -W -n com.ekkus93.chessapp/.MainActivity >/dev/null
            sleep 1
            tap_node "Black"
            tap_node "Start game"
            sleep 2
            capture game-black-top.png

      - name: Upload exact current UI gallery
        uses: actions/upload-artifact@v4
        with:
          name: android-current-ui-gallery-${{ github.sha }}
          path: android-current-ui-gallery/*.png
          if-no-files-found: error
          retention-days: 7
