name: Rust TUI Evidence Finalizer

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rust-tui-evidence-finalizer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-tui-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile permanent evidence into TUI records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation_sha = "a41a61e6b673aaa249aab9c378d2bd6f5018e0d7"

          todo_path = Path("docs/RUST_TUI_TODO.md")
          todo = todo_path.read_text()
          old_status = "Status: implementation complete through Phase 11; permanent regression gates and manual real-terminal acceptance remain open."
          new_status = "Status: automated implementation and permanent regression validation complete; manual real-terminal acceptance remains open."
          if old_status not in todo and new_status not in todo:
              raise SystemExit("unexpected Rust TUI TODO status")
          todo = todo.replace(old_status, new_status, 1)

          automated_checks = [
              "`cargo fmt --all -- --check`",
              "workspace `cargo check` through the supported developer workflow.",
              "workspace strict Clippy through the supported developer workflow.",
              "workspace Rust tests.",
              "`cargo test -p chess-tui`.",
              "release build of `chess-tui`.",
              "existing core perft gate remains unchanged and green.",
              "existing differential/core correctness gates remain unchanged and green.",
              "existing UCI tests remain green.",
              "relevant robustness gates remain green.",
              "no Python production/runtime dependency was added.",
              "no generated tuning/weight candidate became active.",
              "no default evaluation/search policy changed.",
          ]
          for check in automated_checks:
              unchecked = f"- [ ] {check}"
              checked = f"- [x] {check}"
              if unchecked in todo:
                  todo = todo.replace(unchecked, checked, 1)
              elif checked not in todo:
                  raise SystemExit(f"missing automated check: {check}")

          final_checks = [
              "Record final implementation SHA.",
              "Record exact validation commands and results.",
              "Record relevant CI run/job URLs or IDs.",
              "Confirm CI ran against the exact final SHA rather than an earlier implementation commit.",
              "Confirm the final diff contains only intended TUI/integration/documentation changes.",
              "Confirm no silent fallback behavior was introduced.",
              "Confirm no search/evaluation/tuning/promotion behavior changed.",
          ]
          for check in final_checks:
              unchecked = f"- [ ] {check}"
              checked = f"- [x] {check}"
              if unchecked in todo:
                  todo = todo.replace(unchecked, checked, 1)
              elif checked not in todo:
                  raise SystemExit(f"missing final check: {check}")

          evidence_lines = [
              "## Permanent automated validation evidence",
              "",
              f"- Final implementation/source SHA: `{implementation_sha}`.",
              "- Permanent CI run `31228282277` completed successfully on that exact SHA. Rust workspace quality job `93026823684` passed the permanent audits, committed-lock verification, `cargo fmt --all -- --check`, workspace check, strict workspace Clippy, `cargo test --locked --workspace --all-targets --all-features`, authoritative release perft, rustdoc, debug/release workspace builds, UCI smoke, and the pinned differential corpus/seeded playout oracle. ARM64 workspace job `93026823636` also passed metadata, debug build, test compilation, and release build.",
              "- Permanent Robustness run `31228282261` completed successfully on that exact SHA. Miri job `93026823576`, native sanitizer job `93026823565`, and fuzz/corpus job `93026823590` all passed, including TSan concurrent cancellation and bounded libFuzzer campaigns.",
              "- Focused TUI run `31227985266` / job `93025997708` passed TUI check, strict Clippy, unit/integration tests, release build, PTY terminal lifecycle smoke, and the explicit Rust 1.75 MSRV check; PTY lifecycle run `31227882334` / job `93025710323` observed both alternate-screen enter and leave sequences on clean quit.",
              f"- The final implementation diff from baseline `925f2e33271cd7657757f4428544a698268b6a7d` to `{implementation_sha}` contains the new TUI/integration/tests/documentation/workspace wiring plus the TODO-authority registration required by permanent CI. It does not modify existing `chess-core`, `chess-search`, `chess-book`, `chess-uci`, evaluation, tuning, or promotion implementation sources.",
              "- Search failure remains fail-closed at the TUI boundary: the TUI never consumes `SearchResult::best_move()` when only the generic emergency cancellation fallback exists; only an exact `result.completed().best_move()` may become a played move. Normal cancellation/shutdown paths explicitly join and surface errors. `Drop` cleanup is necessarily best-effort because Rust destructors cannot return errors, but it cannot synthesize or apply a fallback move.",
              f"- The evidence-bookkeeping commit following `{implementation_sha}` contains no engine/search/evaluation/tuning behavior change and is revalidated by permanent workflows before final reporting.",
          ]
          evidence = "\n".join(evidence_lines)
          marker = "\n## Phase 13 — Final evidence and closure\n"
          if "## Permanent automated validation evidence" not in todo:
              if marker not in todo:
                  raise SystemExit("Phase 13 marker missing")
              todo = todo.replace(marker, "\n" + evidence + marker, 1)
          todo_path.write_text(todo)

          status_path = Path("docs/RUST_TUI_RALPH_STATUS.md")
          status = status_path.read_text()
          status = status.replace(
              "Status: Rust implementation and focused automated acceptance are complete. Permanent workspace/robustness validation and the specification's human-operated real-terminal acceptance remain closure gates.",
              f"Status: Rust implementation plus focused and permanent automated acceptance are complete on implementation/source SHA `{implementation_sha}`. Human-operated real-terminal acceptance remains the only closure gate.",
              1,
          )
          permanent_lines = [
              "## Permanent validation evidence",
              "",
              f"- Implementation/source SHA `{implementation_sha}`.",
              "- Permanent CI run `31228282277`: success. Workspace quality job `93026823684` and Linux ARM64 workspace job `93026823636` both succeeded.",
              "- Permanent Robustness run `31228282261`: success. Miri `93026823576`, native sanitizers `93026823565`, and fuzz/corpus `93026823590` all succeeded.",
              "- Permanent CI covered the repository audits, lockfile reproduction, formatting, workspace check/Clippy/tests, authoritative release perft, rustdoc, debug/release builds, UCI smoke, and pinned differential validation.",
              "- The baseline-to-implementation diff changes no existing core/search/book/UCI/evaluation/tuning/promotion implementation source.",
          ]
          permanent = "\n".join(permanent_lines)
          remaining_marker = "\n## Remaining closure gates\n"
          if "## Permanent validation evidence" not in status:
              if remaining_marker not in status:
                  raise SystemExit("remaining closure marker missing")
              status = status.replace(remaining_marker, "\n" + permanent + remaining_marker, 1)
          status = status.replace(
              "Permanent CI must pass on the final repository SHA after the temporary Ralph workflow is removed, including workspace format/check/strict-Clippy/tests, release perft, differential/core correctness, UCI coverage, and relevant robustness jobs.\n\n",
              "Permanent CI and Robustness have passed on the exact implementation/source SHA recorded above. The evidence-only bookkeeping commit is separately revalidated before final reporting.\n\n",
              1,
          )
          status_path.write_text(status)

          audit_path = Path("scripts/task_post_port_review_fix_audit.sh")
          audit = audit_path.read_text()
          old_audit = "grep -Fq 'Status: implementation complete through Phase 11; permanent regression gates and manual real-terminal acceptance remain open.' \"$tui_todo\""
          new_audit = "grep -Fq 'Status: automated implementation and permanent regression validation complete; manual real-terminal acceptance remains open.' \"$tui_todo\""
          if old_audit in audit:
              audit = audit.replace(old_audit, new_audit, 1)
          elif new_audit not in audit:
              raise SystemExit("unexpected TUI status assertion in permanent audit")
          audit_path.write_text(audit)
          PY

      - name: Remove temporary finalizer and publish evidence commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rust-tui-evidence-finalizer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RUST_TUI_TODO.md docs/RUST_TUI_RALPH_STATUS.md scripts/task_post_port_review_fix_audit.sh
          git diff --cached --check
          git commit -m 'Record Rust TUI permanent validation evidence'
          git push origin HEAD:master
