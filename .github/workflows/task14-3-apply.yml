name: Task 14.3 Apply

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/task14_3_parts/**
      - .github/task14_3_run_request.txt
      - .github/workflows/task14-3-apply.yml

permissions:
  contents: write

concurrency:
  group: task-14-3-apply-rust-engine
  cancel-in-progress: true

jobs:
  apply:
    if: github.ref == 'refs/heads/rust-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Configure progress reporting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'started:%s\n' "$GITHUB_RUN_ID" > .github/task14_3_progress.txt
          git add .github/task14_3_progress.txt
          git commit -m "ci: Task 14.3 validation started"
          git push origin HEAD:rust-engine

      - name: Reconstruct, apply, and validate Task 14.3
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          progress() {
            printf '%s:%s\n' "$1" "$GITHUB_RUN_ID" > .github/task14_3_progress.txt
            git add .github/task14_3_progress.txt
            git commit -m "ci: Task 14.3 $1"
            git push origin HEAD:rust-engine
          }
          {
            set -euo pipefail
            rustc --version
            cargo --version
            rustfmt --version
            cargo clippy --version
            cat .github/task14_3_parts/part{00..04} > /tmp/apply_task_14_3.py
            echo 'b9d3c144d610175a6f9562773825c6e2806737a882e107425bf0c9dfcdfb3c93  /tmp/apply_task_14_3.py' | sha256sum --check
            python3 -c 'import base64; from pathlib import Path; p=Path("/tmp/apply_task_14_3.py"); s=p.read_text(); old=base64.b64decode("").decode(); new=base64.b64decode("").decode(); assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))'
            echo '8b6bab7bd745473b18f1098d544158a6ffb922bbb5ed5e4a21df7a32cfb4923d  /tmp/apply_task_14_3.py' | sha256sum --check
            python3 /tmp/apply_task_14_3.py "$GITHUB_WORKSPACE"
            cargo fmt --all
            progress applied-and-formatted
            timeout 300 cargo check --locked -p chess-search --all-targets --all-features
            progress cargo-check-passed
            timeout 300 cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings
            progress clippy-passed
            timeout 600 cargo test --locked -p chess-search --all-features
            progress focused-tests-passed
          } 2>&1 | tee /tmp/task14_3_validation.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit fail-visible diagnostics
        if: steps.validation.outcome == 'failure' || steps.validation.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          if test -f /tmp/task14_3_validation.log; then
            cp /tmp/task14_3_validation.log .github/task14_3_failure.txt
          else
            printf 'validation shell failed before log creation\n' > .github/task14_3_failure.txt
          fi
          git add .github/task14_3_failure.txt
          git commit -m "ci: record Task 14.3 validation failure"
          git push origin HEAD:rust-engine

      - name: Commit implementation and remove applicator
        if: steps.validation.outcome == 'success' && steps.validation.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/task14_3_parts \
            .github/task14_3_run_request.txt \
            .github/task14_3_progress.txt \
            .github/task14_3_failure.txt \
            .github/workflows/task14-3-apply.yml
          git add -A
          git commit -m "search: implement Task 14.3 quiet ordering"
          git push origin HEAD:rust-engine
