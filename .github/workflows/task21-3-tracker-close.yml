name: Task 21.3 Tracker Close

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: task21-3-tracker-close
  cancel-in-progress: false

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Close authoritative Task 21.3 trackers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          definitions = Path('docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md')
          replace_once(
              definitions,
              '''## 21.3 Optimizer

          - [ ] Implement SPSA or another documented optimizer.
          - [ ] Seed optimizer randomness.
          - [ ] Bounds/regularization for nonsensical weights.
          - [ ] Checkpoint support.
          ''',
              '''## 21.3 Optimizer

          - [x] Implement SPSA or another documented optimizer.
          - [x] Seed optimizer randomness.
          - [x] Bounds/regularization for nonsensical weights.
          - [x] Checkpoint support.

          ### Task 21.3 completion evidence

          - Deterministic optimizer: `crates/chess-tune/src/optimizer.rs`.
          - Contract documentation: `docs/RUST_SPSA_OPTIMIZER.md`.
          - Exact helper-free validated implementation head: `fc69d7d7554ab325fd72ccfc5ac94c4bb1077ae8`.
          - Rust run/job: `30897085986` / `91952447573`.
          - Android run/jobs: `30897085023` / `91952460052`, `91952460064`, `91952460121`.
          - Seeded SplitMix64 SPSA, explicit schedules, bounded and material-valid projection, L2 regularization, training-only updates, validation-only observation, fixed-schema checksummed checkpoints, and exact resume equivalence are implemented and permanently validated.
          ''',
          )

          live = Path('docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md')
          replace_once(
              live,
              '| 21 | **In progress** — Tasks 21.1–21.2 complete; Tasks 21.3–21.5 remain. |',
              '| 21 | **In progress** — Tasks 21.1–21.3 complete; Tasks 21.4–21.5 remain. |',
          )
          replace_once(
              live,
              '''# Task 21: Named-schema tuning — IN PROGRESS
          - [x] 21.1 Weights.
          - [x] 21.2 Loss.
          - [ ] 21.3 Optimizer.
          - [ ] 21.4 Reports.
          - [ ] 21.5 Validation.
          ''',
              '''# Task 21: Named-schema tuning — IN PROGRESS
          - [x] 21.1 Weights.
          - [x] 21.2 Loss.
          - [x] 21.3 Optimizer.
          - [ ] 21.4 Reports.
          - [ ] 21.5 Validation.

          ### Task 21.3 completion evidence

          - Implementation: `crates/chess-tune/src/optimizer.rs`.
          - Contract: `docs/RUST_SPSA_OPTIMIZER.md`.
          - Exact helper-free validated SHA: `fc69d7d7554ab325fd72ccfc5ac94c4bb1077ae8`.
          - Rust run/job: `30897085986` / `91952447573`.
          - Android run/jobs: `30897085023` / `91952460052`, `91952460064`, `91952460121`.
          - Permanent formatting, workspace check, strict Clippy, complete Rust tests, release perft, rustdoc, debug/release builds, differential validation, Android/Kotlin lint, host JNI, and API-35 instrumentation passed.
          - Task 21.4 report generation and persistent artifact workflows are next; optimized weights remain inactive.
          ''',
          )

          ralph = Path('docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md')
          replace_once(
              ralph,
              '**Current phase:** Task 21.2 loss pipeline complete; Task 21.3 optimizer work is next',
              '**Current phase:** Task 21.3 deterministic SPSA optimizer complete; Task 21.4 report work is next',
          )
          row = '| 21.2 | `3d11b01a9de84913c6c1bfa43a37aea0197dc5be` | Rust `30894313165` / `91943462745`; Android `30894313169` / `91943477000`, `91943477036`, `91943477212` | side-to-move logistic targets, explicit training-only K calibration, occurrence-weighted MSE, held-out validation, strict Task 20 adapter, typed failure policy, and all permanent gates green |'
          replace_once(
              ralph,
              row,
              row + '\n| 21.3 | `fc69d7d7554ab325fd72ccfc5ac94c4bb1077ae8` | Rust `30897085986` / `91952447573`; Android `30897085023` / `91952460052`, `91952460064`, `91952460121` | deterministic seeded SPSA over the 810-scalar schema, explicit bounds and L2 regularization, training/validation isolation, checksummed data/config-bound resumable checkpoints, and all permanent gates green |',
          )
          replace_once(
              ralph,
              'Task 21.2 is complete. Task 21.3 optimizer work is next.\n',
              '''Task 21.2 is complete. Task 21.3 optimizer work is complete; Task 21.4 report work is next.

          ## Task 21.3 completion

          Implemented and validated:

          - simultaneous perturbation stochastic approximation over all 810 stable named scalar parameters;
          - explicit finite gain, decay, perturbation, stability, iteration, bound, and regularization configuration;
          - deterministic SplitMix64 perturbation directions from a caller-supplied `u64` seed;
          - training-only gradients and best-candidate selection, with validation loss observable but unable to change optimizer state;
          - inclusive scalar projection plus deterministic positive material-order preservation;
          - L2 regularization around the exact initial named vector;
          - fixed-length little-endian version-1 checkpoints with optimizer/config/dataset/K binding, RNG state, continuous parameters, initial reference, best values, objectives, and FNV-1a checksum;
          - exact uninterrupted-versus-resumed state equivalence and fail-loud corrupt/config/data/objective mismatch handling;
          - `docs/RUST_SPSA_OPTIMIZER.md`.

          Evidence:

          - integration commit: `933d65d9cd2b617460829092c85361fa134afc7a`;
          - exact helper-free validated implementation head: `fc69d7d7554ab325fd72ccfc5ac94c4bb1077ae8`;
          - integration preflight run: `30896853476`;
          - permanent Rust run/job: `30897085986` / `91952447573`;
          - permanent Android run/jobs: `30897085023` / `91952460052`, `91952460064`, `91952460121`;
          - formatting, locked workspace check, strict Clippy, complete Rust tests, authoritative release perft, warning-free rustdoc, debug/release builds, differential oracle, Android/Kotlin lint, host JVM JNI, dual-ABI native verification, APK build, and API-35 instrumentation all passed;
          - temporary integration workflow was removed and no branch or pull request was created.

          Task 21.3 is complete. Task 21.4 report work is next; no optimized candidate has been activated.
          ''',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git commit -m 'docs: close Task 21.3 optimizer'
          git push origin HEAD:master
