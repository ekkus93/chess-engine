name: S2-6 closure temporary

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-6-closure-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-6-closure-temporary
  cancel-in-progress: false

jobs:
  close:
    name: Reconcile S2-6 tracker and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact closure patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/s2_6_closure.py scripts/s2_6_closure_refine.py
          python3 scripts/s2_6_closure_refine.py
          python3 scripts/s2_6_closure.py
          rm scripts/s2_6_closure.py scripts/s2_6_closure_refine.py
          git diff --check

      - name: Verify closed authority state
        run: |
          set -euo pipefail
          tracker=docs/RUST_CHESS_ENGINE_V0_2_STRENGTH_TODO_2026-08-05.md
          grep -Fq '| S2-6 | Quiescence redesign candidates | **Complete — SEE and delta rejected; inactive** |' "$tracker"
          grep -Fq '# Task S2-6: Quiescence redesign candidates — COMPLETE' "$tracker"
          grep -Fq '# Task S2-7: Principal Variation Search candidate — NOT STARTED' "$tracker"
          grep -Fq 'Begin with **S2-7 only**' "$tracker"
          test "$(sed -n '/# Task S2-6:/,/# Task S2-7:/p' "$tracker" | grep -Fc -- '- [ ]')" -eq 0
          test "$(sed -n '/# Task S2-7:/,/# Task S2-8:/p' "$tracker" | grep -Fc -- '- [ ]')" -gt 0
          grep -Fq '**Status:** Complete; both isolated candidates rejected for activation and remain inactive' docs/RUST_CHESS_ENGINE_V0_2_S2_6_QUIESCENCE_2026-08-05.md

      - name: Commit closure documentation
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add -A
          git commit -m "docs(search): close S2-6 quiescence redesign"
          git push origin HEAD:master
