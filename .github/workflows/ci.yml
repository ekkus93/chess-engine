name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify workspace and validation assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f fixtures/perft.tsv
          test -f fixtures/differential_corpus.tsv
          test -f requirements/oracle.txt
          test -f scripts/differential_oracle.py
          test -f scripts/task_14_5_exclusion_audit.py
          test -f scripts/task_19_5_opening_book_audit.py
          test -f scripts/task_25_artifact_audit.py
          test -f scripts/task_26_v0_1_audit.sh
          test -f scripts/task_26_uci_smoke.sh
          test -f scripts/task_27_full_port_audit.sh
          test -f scripts/task_post_port_review_fix_audit.sh
          test -f scripts/task_s2_2_variant_validation_audit.sh
          test -f scripts/task_s2_4_see_audit.sh
          test -f scripts/task_s2_5_see_ordering_audit.sh
          test -f scripts/task_s2_6_quiescence_audit.sh
          test -f scripts/task_v0_2_strength_audit.sh
          test -f scripts/dev.sh
          test -f scripts/tui_coverage.sh
          test -f fixtures/tuning_config.example
          test -f docs/RUST_DEVELOPER_WORKFLOWS.md
          test -f docs/RUST_GENERATED_ARTIFACT_POLICY.md
          test -f docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md
          test -f docs/RUST_CHESS_ENGINE_PORT_IMPLEMENTATION_REPORT.md
          test -f docs/RUST_CHESS_ENGINE_VARIANT_VALIDATION.md
          test -f docs/RUST_CHESS_ENGINE_V0_2_S2_4_SEE_2026-08-05.md
          test -f docs/RUST_CHESS_ENGINE_V0_2_S2_5_SEE_ORDERING_2026-08-05.md
          test -f docs/RUST_CHESS_ENGINE_V0_2_S2_6_QUIESCENCE_2026-08-05.md
          test -f docs/RUST_CHESS_ENGINE_V0_2_S2_13_INTEGRATION_2026-08-06.md
          test -f crates/chess-book/tests/task_19_5.rs
          test -f crates/chess-tools/src/engine_variant_validation.rs
          test -f crates/chess-tools/src/bin/s2_4_see_benchmark.rs
          test -f crates/chess-tools/src/bin/s2_5_see_ordering.rs
          test -f crates/chess-tools/src/bin/s2_6_quiescence.rs
          test -f crates/chess-tools/src/bin/s2_13_variant_control.rs
          test -f .github/workflows/s2-6-quiescence.yml
          test -f .github/workflows/variant-validation.yml
          test -f .github/workflows/tui-coverage.yml
          python3 -m py_compile \
            scripts/differential_oracle.py \
            scripts/task_14_5_exclusion_audit.py \
            scripts/task_19_5_opening_book_audit.py \
            scripts/task_25_artifact_audit.py
          bash -n \
            scripts/dev.sh \
            scripts/tui_coverage.sh \
            scripts/build_android_jni.sh \
            scripts/prepare_android_harness_jni.sh \
            scripts/task_26_v0_1_audit.sh \
            scripts/task_26_uci_smoke.sh \
            scripts/task_27_full_port_audit.sh \
            scripts/task_post_port_review_fix_audit.sh \
            scripts/task_s2_2_variant_validation_audit.sh \
            scripts/task_s2_4_see_audit.sh \
            scripts/task_s2_5_see_ordering_audit.sh \
            scripts/task_s2_6_quiescence_audit.sh \
            scripts/task_v0_2_strength_audit.sh

      - name: Run Task 25 developer-workflow audits
        run: |
          python3 scripts/task_25_artifact_audit.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run Task 26 v0.1 signoff audit
        run: bash scripts/task_26_v0_1_audit.sh

      - name: Run Task 27 full-port audit
        run: bash scripts/task_27_full_port_audit.sh

      - name: Run post-port review fix audit
        run: bash scripts/task_post_port_review_fix_audit.sh

      - name: Run S2-2 complete variant validation audit
        run: bash scripts/task_s2_2_variant_validation_audit.sh

      - name: Run standalone S2-4 SEE audit
        run: bash scripts/task_s2_4_see_audit.sh

      - name: Run S2-5 SEE capture-ordering audit
        run: bash scripts/task_s2_5_see_ordering_audit.sh

      - name: Run S2-6 quiescence redesign audit
        run: bash scripts/task_s2_6_quiescence_audit.sh

      - name: Run v0.2 strength integration audit
        run: bash scripts/task_v0_2_strength_audit.sh

      - name: Run Task 14.5 exclusion audit
        run: python3 scripts/task_14_5_exclusion_audit.py

      - name: Run Task 19.5 opening-book audit
        run: python3 scripts/task_19_5_opening_book_audit.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Verify committed lockfile
        run: cargo update --locked --workspace --dry-run

      - name: Verify workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Run authoritative release perft
        run: cargo run --locked --release -p chess-tools -- suite 4

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build workspace debug
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Build workspace release
        run: cargo build --locked --release --workspace --all-targets --all-features

      - name: UCI smoke
        run: bash scripts/task_26_uci_smoke.sh

      - name: Install pinned Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/oracle.txt

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/oracle.txt

      - name: Run pinned differential corpus
        run: python scripts/differential_oracle.py --mode corpus --binary target/debug/chess-tools

      - name: Run seeded differential playouts
        run: python scripts/differential_oracle.py --mode playout --binary target/debug/chess-tools

  arm64:
    name: Linux ARM64 workspace build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64

      - name: Verify workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build workspace debug
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Compile workspace tests
        run: cargo test --locked --workspace --all-targets --all-features --no-run

      - name: Build workspace release
        run: cargo build --locked --release --workspace --all-targets --all-features
