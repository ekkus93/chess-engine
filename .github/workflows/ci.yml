name: CI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  temporary-task14-control:
    name: Temporary Task 14 control
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Permanent CI is restored by the queued Task 14 narrowing commit.'
