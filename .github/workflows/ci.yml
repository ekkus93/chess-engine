name: CI

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  task17-3-closure:
    name: Close Task 17.3 trackers
    if: github.event.issue.title == '[close-task17-3-trackers]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report start
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body='Task 17.3 tracker closure started.'

      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Patch trackers and restore permanent controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          definitions_path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md")
          definitions = definitions_path.read_text()
          start = definitions.index("## 17.2 UCI search worker")
          end = definitions.index("## 17.4 Output", start)
          section = definitions[start:end]
          open_count = section.count("- [ ]")
          if open_count not in (0, 9):
              raise SystemExit(f"unexpected Task 17.2/17.3 open-box count: {open_count}")
          if open_count:
              definitions = definitions[:start] + section.replace("- [ ]", "- [x]") + definitions[end:]
          definitions_path.write_text(definitions)

          todo_path = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          todo = todo_path.read_text()
          todo = todo.replace("- [ ] 17.2 Search worker.", "- [x] 17.2 Search worker.", 1)
          todo = todo.replace("- [ ] 17.3 Time manager.", "- [x] 17.3 Time manager.", 1)

          task17_2 = """### Task 17.2 completion evidence

- Implementation: `crates/chess-uci/src/main.rs` and `crates/chess-uci/src/worker.rs`.
- One adapter-owned worker slot owns at most one named search thread; every request owns a detached game snapshot, repetition history, fixed-capacity transposition table, and request-local stop flag.
- Replacement `go`, successful `position`, `ucinewgame`, `stop`, `quit`, EOF, and slot drop use deterministic stop-and-join behavior without process-global mutable search control.
- Contract documentation: `docs/RUST_UCI_SEARCH_WORKER.md`.
- Exact validated implementation SHA: `d058353692f9f7c350e55dfae2d1a7c21ac64666`.
- Validation PR/run/job: `#212` / `30788461155` / `91606833594`.
- Formatting, locked workspace compilation, strict Clippy, all tests, authoritative release perft, rustdoc, debug/release builds, and differential validation passed.
- Task 17.2 is complete.

"""
          task17_3 = """### Task 17.3 completion evidence

- Implementation: `crates/chess-uci/src/time_manager.rs`, integrated through `crates/chess-uci/src/worker.rs` and `main.rs`.
- The allocator selects the side-to-move clock and increment, defaults missing `movestogo` to 30, reserves the larger of 10 ms or five percent, contributes 75 percent of increment, and caps the hard budget at twice the soft budget without spending the reserve.
- Every positive clock produces nonzero validated soft and hard limits with `soft <= hard` and `hard + reserve <= remaining`; missing or zero side-to-move clocks fail loudly.
- Depth and node ceilings combine with allocated budgets. `go movetime` remains hard-only and `go infinite` remains explicit-stop-only.
- Eight focused allocator tests and four worker-limit integration tests cover exact budgets, low time, asymmetric clocks, default horizon, increment, combined limits, invalid clocks, and overflow safety.
- Contract documentation: `docs/RUST_UCI_TIME_MANAGER.md` and the updated worker contract.
- Exact validated implementation SHA: `1c71f8dfa8449190ea8ae860386b6566b9176cbd`.
- Validation PR/run/job: `#214` / `30789829090` / `91610825428`.
- Formatting, locked workspace compilation, strict Clippy, all tests, authoritative release perft, rustdoc, debug/release builds, and differential validation passed.
- Task 17.3 is complete. Task 17.4 UCI search output is next.

"""
          task18 = "# Task 18: Safe API, C ABI, and JNI — NOT STARTED"
          insertion = ""
          if "### Task 17.2 completion evidence" not in todo:
              insertion += task17_2
          if "### Task 17.3 completion evidence" not in todo:
              insertion += task17_3
          if insertion:
              todo = todo.replace(task18, insertion + task18, 1)

          immediate = todo.index("## Immediate next operations")
          todo = todo[:immediate] + """## Immediate next operations

1. Implement Task 17.4 output formatting over completed `SearchResult` values without moving protocol output into `chess-search`.
2. Emit UCI `info` fields for completed depth, typed centipawn or mate score, nodes, NPS, elapsed milliseconds, legal PV, and hash fullness when available.
3. Emit exactly one final `bestmove`, with optional ponder move, for natural completion and explicit `stop`.
4. Define compliant terminal and no-legal-move output, including `bestmove 0000` where required.
5. Preserve the Task 17.2 worker ownership and Task 17.3 clock-allocation contracts while adding a thread-safe result/output handoff.
6. Leave full process transcript and GUI-workflow coverage for Task 17.5.
"""
          todo_path.write_text(todo)

          status_path = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          status = status_path.read_text()
          status = status.replace(
              "**Current phase:** Task 17.1 complete; Task 17.2 UCI search worker is next",
              "**Current phase:** Task 17.3 complete; Task 17.4 UCI search output is next",
              1,
          )
          rows = [
              "| 17.2 | `d058353692f9f7c350e55dfae2d1a7c21ac64666` | `30788461155` / `91606833594` | adapter-owned worker, request-local cancellation, deterministic replacement/shutdown joins, full quality gate green |",
              "| 17.3 | `1c71f8dfa8449190ea8ae860386b6566b9176cbd` | `30789829090` / `91610825428` | deterministic side-to-move clock allocation, safety reserve, increment/moves-to-go policy, 12 focused tests, full quality gate green |",
          ]
          lines = status.splitlines()
          insertion_index = next(index + 1 for index, line in enumerate(lines) if line.startswith("| 17.1 |"))
          for row in reversed(rows):
              if row not in lines:
                  lines.insert(insertion_index, row)
          status = "\n".join(lines) + ("\n" if status.endswith("\n") else "")

          if "## Task 17.2 and 17.3 completion" not in status:
              marker = "## Task 12 completion"
              completion = """## Task 17.2 and 17.3 completion

Implemented and validated:

- one adapter-owned named search worker with request-local cancellation and no process-global mutable search control;
- deterministic stop-and-join semantics for replacement, state changes, stop, quit, EOF, and drop;
- a pure UCI time manager selecting the side-to-move clock and increment;
- a 30-move default horizon when `movestogo` is absent;
- a safety reserve equal to the larger of 10 ms or five percent, capped to retain one usable millisecond;
- soft budget from usable clock share plus 75 percent of increment;
- hard budget capped at twice soft time and never allowed to spend the reserve;
- typed failures for missing and zero side-to-move clocks;
- exact preservation of depth, node, move-time, and infinite semantics;
- `docs/RUST_UCI_SEARCH_WORKER.md` and `docs/RUST_UCI_TIME_MANAGER.md`.

Evidence:

- Task 17.2 validated SHA/run/job: `d058353692f9f7c350e55dfae2d1a7c21ac64666` / `30788461155` / `91606833594`.
- Task 17.3 validated SHA/run/job: `1c71f8dfa8449190ea8ae860386b6566b9176cbd` / `30789829090` / `91610825428`.
- Task 17.3 added eight allocator tests and four worker-limit integration tests.
- Formatting, locked check, strict Clippy, all tests, release perft, rustdoc, debug/release builds, and the independent differential oracle passed.
- Validation corrections were mechanical rustfmt and test-only API scoping only; no lint suppression or time-policy relaxation was introduced.
- Task 17.4 owns periodic search information and final `bestmove` output.

"""
              status = status.replace(marker, completion + marker, 1)
          status_path.write_text(status)
          PY

          git show 14fbbc7b2f497629f8c8ed2ba1920a43133db099:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/task17-3-tracker-closure.yml
          rm -f docs/TASK17_3_TRACKER_TRIGGER.md

      - name: Verify closure tree
        shell: bash
        run: |
          set -euo pipefail
          grep -F -- '- [x] Adapter-owned worker thread.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] Convert clocks into soft/hard budgets, not fixed depth.' docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md
          grep -F -- '- [x] 17.2 Search worker.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '- [x] 17.3 Time manager.' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F -- '**Current phase:** Task 17.3 complete; Task 17.4 UCI search output is next' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F -- '| 17.3 | `1c71f8dfa8449190ea8ae860386b6566b9176cbd` | `30789829090` / `91610825428` |' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          test -f docs/RUST_UCI_TIME_MANAGER.md
          test ! -e .github/workflows/task17-3-tracker-closure.yml
          test ! -e docs/TASK17_3_TRACKER_TRIGGER.md
          git diff --check

      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close Tasks 17.2 and 17.3"
          git push origin HEAD:rust-engine

      - name: Report success and close trigger
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Task 17.3 tracker closure completed at rust-engine SHA ${head_sha}."
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed
