name: CI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify workspace and validation assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f fixtures/perft.tsv
          test -f fixtures/differential_corpus.tsv
          test -f requirements/oracle.txt
          test -f scripts/differential_oracle.py
          test -f .github/review_fix_close.py
          python3 -m py_compile scripts/differential_oracle.py .github/review_fix_close.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine

      - name: Reject first-party lint suppression
        shell: bash
        run: |
          set -euo pipefail
          if grep \
            --recursive \
            --line-number \
            --include='*.rs' \
            --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' \
            crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Install Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle.txt

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        run: >-
          python scripts/differential_oracle.py
          --binary target/release/chess-tools
          --corpus fixtures/differential_corpus.tsv
          --games 12
          --plies 48
          --seed 0xC0FFEE

  close-review-fix:
    name: Close pre-Task-13 review fixes
    needs: rust-quality
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[review-fix-close]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRACKING_ISSUE: '73'
      CANDIDATE_SHA: 81a7cd4a58a52695eca2ede10d5c73c803851d17
      CANDIDATE_RUN: '30739166607'
      CANDIDATE_JOB: '91473334960'
      CONTROL_RUN: '30738801841'
    steps:
      - name: Check out rust-engine closure head
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Write closure evidence and remove temporary controls
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${CANDIDATE_SHA}" HEAD
          python .github/review_fix_close.py
          git show "${CANDIDATE_SHA}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm .github/review_fix_close.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .github
          git commit -m 'docs: close pre-Task-13 review fixes'
          git push origin HEAD:rust-engine
          echo "CLOSURE_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"

      - name: Dispatch final clean-head CI
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=rust-engine
          echo "dispatched_at=${dispatched_at}" >>"${GITHUB_OUTPUT}"

      - name: Resolve final CI run
        id: final
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            final_run="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=rust-engine \
              -f event=workflow_dispatch \
              -f per_page=20 \
              --jq ".workflow_runs | map(select(.head_sha == \"${CLOSURE_SHA}\" and .created_at >= \"${DISPATCHED_AT}\")) | sort_by(.created_at) | last | .id // empty")"
            if [[ -n "${final_run}" ]]; then
              echo "run_id=${final_run}" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          echo 'Final clean-head CI run did not become visible.' >&2
          exit 1

      - name: Require final CI success and record evidence
        shell: bash
        env:
          FINAL_RUN: ${{ steps.final.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "${FINAL_RUN}" --repo "${REPOSITORY}" --exit-status --interval 5
          jobs="$(gh api "repos/${REPOSITORY}/actions/runs/${FINAL_RUN}/jobs?per_page=100")"
          final_job="$(jq -r '.jobs[] | select(.name == "Rust workspace quality" and .conclusion == "success") | .id' <<<"${jobs}" | head -n1)"
          test -n "${final_job}"
          body="Rust review-fix Ralph Loop complete.

Implementation SHA: ${CANDIDATE_SHA}
Implementation CI: ${CANDIDATE_RUN} / ${CANDIDATE_JOB}
Documentation closure SHA: ${CLOSURE_SHA}
Final clean-head CI: ${FINAL_RUN} / ${final_job}
Tests: 112 executed non-doc Rust tests
Release depth-four perft: passed
Differential oracle: 15 positions, 293 child FENs, 272,991 nodes, 576 seeded plies
Task 13: active, not started"
          gh api --method POST "repos/${REPOSITORY}/issues/${TRACKING_ISSUE}/comments" -f body="${body}"
          gh api --method PATCH "repos/${REPOSITORY}/issues/${TRACKING_ISSUE}" -f state=closed -f state_reason=completed