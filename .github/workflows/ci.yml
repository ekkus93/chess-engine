name: CI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify workspace and validation assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f fixtures/perft.tsv
          test -f fixtures/differential_corpus.tsv
          test -f requirements/oracle.txt
          test -f scripts/differential_oracle.py
          test -f scripts/task_14_5_exclusion_audit.py
          python3 -m py_compile \
            scripts/differential_oracle.py \
            scripts/task_14_5_exclusion_audit.py

      - name: Run Task 14.5 exclusion audit
        run: python3 scripts/task_14_5_exclusion_audit.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine

      - name: Reject first-party lint suppression
        shell: bash
        run: |
          set -euo pipefail
          if grep \
            --recursive \
            --line-number \
            --include='*.rs' \
            --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' \
            crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Install Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle.txt

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        run: >-
          python scripts/differential_oracle.py
          --binary target/release/chess-tools
          --corpus fixtures/differential_corpus.tsv
          --games 12
          --plies 48
          --seed 0xC0FFEE

  task17-4-apply:
    name: Apply Task 17.4 implementation
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.title == '[apply-task17-4]'
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reconstruct and apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/task17_4_apply.py.gz.b64.?? | tr -d '\n' > /tmp/task17_4_apply.py.gz.b64
          test "$(wc -c < /tmp/task17_4_apply.py.gz.b64)" -eq 17608
          echo 'b137920781c47793916221c100184ea819461e95fd6e9e6c440253ca86ed1fa5  /tmp/task17_4_apply.py.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/task17_4_apply.py.gz.b64 | gzip --decompress > /tmp/task17_4_apply.py
          test "$(wc -c < /tmp/task17_4_apply.py)" -eq 51612
          echo '38922c440294be7ed3d800066907227e49df08a39c1584027f02b60ec7c9e2a6  /tmp/task17_4_apply.py' | sha256sum --check --strict
          python3 -m py_compile /tmp/task17_4_apply.py
          python3 /tmp/task17_4_apply.py
          sed -i '/^fn iterative_deepening_search_with_limits_and_clock<Clock>(/i #[cfg(test)]' crates/chess-search/src/iterative_deepening.rs
          cargo fmt --all

      - name: Check implementation
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run focused tests
        run: cargo test --locked -p chess-search -p chess-uci

      - name: Prepare permanent commits
        shell: bash
        run: |
          set -euo pipefail
          git show f58ec6941c2a7769c43f91802073015379a8d013:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f scripts/task17_4_apply.py.gz.b64 scripts/task17_4_apply.py.gz.b64.*
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement Task 17.4 UCI search output"
          implementation_sha="$(git rev-parse HEAD)"
          IMPLEMENTATION_SHA="${implementation_sha}" python3 - <<'PY'
          import os
          from pathlib import Path

          implementation_sha = os.environ["IMPLEMENTATION_SHA"]
          replacements = 0
          for path in Path("docs").glob("*.md"):
              text = path.read_text()
              if "TASK17_4_IMPLEMENTATION_SHA" not in text:
                  continue
              count = text.count("TASK17_4_IMPLEMENTATION_SHA")
              path.write_text(text.replace("TASK17_4_IMPLEMENTATION_SHA", implementation_sha))
              replacements += count
          if replacements == 0:
              raise SystemExit("Task 17.4 implementation evidence placeholder was not found")
          PY
          git add docs
          git diff --cached --check
          git commit -m "docs: record Task 17.4 implementation evidence"
          git push origin HEAD:rust-engine
