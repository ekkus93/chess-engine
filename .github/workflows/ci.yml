name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch-rust-engine:
    name: Dispatch pending rust-engine validation
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issues' &&
        github.event.issue.title == '[dispatch-rust-engine-ci]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '1'
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Resolve dispatch request
        id: command
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "issues" ]]; then
            echo 'dispatch=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_comment="$(
            gh api \
              --method GET \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f per_page=100 \
              --jq 'last | "\(.id)|\(.body)"'
          )"
          IFS='|' read -r comment_id comment_body <<<"${latest_comment}"

          if [[ "${comment_body}" != "/dispatch-rust-engine-ci" ]]; then
            echo 'No pending rust-engine dispatch command.'
            echo 'dispatch=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo 'dispatch=true' >>"${GITHUB_OUTPUT}"
          echo "comment_id=${comment_id}" >>"${GITHUB_OUTPUT}"

      - name: Dispatch CI at rust-engine
        if: steps.command.outputs.dispatch == 'true'
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine
          echo "dispatched_at=${dispatched_at}" >>"${GITHUB_OUTPUT}"

      - name: Resolve dispatched run ID
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        id: run
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail

          jq_filter=".workflow_runs | map(select(.created_at >= \"${DISPATCHED_AT}\")) | sort_by(.created_at) | last | if . == null then \"\" else \"\(.id)|\(.head_sha)|\(.status)\" end"

          for attempt in $(seq 1 30); do
            run_record="$(
              gh api \
                --method GET \
                "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch=rust-engine \
                -f event=workflow_dispatch \
                -f per_page=10 \
                --jq "${jq_filter}"
            )"

            if [[ -n "${run_record}" ]]; then
              IFS='|' read -r run_id head_sha run_status <<<"${run_record}"
              echo "run_id=${run_id}" >>"${GITHUB_OUTPUT}"
              echo "head_sha=${head_sha}" >>"${GITHUB_OUTPUT}"
              echo "run_status=${run_status}" >>"${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 2
          done

          echo 'Dispatched workflow run did not become visible within 60 seconds.' >&2
          exit 1

      - name: Report dispatched run
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
        run: |
          set -euo pipefail
          body="Dispatched CI run ${RUN_ID} for rust-engine SHA ${HEAD_SHA}; initial status: ${RUN_STATUS}."
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}/comments" \
            -f body="${body}"

      - name: Consume scheduled comment command
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'schedule'
        shell: bash
        env:
          COMMENT_ID: ${{ steps.command.outputs.comment_id }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body='/dispatch-rust-engine-ci — dispatched'

      - name: Close one-shot trigger issue
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed

  close-rust-review-fix:
    name: Close pre-Task-13 Rust review fixes
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'issues' &&
      github.event.issue.title == '[close-rust-review-fix]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRIGGER_ISSUE_NUMBER: ${{ github.event.issue.number }}
      CANDIDATE_SHA: 81a7cd4a58a52695eca2ede10d5c73c803851d17
      CANDIDATE_RUN: '30739166607'
      CANDIDATE_JOB: '91473334960'
      CONTROL_RUN: '30738801841'
    steps:
      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Confirm implementation candidate is current
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Write RF-006 closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          candidate = os.environ['CANDIDATE_SHA']
          control_run = os.environ['CONTROL_RUN']
          ci_run = os.environ['CANDIDATE_RUN']
          ci_job = os.environ['CANDIDATE_JOB']

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          replace_once(
              'docs/RUST_ENGINE_REVIEW_FIX_SPEC_2026-08-02.md',
              '**Status:** Implemented; exact-head validation pending',
              '**Status:** Complete',
          )

          todo = Path('docs/RUST_ENGINE_REVIEW_FIX_TODO_2026-08-02.md')
          text = todo.read_text(encoding='utf-8')
          text = text.replace('**Status:** Implemented; exact-head validation pending', '**Status:** Complete', 1)
          prefix, marker, suffix = text.partition('# RF-006: Review-fix validation and closure evidence')
          if not marker:
              raise SystemExit('RF-006 marker missing')
          suffix = suffix.replace('- [ ]', '- [x]')
          text = prefix + marker + suffix
          text = text.replace(
              '- RF-001 through RF-005 are implemented in the candidate tree; RF-006 remains open until exact-head permanent CI and documentation closure complete.',
              '- RF-001 through RF-006 are complete. The implementation candidate and documentation closure both receive permanent exact-head CI.',
              1,
          )
          replacements = {
              '- Final SHA: `TBD`': f'- Validated implementation SHA: `{candidate}`',
              '- CI run/job: `TBD`': f'- Implementation CI run/job: `{ci_run}` / `{ci_job}`',
              '- Rust test count: `TBD`': '- Rust test count: `112` executed non-doc Rust tests',
              '- Release perft: `TBD`': '- Release perft: authoritative six-position depth-four gate passed',
              '- Differential oracle summary: `TBD`': '- Differential oracle summary: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies passed with seed `0xC0FFEE`',
              '- Accepted external notices: `TBD`': '- Accepted external notices: GitHub Actions Node runtime and dependency `punycode` deprecation notices only',
              '- Temporary artifacts removed: `TBD`': '- Temporary artifacts removed: all review-fix one-shot workflows and patch scripts; no temporary branch or generated build artifact retained',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'TODO evidence target count for {old!r} was {text.count(old)}')
              text = text.replace(old, new, 1)
          text += (
              '\n## Closure note\n\n'
              f'- Implementation control run: `{control_run}`.\n'
              f'- Permanent implementation CI: `{ci_run}` / `{ci_job}` on `{candidate}`.\n'
              '- The clean closure SHA and final CI are recorded on the closure issue because a commit cannot contain its own SHA.\n'
              '- Task 13 remains active and not started.\n'
          )
          todo.write_text(text, encoding='utf-8')

          tracker = 'docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md'
          replace_once(tracker, '**Updated:** 2026-08-01', '**Updated:** 2026-08-02')
          replace_once(
              tracker,
              '| 13 | **Active** — reference search and alpha-beta; implementation remains not started pending review-fix closure. |',
              '| 13 | **Active** — reference search and alpha-beta; implementation is not started and may now begin. |',
          )
          section = f'''## Pre-Task-13 review-fix closure — COMPLETE

- [x] Search-safe opaque legal-move tokens are available to `chess-search` without legal-list regeneration.
- [x] Stale and wrong-origin tokens fail before mutation.
- [x] `Game::reset_to_starting` and `Game::set_position` establish fresh root history.
- [x] Divide output includes stable `elapsed_nanos` timing.
- [x] FEN analysis-position policy is explicit and tested.
- [x] Task 25 and immediate-next-operation tracking is current.
- [x] Review-fix gate passed.

Evidence:

- Implementation SHA: `{candidate}`.
- One-shot implementation control run: `{control_run}`.
- Permanent implementation CI run/job: `{ci_run}` / `{ci_job}`.
- Results: rustfmt, Cargo check, strict Clippy, 112 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc, debug/release builds, and independent differential validation passed.
- Differential oracle: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.
- Task 13 remains active and not started.

---

'''
          replace_once(
              tracker,
              '# Task 13: Reference search and alpha-beta — ACTIVE, NOT STARTED\n',
              section + '# Task 13: Reference search and alpha-beta — ACTIVE, NOT STARTED\n',
          )

          status = Path('docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md')
          status_text = status.read_text(encoding='utf-8')
          phase_old = '**Current phase:** Pre-Task-13 review-fix implementation candidate; Task 13 search remains not started'
          phase_new = '**Current phase:** Pre-Task-13 review-fix complete; Task 13 search is active and not started'
          if status_text.count(phase_old) != 1:
              raise SystemExit('Ralph phase target missing')
          status_text = status_text.replace(phase_old, phase_new, 1)
          start = '## Pre-Task-13 review-fix implementation candidate\n'
          end = '## Task 13 active scope\n'
          before, sep, rest = status_text.partition(start)
          if not sep:
              raise SystemExit('Ralph review section missing')
          _, sep2, after = rest.partition(end)
          if not sep2:
              raise SystemExit('Ralph Task 13 section missing')
          completion = f'''## Pre-Task-13 review-fix completion

Completed and validated:

- opaque source-bound legal-move tokens usable by `chess-search`;
- non-mutating stale/wrong-origin token rejection;
- explicit `Game::reset_to_starting` and `Game::set_position`;
- stable `elapsed_nanos` divide output;
- explicit strict structural analysis-FEN policy and safety tests;
- corrected Task 25 coverage and Task 13 next-operation text.

Evidence:

- Implementation SHA: `{candidate}`.
- One-shot implementation control run: `{control_run}`.
- Permanent implementation CI run/job: `{ci_run}` / `{ci_job}`.
- Results: formatting, lockfile/metadata, Cargo check, Clippy with `-D warnings`, 112 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc with `-D warnings`, debug/release builds, and differential validation passed.
- Differential validation: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.
- First-party warnings: none.
- Accepted external notices: GitHub Actions Node runtime and dependency `punycode` deprecation notices only.
- Task 13 remains active and not started.

'''
          status.write_text(before + completion + end + after, encoding='utf-8')
          PY

      - name: Commit documentation closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: close pre-Task-13 review fixes'
          git push origin HEAD:rust-engine
          echo "CLOSURE_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"

      - name: Dispatch final CI
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=rust-engine
          echo "dispatched_at=${dispatched_at}" >>"${GITHUB_OUTPUT}"

      - name: Require final clean-head CI
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          final_run=''
          for _ in $(seq 1 60); do
            record="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=rust-engine -f event=workflow_dispatch -f per_page=20 \
              --jq ".workflow_runs | map(select(.head_sha == \"${CLOSURE_SHA}\" and .created_at >= \"${DISPATCHED_AT}\")) | sort_by(.created_at) | last | if . == null then \"\" else \"\(.id)|\(.status)|\(.conclusion // \"\")\" end")"
            if [[ -n "${record}" ]]; then
              IFS='|' read -r final_run final_status final_conclusion <<<"${record}"
              if [[ "${final_status}" == completed ]]; then
                test "${final_conclusion}" = success
                break
              fi
            fi
            sleep 10
          done
          test -n "${final_run}"
          jobs="$(gh api "repos/${REPOSITORY}/actions/runs/${final_run}/jobs?per_page=100")"
          final_job="$(jq -r '.jobs[] | select(.name == "Rust workspace quality" and .conclusion == "success") | .id' <<<"${jobs}" | head -n1)"
          test -n "${final_job}"
          echo "FINAL_RUN=${final_run}" >>"${GITHUB_ENV}"
          echo "FINAL_JOB=${final_job}" >>"${GITHUB_ENV}"

      - name: Report and close closure issue
        shell: bash
        run: |
          set -euo pipefail
          body="Rust review-fix Ralph Loop complete.

Implementation SHA: ${CANDIDATE_SHA}
Implementation CI: ${CANDIDATE_RUN} / ${CANDIDATE_JOB}
Documentation closure SHA: ${CLOSURE_SHA}
Final clean-head CI: ${FINAL_RUN} / ${FINAL_JOB}
Tests: 112 executed non-doc Rust tests
Release depth-four perft: passed
Differential oracle: 15 positions, 293 child FENs, 272,991 nodes, 576 seeded plies
Task 13: active, not started"
          gh api --method POST "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}/comments" -f body="${body}"
          gh api --method PATCH "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}" -f state=closed -f state_reason=completed
