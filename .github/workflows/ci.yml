name: CI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-cycle Task 10 duplicate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/chess-core/src/game.rs")
          text = path.read_text()
          first_marker = "fn illegal_game_move_does_not_change_position_or_history()"
          next_marker = "    #[test]\n    fn search_history_is_detached_and_reversible()"
          occurrences = []
          offset = 0
          while True:
              index = text.find(first_marker, offset)
              if index < 0:
                  break
              occurrences.append(index)
              offset = index + len(first_marker)

          if len(occurrences) == 2:
              remove_start = text.rfind("    #[test]\n", 0, occurrences[1])
              remove_end = text.find(next_marker, occurrences[1])
              if remove_start < 0 or remove_end < 0 or remove_start >= remove_end:
                  raise SystemExit("could not isolate the second adjacent Task 10 test pair")
              text = text[:remove_start] + text[remove_end:]
              path.write_text(text)
          elif len(occurrences) != 1:
              raise SystemExit(
                  f"expected one or two illegal-move history tests, found {len(occurrences)}"
              )
          PY
          if test -f .github/workflows/task10-deduplicate-tests-once.yml; then
            git rm .github/workflows/task10-deduplicate-tests-once.yml
          fi
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/chess-core/src/game.rs
            git commit -m "test(core): deduplicate Task 10 history coverage"
            git push origin HEAD:rust-engine
          fi

      - name: Verify Cargo workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine

      - name: Reject first-party lint suppression
        shell: bash
        run: |
          set -euo pipefail
          if grep \
            --recursive \
            --line-number \
            --include='*.rs' \
            --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' \
            crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release
