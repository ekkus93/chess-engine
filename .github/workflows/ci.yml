name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch-rust-engine:
    name: Dispatch pending rust-engine validation
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issues' &&
        github.event.issue.title == '[dispatch-rust-engine-ci]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '1'
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Resolve dispatch request
        id: command
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "issues" ]]; then
            echo 'dispatch=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_comment="$(
            gh api \
              --method GET \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f per_page=100 \
              --jq 'last | "\(.id)|\(.body)"'
          )"
          IFS='|' read -r comment_id comment_body <<<"${latest_comment}"

          if [[ "${comment_body}" != "/dispatch-rust-engine-ci" ]]; then
            echo 'No pending rust-engine dispatch command.'
            echo 'dispatch=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo 'dispatch=true' >>"${GITHUB_OUTPUT}"
          echo "comment_id=${comment_id}" >>"${GITHUB_OUTPUT}"

      - name: Dispatch CI at rust-engine
        if: steps.command.outputs.dispatch == 'true'
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine
          echo "dispatched_at=${dispatched_at}" >>"${GITHUB_OUTPUT}"

      - name: Resolve dispatched run ID
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        id: run
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail

          jq_filter=".workflow_runs | map(select(.created_at >= \"${DISPATCHED_AT}\")) | sort_by(.created_at) | last | if . == null then \"\" else \"\(.id)|\(.head_sha)|\(.status)\" end"

          for attempt in $(seq 1 30); do
            run_record="$(
              gh api \
                --method GET \
                "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch=rust-engine \
                -f event=workflow_dispatch \
                -f per_page=10 \
                --jq "${jq_filter}"
            )"

            if [[ -n "${run_record}" ]]; then
              IFS='|' read -r run_id head_sha run_status <<<"${run_record}"
              echo "run_id=${run_id}" >>"${GITHUB_OUTPUT}"
              echo "head_sha=${head_sha}" >>"${GITHUB_OUTPUT}"
              echo "run_status=${run_status}" >>"${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 2
          done

          echo 'Dispatched workflow run did not become visible within 60 seconds.' >&2
          exit 1

      - name: Report dispatched run
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
        run: |
          set -euo pipefail
          body="Dispatched CI run ${RUN_ID} for rust-engine SHA ${HEAD_SHA}; initial status: ${RUN_STATUS}."
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}/comments" \
            -f body="${body}"

      - name: Consume scheduled comment command
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'schedule'
        shell: bash
        env:
          COMMENT_ID: ${{ steps.command.outputs.comment_id }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body='/dispatch-rust-engine-ci — dispatched'

      - name: Close one-shot trigger issue
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed

  close-task-14-4:
    name: Close Task 14.4 trackers
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'issues' &&
      github.event.issue.title == '[close-task-14-4]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - name: Patch trackers and remove temporary controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          implementation_sha = "dc758a3fc62e7f7002191993c73773dd2a71caef"
          run_id = "30763226685"
          job_id = "91537383867"

          def ensure_replace(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"{path}: neither old nor new text found: {old!r}")

          definitions = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md")
          ensure_replace(
              definitions,
              """## 14.4 Correctness tests

- [ ] Horizon capture sequence.
- [ ] In-check leaf may not stand pat.
- [ ] Promotion sequence.
- [ ] Poisoned capture where qsearch changes evaluation.
- [ ] Quiescence boundedness.
""",
              """## 14.4 Correctness tests

- [x] Horizon capture sequence.
- [x] In-check leaf may not stand pat.
- [x] Promotion sequence.
- [x] Poisoned capture where qsearch changes evaluation.
- [x] Quiescence boundedness.
""",
          )

          todo = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          ensure_replace(
              todo,
              "| 14 | **Active** — Tasks 14.1–14.2 complete; Task 14.3 quiet ordering next. |",
              "| 14 | **Active** — Tasks 14.1–14.4 complete; Task 14.5 exclusion audit next. |",
          )
          ensure_replace(todo, "- [ ] 14.4 Correctness tests.", "- [x] 14.4 Correctness tests.")
          old_todo_tail = "- Reference search retains exact legal-generation order; Task 14.2 tactical ordering remains available as a control policy. Task 14.4 correctness consolidation is next.\n\n# Task 15: Fixed-capacity transposition table — NOT STARTED"
          new_todo_tail = f"""- Reference search retains exact legal-generation order; Task 14.2 tactical ordering remains available as a control policy. Task 14.4 correctness consolidation is complete; Task 14.5 exclusion audit is next.

### Task 14.4 completion evidence

- Dedicated regressions: `crates/chess-search/tests/search_quiescence_task_14_4.rs`.
- Exact validated implementation/evidence SHA: `{implementation_sha}`.
- Permanent CI run/job: `{run_id}` / `{job_id}`.
- Results: workspace assets, committed lockfile, metadata, rustfmt, Cargo check, strict Clippy, 155 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc with warnings denied, debug/release builds, and independent differential validation passed.
- The horizon witness searches the full `Qxe5 Rxe5 Rxe5` tactical continuation beyond the nominal leaf and restores the exact root state.
- The in-check witness proves stand-pat is unavailable by requiring a searched quiet king evasion and more than one visited node.
- The promotion witness searches promotion, forced recapture, and counter-recapture rather than stopping at the promotion leaf.
- The poisoned-capture witness explicitly proves static leaf evaluation overvalues `Qxd8`, quiescence lowers that score after forced `Kxd8`, and the one-ply root rejects the poisoned move.
- The boundedness witness proves a zero-ply guard returns one-node stand-pat outside check but fails loudly with `QuiescenceDepthLimitReachedInCheck` while checked.
- Every new path verifies position/history snapshots, invariants, and incremental/recomputed Zobrist restoration.
- Differential oracle: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.
- First-party warnings: none.
- Accepted external notices: GitHub Actions Node runtime, dependency `punycode`, and `url.parse()` deprecation notices only.
- Task 14.5 explicit-exclusion audit is next; the overall Task 14 gate remains open.

# Task 15: Fixed-capacity transposition table — NOT STARTED"""
          ensure_replace(todo, old_todo_tail, new_todo_tail)

          ralph = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          ensure_replace(
              ralph,
              "**Current phase:** Tasks 14.1–14.3 complete; Task 14.4 correctness consolidation is next",
              "**Current phase:** Tasks 14.1–14.4 complete; Task 14.5 explicit-exclusion audit is next",
          )
          old_row = "| 14.3 | `f08b2d519ffc066d8d6b18326e03ead278d908de` | `30762457921` / `91535329886` | bounded killer/history quiet ordering, 150 Rust tests, deterministic exact-score and strict node-reduction witnesses, depth-four perft, and differential oracle green |"
          new_row = old_row + f"\n| 14.4 | `{implementation_sha}` | `{run_id}` / `{job_id}` | five explicit quiescence correctness witnesses, 155 Rust tests, depth-four perft, and differential oracle green |"
          ensure_replace(ralph, old_row, new_row)
          old_completion = "- Task 14.4 consolidated correctness tests are next; Tasks 14.5, 15, and 16 remain intentionally open.\n\n## Task 14 active scope"
          new_completion = f"""- Task 14.4 consolidated correctness tests are complete; Tasks 14.5, 15, and 16 remain intentionally open.

## Task 14.4 completion

Implemented and validated:

- a true multi-capture horizon sequence (`Qxe5 Rxe5 Rxe5`) searched to a quiet position;
- an in-check leaf that must search a quiet legal evasion and cannot stand pat;
- a promotion sequence searched through forced recapture and counter-recapture;
- a poisoned capture whose static leaf score is explicitly corrected downward by quiescence before root move selection;
- finite guard behavior: one-node stand-pat outside check and fail-loud refusal to truncate while checked;
- exact position, detached-history, invariant, and incremental/recomputed-Zobrist restoration on every new path;
- `crates/chess-search/tests/search_quiescence_task_14_4.rs`.

Evidence:

- Exact validated implementation/evidence SHA: `{implementation_sha}`.
- Permanent CI run/job: `{run_id}` / `{job_id}`.
- Results: workspace assets, committed lockfile, metadata, rustfmt, Cargo check, strict Clippy, 155 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc with warnings denied, debug/release builds, and independent differential validation passed.
- Dedicated Task 14.4 suite: 5 passed; original quiescence suite: 5 passed; search-equivalence suite: 3 passed; immutability suite: 4 passed; terminal/mate-distance suite: 4 passed.
- Differential validation: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.
- First-party warnings: none.
- Accepted external notices: GitHub Actions Node runtime, dependency `punycode`, and `url.parse()` deprecation notices only.
- Task 14.5 explicit-exclusion audit is next; the overall Task 14 gate remains open.

## Task 14 active scope"""
          ensure_replace(ralph, old_completion, new_completion)
          ensure_replace(
              ralph,
              "- [ ] Complete Task 14.4 consolidated correctness tests and Task 14.5 exclusion audit.",
              "- [x] Complete Task 14.4 consolidated correctness tests.\n- [ ] Complete Task 14.5 exclusion audit.",
          )
          ensure_replace(
              ralph,
              "No pull request has been created; work remains on `rust-engine`. Task 14.4 consolidated correctness tests are the next operation.",
              "No pull request has been created; work remains on `rust-engine`. Task 14.5 explicit-exclusion audit is the next operation.",
          )
          PY
          rm -f .github/workflows/task-14-4-validation.yml docs/TASK_14_4_CI_EVIDENCE.txt
          git diff --check
      - name: Commit and push closure
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          else
            git diff --cached --check
            git commit -m 'docs: close Task 14.4 correctness tests'
            git push origin HEAD:rust-engine
            echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          fi
      - name: Report and close issue
        shell: bash
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Closed Task 14.4 trackers and temporary controls at SHA ${SHA}; validated implementation/evidence SHA dc758a3fc62e7f7002191993c73773dd2a71caef, CI 30763226685 / 91537383867."
          gh api --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed
