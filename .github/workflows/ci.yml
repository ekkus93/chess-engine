name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch-rust-engine:
    name: Dispatch pending rust-engine validation
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issues' &&
        github.event.issue.title == '[dispatch-rust-engine-ci]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: '1'
      EVENT_NAME: ${{ github.event_name }}
      TRIGGER_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Resolve dispatch request
        id: command
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "issues" ]]; then
            echo 'dispatch=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_comment="$(
            gh api \
              --method GET \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f per_page=100 \
              --jq 'last | "\(.id)|\(.body)"'
          )"
          IFS='|' read -r comment_id comment_body <<<"${latest_comment}"

          if [[ "${comment_body}" != "/dispatch-rust-engine-ci" ]]; then
            echo 'No pending rust-engine dispatch command.'
            echo 'dispatch=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo 'dispatch=true' >>"${GITHUB_OUTPUT}"
          echo "comment_id=${comment_id}" >>"${GITHUB_OUTPUT}"

      - name: Dispatch CI at rust-engine
        if: steps.command.outputs.dispatch == 'true'
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=rust-engine
          echo "dispatched_at=${dispatched_at}" >>"${GITHUB_OUTPUT}"

      - name: Resolve dispatched run ID
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        id: run
        shell: bash
        env:
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail

          jq_filter=".workflow_runs | map(select(.created_at >= \"${DISPATCHED_AT}\")) | sort_by(.created_at) | last | if . == null then \"\" else \"\(.id)|\(.head_sha)|\(.status)\" end"

          for attempt in $(seq 1 30); do
            run_record="$(
              gh api \
                --method GET \
                "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch=rust-engine \
                -f event=workflow_dispatch \
                -f per_page=10 \
                --jq "${jq_filter}"
            )"

            if [[ -n "${run_record}" ]]; then
              IFS='|' read -r run_id head_sha run_status <<<"${run_record}"
              echo "run_id=${run_id}" >>"${GITHUB_OUTPUT}"
              echo "head_sha=${head_sha}" >>"${GITHUB_OUTPUT}"
              echo "run_status=${run_status}" >>"${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 2
          done

          echo 'Dispatched workflow run did not become visible within 60 seconds.' >&2
          exit 1

      - name: Report dispatched run
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          RUN_STATUS: ${{ steps.run.outputs.run_status }}
        run: |
          set -euo pipefail
          body="Dispatched CI run ${RUN_ID} for rust-engine SHA ${HEAD_SHA}; initial status: ${RUN_STATUS}."
          gh api \
            --method POST \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}/comments" \
            -f body="${body}"

      - name: Consume scheduled comment command
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'schedule'
        shell: bash
        env:
          COMMENT_ID: ${{ steps.command.outputs.comment_id }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
            -f body='/dispatch-rust-engine-ci — dispatched'

      - name: Close one-shot trigger issue
        if: >-
          steps.command.outputs.dispatch == 'true' &&
          github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed

  close-task-13-3:
    name: Close Task 13.3 trackers
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'issues' &&
      github.event.issue.title == '[close-task-13-3]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TRIGGER_ISSUE_NUMBER: ${{ github.event.issue.number }}
      EXPECTED_HEAD: bdf98a8e7c5cb6aadc55ba3638cd3af2f4ba9e91
    steps:
      - name: Check out validated branch
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Require exact validated implementation head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_HEAD}"

      - name: Update Task 13.3 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo_path = Path('docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md')
          todo = todo_path.read_text()
          replacements = {
              '| 13 | **Active** — Tasks 13.1–13.2 complete; Task 13.3 shallow equivalence is next. |':
                  '| 13 | **Active** — Tasks 13.1–13.3 complete; Task 13.4 immutability is next. |',
              '- [ ] 13.3 Shallow equivalence.': '- [x] 13.3 Shallow equivalence.',
              '- Task 13.3 owns direct shallow score, uniquely-best-move, and node-count equivalence against reference search.':
                  '- Task 13.3 now provides direct shallow score, uniquely-best-move, and node-count equivalence against reference search.\n\n'
                  '### Task 13.3 completion evidence\n\n'
                  '- Integration suite: `crates/chess-search/tests/search_equivalence.rs`.\n'
                  '- Contract documentation: `docs/RUST_SEARCH_EQUIVALENCE.md`.\n'
                  '- Exact validated implementation SHA: `bdf98a8e7c5cb6aadc55ba3638cd3af2f4ba9e91`.\n'
                  '- Permanent CI run/job: `30743024471` / `91483729312`.\n'
                  '- Results: rustfmt, Cargo check, strict Clippy, 127 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc, debug/release builds, and independent differential validation passed.\n'
                  '- Curated paired searches cover quiet opening, tactical material, mate-adjacent, mated, stalemate, fifty-move, and game-history repetition positions at depths one through three.\n'
                  '- Every paired fixture returned an identical exact score; alpha-beta visited no more nodes than reference search on every fixture and strictly fewer on at least one.\n'
                  '- The tactical fixture independently proved `d1d8` is the unique exact best move before requiring both searches to return it.\n'
                  '- Every successful paired invocation restored the root position, incremental Zobrist identity, and detached history. Task 13.4 remains open for its broader immutability and cancellation contract.\n'
                  '- Differential oracle: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.\n'
                  '- First-party warnings: none.\n'
                  '- Accepted external notices: GitHub Actions Node runtime, dependency `punycode`, and `url.parse()` deprecation notices only.\n'
                  '- Task 13.4 is next; Task 13.5 and the overall Task 13 gate remain open.',
              '1. Implement Task 13.3 curated shallow equivalence between reference and alpha-beta search.\n2. Compare exact scores at accepted depths across quiet, tactical, terminal-adjacent, draw, and repetition-aware positions.\n3. Require identical root moves only when the best score is unique; preserve deterministic tie diagnostics separately.\n4. Prove alpha-beta visits no more nodes than reference on every compared fixture and strictly fewer on at least one pruning fixture.\n5. Keep root position, Zobrist identity, and detached history unchanged after every paired search.\n6. Leave Task 13.4 cancellation restoration and the complete Task 13.5 terminal fixture set open until implemented.':
                  '1. Implement Task 13.4 search immutability as a dedicated contract.\n2. Add cancellation support or the minimum cancellable search boundary required to prove cancellation restoration without prematurely implementing Task 16 limits.\n3. Require root position, Zobrist identity, and detached history to remain exact after normal completion, terminal completion, validation failure, and cancellation.\n4. Exercise repeated searches from the same root and verify no state or history drift accumulates.\n5. Keep Task 13.5 shorter-mate and longer-survival fixtures open until the immutability contract is complete.\n6. Do not close the overall Task 13 gate until Tasks 13.4 and 13.5 pass exact-head validation.'
          }
          for old, new in replacements.items():
              if todo.count(old) != 1:
                  raise SystemExit(f'TODO replacement count for {old!r}: {todo.count(old)}')
              todo = todo.replace(old, new)
          todo_path.write_text(todo)

          ralph_path = Path('docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md')
          ralph = ralph_path.read_text()
          replacements = {
              '**Current phase:** Tasks 13.1–13.2 complete; Task 13.3 shallow equivalence is next':
                  '**Current phase:** Tasks 13.1–13.3 complete; Task 13.4 immutability is next',
              '| 13.2 | `d662ca07cae6b0044c1ce620a0dc4f3249784d6c` | `30741988672` / `91480926153` | negamax alpha-beta, 124 Rust tests, depth-four perft, and differential oracle green |':
                  '| 13.2 | `d662ca07cae6b0044c1ce620a0dc4f3249784d6c` | `30741988672` / `91480926153` | negamax alpha-beta, 124 Rust tests, depth-four perft, and differential oracle green |\n'
                  '| 13.3 | `bdf98a8e7c5cb6aadc55ba3638cd3af2f4ba9e91` | `30743024471` / `91483729312` | shallow equivalence, 127 Rust tests, depth-four perft, and differential oracle green |',
              '- Task 13.3 remains not started.\n\n## Task 13 active scope':
                  '- Task 13.3 is complete.\n\n'
                  '## Task 13.3 completion\n\n'
                  'Implemented and validated:\n\n'
                  '- curated shallow score equivalence across quiet, tactical, terminal-adjacent, terminal, rule-draw, and repetition-aware positions;\n'
                  '- an independent root-child score oracle proving `d1d8` is the tactical fixture’s unique exact best move;\n'
                  '- alpha-beta node counts no greater than reference counts on every fixture;\n'
                  '- at least one strict pruning witness;\n'
                  '- exact root position, incremental Zobrist, and detached-history restoration after each paired successful search;\n'
                  '- `crates/chess-search/tests/search_equivalence.rs`;\n'
                  '- `docs/RUST_SEARCH_EQUIVALENCE.md`.\n\n'
                  'Evidence:\n\n'
                  '- Exact validated implementation SHA: `bdf98a8e7c5cb6aadc55ba3638cd3af2f4ba9e91`.\n'
                  '- Permanent CI run/job: `30743024471` / `91483729312`.\n'
                  '- Results: workspace assets, lockfile, metadata, rustfmt, Cargo check, Clippy with `-D warnings`, 127 executed non-doc Rust tests, authoritative release depth-four perft, rustdoc with `-D warnings`, debug build, release build, and independent differential validation passed.\n'
                  '- Differential validation: 15 corpus positions, 293 child FENs, 272,991 oracle perft nodes, and 576 seeded plies with seed `0xC0FFEE`.\n'
                  '- First-party warnings: none.\n'
                  '- Accepted external notices: GitHub Actions Node runtime, dependency `punycode`, and `url.parse()` deprecation notices only.\n'
                  '- Task 13.4 remains not started.\n\n'
                  '## Task 13 active scope',
              '- [ ] Prove shallow reference/alpha-beta score equivalence.':
                  '- [x] Prove shallow reference/alpha-beta score equivalence.',
              '- [ ] Compare uniquely best moves and node counts.':
                  '- [x] Compare uniquely best moves and node counts.'
          }
          for old, new in replacements.items():
              if ralph.count(old) != 1:
                  raise SystemExit(f'Ralph replacement count for {old!r}: {ralph.count(old)}')
              ralph = ralph.replace(old, new)
          ralph_path.write_text(ralph)
          PY

      - name: Commit documentation closure
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git diff --cached --check
          git commit -m 'docs: close Task 13.3 equivalence'
          git push origin HEAD:rust-engine
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Report and close trigger
        shell: bash
        env:
          CLOSURE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          body="Task 13.3 tracker closure committed at ${CLOSURE_SHA}. Exact implementation CI: 30743024471 / 91483729312 on bdf98a8e7c5cb6aadc55ba3638cd3af2f4ba9e91. Task 13.4 remains open."
          gh api --method POST "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}/comments" -f body="${body}"
          gh api --method PATCH "repos/${REPOSITORY}/issues/${TRIGGER_ISSUE_NUMBER}" -f state=closed -f state_reason=completed
