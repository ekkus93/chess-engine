name: CI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-baseline:
    name: Python reference baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Capture frozen Python baseline
        env:
          RUN_SLOW: "1"
        run: bash scripts/capture-rust-port-python-baseline.sh

      - name: Upload Python baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-port-python-baseline-${{ github.sha }}
          path: artifacts/rust-port-python-baseline/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30

  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.toml ]]; then
            echo "::error file=Cargo.toml::The rust-engine branch does not yet contain a Cargo workspace. Complete Task 1 of docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Upload generated Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 30
