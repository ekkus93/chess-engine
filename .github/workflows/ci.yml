name: CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-task14-closure:
    name: Fix Task 14.1 closure transition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: master
          path: control
      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          path: target
      - name: Guard closure head
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e18c3cbeec1c221f8dfcb902cf552c8857766b8b'
      - name: Correct stale transition text
        working-directory: target
        run: |
          set -euo pipefail
          python ../control/.github/fix_task14_closure.py .
          git diff --check
      - name: Commit and push
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
                  docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          git commit -m 'docs: align Task 14.1 transition status'
          git push origin HEAD:rust-engine
