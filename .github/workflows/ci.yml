name: CI

on:
  push:
    branches:
      - rust-engine
  pull_request:
    branches:
      - rust-engine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Apply Task 15 production integration
        run: |
          python3 scripts/implement_task_15_gate.py "$GITHUB_WORKSPACE"
          python3 scripts/fix_task_15_gate_dead_code.py "$GITHUB_WORKSPACE"

      - name: Verify workspace and validation assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f fixtures/perft.tsv
          test -f fixtures/differential_corpus.tsv
          test -f requirements/oracle.txt
          test -f scripts/differential_oracle.py
          test -f scripts/task_14_5_exclusion_audit.py
          test -f crates/chess-search/tests/search_transposition.rs
          test -f docs/RUST_TRANSPOSITION_TABLE_SEARCH_INTEGRATION.md
          python3 -m py_compile \
            scripts/differential_oracle.py \
            scripts/task_14_5_exclusion_audit.py

      - name: Run Task 14.5 exclusion audit
        run: python3 scripts/task_14_5_exclusion_audit.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine

      - name: Reject first-party lint suppression
        shell: bash
        run: |
          set -euo pipefail
          if grep \
            --recursive \
            --line-number \
            --include='*.rs' \
            --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' \
            crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Format implementation
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run release TT integration witnesses
        run: |
          set -euo pipefail
          cargo test --locked -p chess-search --release transposition_move_ordering_reduces_fixed_narrow_window_tree
          cargo test --locked -p chess-search --release warm_table_exact_root_hit_reduces_nodes_and_preserves_result

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Install Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle.txt

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        run: >-
          python scripts/differential_oracle.py
          --binary target/release/chess-tools
          --corpus fixtures/differential_corpus.tsv
          --games 12
          --plies 48
          --seed 0xC0FFEE

      - name: Commit validated implementation without workflow changes
        run: |
          set -euo pipefail
          git rm \
            scripts/implement_task_15_gate.py \
            scripts/fix_task_15_gate_dead_code.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/chess-search/src/alpha_beta.rs \
            crates/chess-search/src/lib.rs \
            crates/chess-search/src/move_ordering.rs \
            crates/chess-search/tests/search_transposition.rs \
            docs/RUST_TRANSPOSITION_TABLE_SEARCH_INTEGRATION.md
          git diff --cached --check
          git commit -m "feat: integrate TT into alpha-beta search"
          git push origin HEAD:rust-engine
