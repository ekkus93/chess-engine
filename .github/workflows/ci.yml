name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust workspace quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify workspace and validation assets
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          test -f fixtures/perft.tsv
          test -f fixtures/differential_corpus.tsv
          test -f requirements/oracle.txt
          test -f scripts/differential_oracle.py
          test -f scripts/task_14_5_exclusion_audit.py
          test -f scripts/task_19_5_opening_book_audit.py
          test -f scripts/task_25_artifact_audit.py
          test -f scripts/task_26_v0_1_audit.sh
          test -f scripts/task_26_uci_smoke.sh
          test -f scripts/task_27_full_port_audit.sh
          test -f scripts/task_post_port_review_fix_audit.sh
          test -f scripts/dev.sh
          test -f fixtures/tuning_config.example
          test -f docs/RUST_DEVELOPER_WORKFLOWS.md
          test -f docs/RUST_GENERATED_ARTIFACT_POLICY.md
          test -f docs/RUST_CHESS_ENGINE_V0_1_IMPLEMENTATION_REPORT.md
          test -f docs/RUST_CHESS_ENGINE_PORT_IMPLEMENTATION_REPORT.md
          test -f crates/chess-book/tests/task_19_5.rs
          python3 -m py_compile \
            scripts/differential_oracle.py \
            scripts/task_14_5_exclusion_audit.py \
            scripts/task_19_5_opening_book_audit.py \
            scripts/task_25_artifact_audit.py
          bash -n \
            scripts/dev.sh \
            scripts/build_android_jni.sh \
            scripts/prepare_android_harness_jni.sh \
            scripts/task_26_v0_1_audit.sh \
            scripts/task_26_uci_smoke.sh \
            scripts/task_27_full_port_audit.sh \
            scripts/task_post_port_review_fix_audit.sh

      - name: Run Task 25 developer-workflow audits
        run: |
          python3 scripts/task_25_artifact_audit.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run Task 26 v0.1 signoff audit
        run: bash scripts/task_26_v0_1_audit.sh

      - name: Run Task 27 full-port audit
        run: bash scripts/task_27_full_port_audit.sh

      - name: Run post-port review fix audit
        run: bash scripts/task_post_port_review_fix_audit.sh

      - name: Run Task 14.5 exclusion audit
        run: python3 scripts/task_14_5_exclusion_audit.py

      - name: Run Task 19.5 opening-book audit
        run: python3 scripts/task_19_5_opening_book_audit.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine

      - name: Reject first-party lint suppression
        shell: bash
        run: |
          set -euo pipefail
          if grep \
            --recursive \
            --line-number \
            --include='*.rs' \
            --extended-regexp '#!\[(allow|expect)|#\[(allow|expect)' \
            crates; then
            echo '::error::First-party Rust lint suppression is forbidden.'
            exit 1
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Validate workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Run authoritative release perft
        run: cargo test --locked -p chess-core --release authoritative_perft_depth_four -- --ignored --exact

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build debug workspace
        run: cargo build --locked --workspace --all-features

      - name: Build release workspace
        run: cargo build --locked --workspace --all-features --release

      - name: Run playable UCI v0.1 smoke
        run: bash scripts/task_26_uci_smoke.sh target/release/chess-uci

      - name: Install Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/oracle.txt

      - name: Install pinned differential oracle
        run: python -m pip install --disable-pip-version-check --requirement requirements/oracle.txt

      - name: Run differential corpus and seeded playouts
        run: >-
          python scripts/differential_oracle.py
          --binary target/release/chess-tools
          --corpus fixtures/differential_corpus.tsv
          --games 12
          --plies 48
          --seed 0xC0FFEE
  linux-arm64-build:
    name: Linux ARM64 workspace build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-arm64-workspace

      - name: Validate ARM64 workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Build debug ARM64 workspace
        run: cargo build --locked --workspace --all-features

      - name: Compile ARM64 workspace tests
        run: cargo test --locked --workspace --all-features --no-run

      - name: Build release ARM64 workspace
        run: cargo build --locked --workspace --all-features --release
