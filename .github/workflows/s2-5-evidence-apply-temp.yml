name: S2-5 evidence apply temporary
# witness-revision: 2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-5-evidence-apply-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-5-evidence-apply-temporary
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and validate permanent S2-5 evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm validated implementation ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 95d1917d986bc3f9ec808ba0f5f5a1a63619e5aa HEAD
          test -f scripts/s2_5_evidence_apply.py
          test -f scripts/s2_5_evidence_refine.py
          python3 -m py_compile scripts/s2_5_evidence_apply.py scripts/s2_5_evidence_refine.py

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply permanent evidence patch
        run: |
          set -euo pipefail
          python3 scripts/s2_5_evidence_apply.py
          python3 scripts/s2_5_evidence_refine.py
          rm scripts/s2_5_evidence_apply.py scripts/s2_5_evidence_refine.py
          cargo fmt --all
          git diff --check

      - name: Validate permanent architecture and focused code
        run: |
          set -euo pipefail
          mv .github/workflows/s2-5-evidence-apply-temp.yml /tmp/s2-5-evidence-apply-temp.yml
          bash scripts/task_s2_5_see_ordering_audit.sh
          cargo fmt --all -- --check
          cargo check --locked -p chess-search -p chess-tools --all-targets --all-features
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_5_see_ordering
          mv /tmp/s2-5-evidence-apply-temp.yml .github/workflows/s2-5-evidence-apply-temp.yml

      - name: Exercise deterministic, clock, and allocation evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p chess-tools --bin s2_5_see_ordering
          export S2_5_SOURCE_SHA="$(git rev-parse HEAD)"
          export S2_5_BUILD_IDENTITY="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          target/release/s2_5_see_ordering deterministic /tmp/s2-5-deterministic-a
          target/release/s2_5_see_ordering deterministic /tmp/s2-5-deterministic-b
          diff -ru /tmp/s2-5-deterministic-a /tmp/s2-5-deterministic-b
          target/release/s2_5_see_ordering clock /tmp/s2-5-clock
          target/release/s2_5_see_ordering benchmark 3

      - name: Commit validated permanent evidence
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add -A
          git commit -m "test(search): add permanent S2-5 validation evidence"
          git push origin HEAD:master
