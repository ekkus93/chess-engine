name: S2-11 fresh profiling

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: s2-11-fresh-profiling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callgrind:
    name: Callgrind ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove source equivalence to S2-10 final head
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD)"
          test "$changed" = ".github/workflows/s2-11-profiling.yml"
          test "$(git rev-parse HEAD^1)" = "b20d34b3fc6210f0eff7a2124168e6d5e084f36a"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Callgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind

      - name: Record environment provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s2-11-profile
          {
            printf 'profile_commit\t%s\n' "$(git rev-parse HEAD)"
            printf 'source_commit\t%s\n' "$(git rev-parse HEAD^1)"
            printf 'profile_tree\t%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'source_tree\t%s\n' "$(git rev-parse 'HEAD^1^{tree}')"
            printf 'architecture\t%s\n' "${{ matrix.arch }}"
            printf 'runner\t%s\n' "${{ matrix.runner }}"
            printf 'workflow\t%s\n' '.github/workflows/s2-11-profiling.yml'
            printf 'source_listing_sha256\t'
            git ls-tree -r HEAD^1 -- Cargo.lock crates | sha256sum | cut -d' ' -f1
            printf '\n[rustc]\n'
            rustc -Vv
            printf '\n[cargo]\n'
            cargo -V
            printf '\n[valgrind]\n'
            valgrind --version
            printf '\n[uname]\n'
            uname -a
            printf '\n[lscpu]\n'
            lscpu
            printf '\n[os-release]\n'
            cat /etc/os-release
          } > s2-11-profile/provenance.txt

      - name: Build symbolized release profiling harness
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: cargo build --locked --release -p chess-tools --bin performance

      - name: Record harness identity and native smoke
        shell: bash
        run: |
          set -euo pipefail
          sha256sum target/release/performance > s2-11-profile/performance.sha256
          target/release/performance profile-perft | tee s2-11-profile/profile-perft.native.txt
          target/release/performance profile-search | tee s2-11-profile/profile-search.native.txt

      - name: Profile perft
        shell: bash
        run: |
          set -euo pipefail
          valgrind \
            --tool=callgrind \
            --error-exitcode=97 \
            --callgrind-out-file=s2-11-profile/callgrind.perft.out \
            target/release/performance profile-perft \
            > s2-11-profile/profile-perft.callgrind.stdout.txt \
            2> s2-11-profile/profile-perft.callgrind.stderr.txt

      - name: Profile fixed-node search
        shell: bash
        run: |
          set -euo pipefail
          valgrind \
            --tool=callgrind \
            --error-exitcode=97 \
            --callgrind-out-file=s2-11-profile/callgrind.search.out \
            target/release/performance profile-search \
            > s2-11-profile/profile-search.callgrind.stdout.txt \
            2> s2-11-profile/profile-search.callgrind.stderr.txt

      - name: Render profile summaries
        shell: bash
        run: |
          set -euo pipefail
          callgrind_annotate --inclusive=yes --threshold=0.1 s2-11-profile/callgrind.perft.out \
            > s2-11-profile/callgrind.perft.inclusive.txt
          callgrind_annotate --threshold=0.1 s2-11-profile/callgrind.perft.out \
            > s2-11-profile/callgrind.perft.exclusive.txt
          callgrind_annotate --inclusive=yes --threshold=0.1 s2-11-profile/callgrind.search.out \
            > s2-11-profile/callgrind.search.inclusive.txt
          callgrind_annotate --threshold=0.1 s2-11-profile/callgrind.search.out \
            > s2-11-profile/callgrind.search.exclusive.txt
          sha256sum s2-11-profile/* > s2-11-profile/artifact-files.sha256

      - name: Preserve raw and rendered profiling evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-11-callgrind-${{ matrix.arch }}-${{ github.sha }}
          path: s2-11-profile/
          if-no-files-found: error
          retention-days: 30
