name: S2-7 Principal Variation Search validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-7-pvs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    name: Linux x86-64 correctness, strength, and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-s2-7-pvs-x86-64

      - name: Audit S2-7 architecture
        run: bash scripts/task_s2_7_pvs_audit.sh

      - name: Check formatting and strict Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings

      - name: Run search and evidence tests
        run: |
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_7_pvs

      - name: Build release evidence tool
        run: cargo build --locked --release -p chess-tools --bin s2_7_pvs

      - name: Record exact build identity
        shell: bash
        run: |
          set -euo pipefail
          build_identity="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          echo "S2_7_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "S2_7_BUILD_IDENTITY=${build_identity}" >> "$GITHUB_ENV"

      - name: Generate byte-identical deterministic evidence twice
        run: |
          target/release/s2_7_pvs deterministic s2-7-deterministic-a
          target/release/s2_7_pvs deterministic s2-7-deterministic-b
          diff -ru s2-7-deterministic-a s2-7-deterministic-b

      - name: Generate clock development evidence
        run: target/release/s2_7_pvs clock s2-7-clock

      - name: Preserve zero-allocation hot-path gate
        run: cargo run --locked --release -p chess-tools --bin performance -- allocation-audit

      - name: Capture seven-sample x86-64 distribution
        run: target/release/s2_7_pvs benchmark 7 | tee s2-7-linux-x86-64.tsv

      - name: Print exact evidence summaries
        shell: bash
        run: |
          set -euo pipefail
          cat s2-7-deterministic-a/s2-7-deterministic-manifest.tsv
          tail -n 6 s2-7-deterministic-a/s2-7-parity.tsv
          cat s2-7-deterministic-a/s2-7-fixed-node-development.report
          cat s2-7-clock/s2-7-clock-summary.tsv
          cat s2-7-linux-x86-64.tsv

      - name: Preserve x86-64 S2-7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-7-pvs-linux-x86-64-${{ github.sha }}
          path: |
            s2-7-deterministic-a
            s2-7-clock
            s2-7-linux-x86-64.tsv
          if-no-files-found: error
          retention-days: 30

  linux-arm64:
    name: Linux ARM64 correctness and performance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-s2-7-pvs-arm64

      - name: Audit, lint, and test on native ARM64
        run: |
          bash scripts/task_s2_7_pvs_audit.sh
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_7_pvs

      - name: Build release evidence tool
        run: cargo build --locked --release -p chess-tools --bin s2_7_pvs

      - name: Record exact build identity
        shell: bash
        run: |
          set -euo pipefail
          build_identity="$(rustc -Vv | paste -sd '|' - | tr ' ' '_')"
          echo "S2_7_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "S2_7_BUILD_IDENTITY=${build_identity}" >> "$GITHUB_ENV"

      - name: Generate native ARM64 deterministic evidence
        run: target/release/s2_7_pvs deterministic s2-7-deterministic-arm64

      - name: Preserve ARM64 zero-allocation hot-path gate
        run: cargo run --locked --release -p chess-tools --bin performance -- allocation-audit

      - name: Capture seven-sample ARM64 distribution
        run: target/release/s2_7_pvs benchmark 7 | tee s2-7-linux-arm64.tsv

      - name: Print native ARM64 evidence summaries
        shell: bash
        run: |
          set -euo pipefail
          cat s2-7-deterministic-arm64/s2-7-deterministic-manifest.tsv
          tail -n 6 s2-7-deterministic-arm64/s2-7-parity.tsv
          cat s2-7-linux-arm64.tsv

      - name: Preserve ARM64 S2-7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-7-pvs-linux-arm64-${{ github.sha }}
          path: |
            s2-7-deterministic-arm64
            s2-7-linux-arm64.tsv
          if-no-files-found: error
          retention-days: 30
