name: Python CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python-quality:
    if: >-
      github.event_name != 'push' ||
      github.event.head_commit.message != 'ci: arm Python Ruff repair'
    name: Python 3.11 quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_ISSUE: "261"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lint,test]'

      - name: Ruff
        shell: bash
        run: |
          set +e
          python -m ruff check chess_game tests >"${RUNNER_TEMP}/ruff.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/ruff.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Python Ruff failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 220 "${RUNNER_TEMP}/ruff.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

      - name: MyPy
        shell: bash
        run: |
          set +e
          python -m mypy chess_game >"${RUNNER_TEMP}/mypy.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/mypy.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Python MyPy failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 220 "${RUNNER_TEMP}/mypy.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

      - name: Pylint
        shell: bash
        run: |
          set +e
          python -m pylint chess_game >"${RUNNER_TEMP}/pylint.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/pylint.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Python Pylint failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 220 "${RUNNER_TEMP}/pylint.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

      - name: Run all tests
        shell: bash
        run: |
          set +e
          python -m pytest tests -q >"${RUNNER_TEMP}/pytest.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/pytest.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Complete Python test failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 220 "${RUNNER_TEMP}/pytest.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

  safe-ruff-repair:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci: arm Python Ruff repair'
    name: Apply safe Ruff fixes on master
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lint]'

      - name: Apply all safe Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix --exit-zero chess_game tests
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chess_game tests
          if git diff --cached --quiet; then
            echo 'Ruff produced no source changes.' >&2
            exit 1
          fi
          git commit -m 'style(python): apply safe Ruff fixes'
          git push origin HEAD:master
