name: Python CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python-quality:
    if: github.event_name != 'issues'
    name: Python 3.11 quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_ISSUE: "261"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lint,test]'

      - name: Ruff
        shell: bash
        run: |
          set +e
          python -m ruff check chess_game tests >"${RUNNER_TEMP}/ruff.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/ruff.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Python Ruff failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 180 "${RUNNER_TEMP}/ruff.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

      - name: MyPy
        shell: bash
        run: |
          set +e
          python -m mypy chess_game >"${RUNNER_TEMP}/mypy.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/mypy.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Python MyPy failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 180 "${RUNNER_TEMP}/mypy.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

      - name: Pylint
        shell: bash
        run: |
          set +e
          python -m pylint chess_game >"${RUNNER_TEMP}/pylint.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/pylint.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Python Pylint failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 180 "${RUNNER_TEMP}/pylint.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

      - name: Run all tests
        shell: bash
        run: |
          set +e
          python -m pytest tests -q >"${RUNNER_TEMP}/pytest.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/pytest.log"
          if [[ ${status} -ne 0 ]]; then
            {
              printf '### Complete Python test failure\n\n- Head SHA: `%s`\n- Run: %s/%s/actions/runs/%s\n\n```text\n' \
                "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              tail -n 180 "${RUNNER_TEMP}/pytest.log"
              printf '\n```\n'
            } >"${RUNNER_TEMP}/failure.md"
            gh issue comment "${VALIDATION_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/failure.md"
            exit "${status}"
          fi

  fix-import-order:
    if: >-
      github.event_name == 'issues' &&
      github.actor == 'ekkus93' &&
      github.event.issue.title == '[fix-python-import-order-on-master]'
    name: Fix Python import order on master
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lint]'

      - name: Apply Ruff import ordering and push master
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix --select I chess_game tests
          python -m ruff check chess_game tests

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chess_game tests
          git diff --cached --check

          if git diff --cached --quiet; then
            gh issue comment "${TRIGGER_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body 'Ruff reported no import-order changes to commit.'
          else
            git commit -m 'style(python): normalize import ordering'
            git push origin HEAD:master
            repair_sha="$(git rev-parse HEAD)"
            gh issue comment "${TRIGGER_ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body "Ruff import ordering was repaired directly on master at ${repair_sha}."
          fi

          gh issue close "${TRIGGER_ISSUE}" --repo "${GITHUB_REPOSITORY}" --reason completed
