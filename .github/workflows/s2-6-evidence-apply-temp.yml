name: S2-6 evidence apply temporary
# witness-revision: 4

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-6-evidence-apply-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-6-evidence-apply-temporary
  cancel-in-progress: true

jobs:
  apply:
    name: Apply and validate S2-6 evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm candidate ancestry and patch syntax
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e778864e470fb967d215c0dc08fb864222802619 HEAD
          test -f scripts/s2_6_evidence_apply.py
          test -f scripts/s2_6_evidence_refine.py
          python3 -m py_compile scripts/s2_6_evidence_apply.py scripts/s2_6_evidence_refine.py

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply permanent evidence source
        run: |
          set -euo pipefail
          python3 scripts/s2_6_evidence_refine.py
          python3 scripts/s2_6_evidence_apply.py
          rm scripts/s2_6_evidence_apply.py scripts/s2_6_evidence_refine.py
          cargo fmt --all
          git diff --check

      - name: Validate code and tests
        run: |
          set -euo pipefail
          cargo check --locked -p chess-search -p chess-tools --all-targets --all-features
          cargo clippy --locked -p chess-search -p chess-tools --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-targets --all-features
          cargo test --locked -p chess-tools --bin s2_6_quiescence

      - name: Build release evidence binary
        run: cargo build --locked --release -p chess-tools --bin s2_6_quiescence

      - name: Record exact source and build identity
        shell: bash
        run: |
          set -euo pipefail
          echo "S2_6_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "S2_6_BUILD_IDENTITY=$(rustc -Vv | paste -sd '|' - | tr ' ' '_')" >> "$GITHUB_ENV"

      - name: Generate first deterministic evidence set
        run: target/release/s2_6_quiescence deterministic /tmp/s2-6-deterministic-a

      - name: Generate second deterministic evidence set
        run: target/release/s2_6_quiescence deterministic /tmp/s2-6-deterministic-b

      - name: Verify byte-identical deterministic evidence
        run: diff -ru /tmp/s2-6-deterministic-a /tmp/s2-6-deterministic-b

      - name: Generate clock development evidence
        run: target/release/s2_6_quiescence clock /tmp/s2-6-clock

      - name: Capture preliminary performance and allocation evidence
        run: target/release/s2_6_quiescence benchmark 3

      - name: Preserve designated zero-allocation hot-path gate
        run: cargo run --locked --release -p chess-tools --bin performance -- allocation-audit

      - name: Commit validated non-workflow evidence
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add -A
          git commit -m "test(search): add permanent S2-6 quiescence evidence"
          git push origin HEAD:master
