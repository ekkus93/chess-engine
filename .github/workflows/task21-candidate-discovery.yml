name: Remove Task 21 discovery workflow

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task21-candidate-discovery.yml

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary discovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/task21-candidate-discovery.yml
          git commit -m 'chore: remove Task 21 discovery workflow'
          git push origin HEAD:master
