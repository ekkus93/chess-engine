          - Reproduction and permanent counterexample-preservation policy is documented in `docs/RUST_PROPERTY_TESTING.md`.
          - Implementation head: `4483c1661a975bc9f64c1f725618930e31968e74`.
          - Rust run/job: `30940733222` / `92098127153`.
          - Android run/jobs: `30940732968` / `92098189450`, `92098189412`, `92098189386`.
          - All permanent Rust and Android gates passed. Task 23 remains open for fuzzing, runtime analysis, and formal failure-corpus preservation.
          '''
          if old not in text:
              raise SystemExit("Task 23 summary block not found")
          text = text.replace(old, new, 1)
          old = '''1. Begin Task 23.1 property tests, starting with square/move/FEN round-trips, make/unmake restoration, hash equality, legal-move safety, evaluator symmetry, and legal PV sequences.
          2. Add Task 23.2 parser/state fuzz targets and preserve every minimized failure as a permanent regression input.
          3. Establish the Task 23.3 Miri/sanitizer/FFI lifecycle subset without weakening existing correctness gates.
          4. Independently, produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep the Task 21 gate open until a candidate passes and is explicitly activated.
          '''
          new = '''1. Add Task 23.2 FEN, UCI-move, legal-sequence/unmake, repetition/history, weight, opening-book, and C-ABI fuzz targets.
          2. Preserve every minimized Task 23.2 failure under a documented corpus path as a named permanent regression before fixing it.
          3. Establish the Task 23.3 Miri/sanitizer/FFI lifecycle subset without weakening existing correctness gates.
          4. Independently, produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep the Task 21 gate open until a candidate passes and is explicitly activated.
          '''
          if old not in text:
              raise SystemExit("Immediate operations block not found")
          summary.write_text(text.replace(old, new, 1))

          status = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          text = status.read_text()
          old_phase = "**Current phase:** Task 22 evidence protocol complete; Task 23 robustness gates are next while the independent Task 21 activation gate remains open"
          new_phase = "**Current phase:** Task 23.1 deterministic property testing complete; Task 23.2 fuzzing is next while the independent Task 21 activation gate remains open"
          if old_phase not in text:
              raise SystemExit("Ralph phase text not found")
          text = text.replace(old_phase, new_phase, 1)
          row = '| 22 / gate | `3653f86148dca0bb7f4168706ffc47a28bc4a10e` | `30938602274` / `92090934559` | eight-area protocol, symmetry/cost/search/match evidence, explicit rejection decisions, checksum `0ad7dcc3dda4cdfb`, no activation |\n'
          new_row = row + '| 23.1 | `4483c1661a975bc9f64c1f725618930e31968e74` | Rust `30940733222` / `92098127153`; Android `30940732968` / `92098189450`, `92098189412`, `92098189386` | deterministic legal-position properties cover square/move/FEN, make/unmake, hash, legal-move safety, internal invariants, evaluator symmetry, and legal reversible PVs; all permanent gates green |\n'
          if row not in text:
              raise SystemExit("Task 22 Ralph row not found")
          text = text.replace(row, new_row, 1)
          completion = '''

          ## Task 23.1 completion

          Implemented and validated:

          - exhaustive square index/coordinate/algebraic round trips across all 64 squares;
          - exhaustive packed-move source, destination, kind, and promotion preservation;
          - deterministic legal-position generation from six real roots with four fixed seeds and up to 48 plies;
