name: Task 19.2 Rustfmt

on:
  push:
    branches:
      - task19-2-opening-book-format
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task19-2-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task19-2-opening-book-format
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical formatting
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/task19-2-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-book/src/indexed.rs crates/chess-book/src/lib.rs
          git diff --cached --check
          git commit -m "style: format Task 19.2"
          git push origin HEAD:task19-2-opening-book-format
