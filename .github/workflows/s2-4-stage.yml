name: S2-4 evidence staging

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-4-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-4-evidence-staging
  cancel-in-progress: false

jobs:
  stage:
    name: Validate and commit SEE evidence assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-s2-4-evidence

      - name: Prepare the temporary evidence helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/s2_4_evidence_stage.py")
          text = path.read_text(encoding="utf-8")
          fmt_witness = 'run("cargo", "fmt", "--manifest-path", "fuzz/Cargo.toml", "--", "--check")'
          fmt_replacement = '\n'.join([
              'run("cargo", "fmt", "--manifest-path", "fuzz/Cargo.toml")',
              fmt_witness,
          ])
          if text.count(fmt_witness) != 1:
              raise SystemExit("fuzz formatting witness changed")
          text = text.replace(fmt_witness, fmt_replacement)

          commit_witness = 'Path(__file__).unlink()'
          commit_replacement = '\n'.join([
              'run("git", "checkout", "--", ".github/workflows/robustness.yml")',
              commit_witness,
          ])
          if text.count(commit_witness) != 1:
              raise SystemExit("evidence commit witness changed")
          path.write_text(text.replace(commit_witness, commit_replacement), encoding="utf-8")
          PY

      - name: Apply, validate, and commit SEE evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/s2_4_evidence_stage.py

      # Temporary staging workflow; replaced by read-only validation after commit.
