name: S2-4 evidence staging

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-4-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-4-evidence-staging
  cancel-in-progress: false

jobs:
  stage:
    name: Validate and commit SEE evidence assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-engine-s2-4-evidence

      - name: Format the separate fuzz workspace before checking it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/s2_4_evidence_stage.py")
          text = path.read_text(encoding="utf-8")
          witness = 'run("cargo", "fmt", "--manifest-path", "fuzz/Cargo.toml", "--", "--check")'
          replacement = '\n'.join([
              'run("cargo", "fmt", "--manifest-path", "fuzz/Cargo.toml")',
              witness,
          ])
          if text.count(witness) != 1:
              raise SystemExit("fuzz formatting witness changed")
          path.write_text(text.replace(witness, replacement), encoding="utf-8")
          PY

      - name: Apply, validate, and commit SEE evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/s2_4_evidence_stage.py

      # Temporary staging workflow; replaced by read-only validation after commit.
