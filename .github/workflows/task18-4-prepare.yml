name: Task 18.4 Prepare

on:
  push:
    branches:
      - task18-4-android-jni
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task18-4-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task18-4-android-jni
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/task18_4_prepare.py
          cargo generate-lockfile
          cargo fmt --all
          chmod +x scripts/build_android_jni.sh
          git update-index --chmod=+x scripts/build_android_jni.sh
          git rm .github/workflows/task18-4-prepare.yml scripts/task18_4_prepare.py

      - name: Commit normalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/chess-jni docs/RUST_ANDROID_JNI.md scripts/build_android_jni.sh
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          allowed='^(Cargo.lock|crates/chess-jni/|docs/RUST_ANDROID_JNI.md|scripts/build_android_jni.sh|.github/workflows/task18-4-prepare.yml|scripts/task18_4_prepare.py)'
          for path in "${changed[@]}"; do
            if [[ ! "${path}" =~ ${allowed} ]]; then
              echo "unexpected staged path: ${path}" >&2
              exit 1
            fi
          done
          git commit -m "jni: normalize Task 18.4 implementation"
          git push origin HEAD:task18-4-android-jni
