name: Android Second Corrections Close Resume

on:
  push:
    branches:
      - master
    paths:
      - .github/android_second_corrections_close_resume.py
      - .github/workflows/android-second-corrections-close-resume.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    name: Resume validated second-corrections closure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resume validation and create repository closure tree
        run: python3 .github/android_second_corrections_close_resume.py
