name: Task 17.2 preflight

on:
  push:
    branches:
      - rust-engine

permissions:
  contents: write

concurrency:
  group: task17-2-preflight-rust-engine
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Skip evidence commit
        id: guard
        shell: bash
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "ci: record Task 17.2 preflight" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wire worker into protocol loop
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/chess-uci/src/lib.rs")
          text = path.read_text()

          text = text.replace(
              """//! Task 17.1 deliberately stops at the protocol boundary. It parses complete
//! UCI commands, owns transactional game state, and emits typed search requests.
//! Task 17.2 will consume those requests on an adapter-owned worker thread.

use std::io::{self, BufRead, Write};
""",
              """//! The protocol thread owns parsing and mutable session state. Task 17.2 adds
//! one adapter-owned search-worker slot with request-local cancellation and
//! deterministic stop-and-join behavior for replacement and shutdown.

mod worker;

use std::io::{self, BufRead, Write};
""",
              1,
          )

          export_marker = "use chess_search::DEFAULT_TRANSPOSITION_TABLE_MEBIBYTES;\n"
          exports = """use chess_search::DEFAULT_TRANSPOSITION_TABLE_MEBIBYTES;

pub use worker::{SearchWorker, SearchWorkerError, SearchWorkerSlot};
"""
          if export_marker not in text:
              raise SystemExit("search import marker not found")
          text = text.replace(export_marker, exports, 1)

          event_marker = """    /// Start a search from an immutable session snapshot.
    StartSearch(Box<SearchRequest>),
    /// Stop the current worker search, when one exists.
"""
          event_replacement = """    /// Start a search from an immutable session snapshot.
    StartSearch(Box<SearchRequest>),
    /// The live session game was transactionally replaced.
    GameStateChanged,
    /// Stop the current worker search, when one exists.
"""
          if event_marker not in text:
              raise SystemExit("UciEvent marker not found")
          text = text.replace(event_marker, event_replacement, 1)

          new_game_old = """            "ucinewgame" => {
                self.game.reset_to_starting();
                UciResponse::default()
            }
"""
          new_game_new = """            "ucinewgame" => {
                self.game.reset_to_starting();
                UciResponse::with_event(UciEvent::GameStateChanged)
            }
"""
          if new_game_old not in text:
              raise SystemExit("ucinewgame block not found")
          text = text.replace(new_game_old, new_game_new, 1)

          position_old = """            Ok(game) => {
                self.game = game;
                UciResponse::default()
            }
"""
          position_new = """            Ok(game) => {
                self.game = game;
                UciResponse::with_event(UciEvent::GameStateChanged)
            }
"""
          if position_old not in text:
              raise SystemExit("position-success block not found")
          text = text.replace(position_old, position_new, 1)

          start = text.index("/// Runs the Task 17.1 protocol loop")
          end = text.index("/// Runs the Linux stdin/stdout UCI process adapter.", start)
          loop = r'''/// Runs the protocol loop over arbitrary buffered input and output.
///
/// The protocol thread remains responsive while one adapter-owned worker runs.
/// Search-result formatting remains Task 17.4; this boundary reports only typed
/// worker failures and otherwise retains completed results for lifecycle control.
pub fn run_protocol_loop<R, W>(input: R, mut output: W) -> io::Result<()>
where
    R: BufRead,
    W: Write,
{
    let mut session = UciSession::new();
    let mut workers = SearchWorkerSlot::new();

    for line in input.lines() {
        if let Some(outcome) = workers.reap_finished() {
            report_worker_outcome(&mut output, outcome)?;
        }

        let response = session.handle_line(&line?);
        for current in response.lines {
            writeln!(output, "{current}")?;
        }

        match response.event {
            Some(UciEvent::StartSearch(request)) => {
                if let Err(error) = workers.start(*request) {
                    report_worker_error(&mut output, &error)?;
                }
            }
            Some(UciEvent::StopSearch | UciEvent::GameStateChanged) => {
                if let Err(error) = workers.stop() {
                    report_worker_error(&mut output, &error)?;
                }
            }
            Some(UciEvent::Quit) => {
                if let Err(error) = workers.shutdown() {
                    report_worker_error(&mut output, &error)?;
                }
                output.flush()?;
                return Ok(());
            }
            None => {}
        }
        output.flush()?;
    }

    if let Err(error) = workers.shutdown() {
        report_worker_error(&mut output, &error)?;
    }
    output.flush()
}

fn report_worker_outcome<W>(
    output: &mut W,
    outcome: Result<chess_search::SearchResult, SearchWorkerError>,
) -> io::Result<()>
where
    W: Write,
{
    if let Err(error) = outcome {
        report_worker_error(output, &error)?;
    }
    Ok(())
}

fn report_worker_error<W>(output: &mut W, error: &SearchWorkerError) -> io::Result<()>
where
    W: Write,
{
    writeln!(output, "info string error: {error}")
}

'''
          path.write_text(text[:start] + loop + text[end:])
          PY
          cargo fmt --all

      - name: Run bounded validation
        if: steps.guard.outputs.skip != 'true'
        id: validate
        shell: bash
        run: |
          set +e
          log=docs/TASK17_2_PREFLIGHT.log
          : > "$log"
          status=0
          run_check() {
            echo "$ $*" | tee -a "$log"
            "$@" >> "$log" 2>&1
            rc=$?
            echo "exit=$rc" | tee -a "$log"
            if [[ $rc -ne 0 && $status -eq 0 ]]; then status=$rc; fi
          }
          run_check cargo fmt --all -- --check
          run_check cargo check --locked --workspace --all-targets --all-features
          run_check cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          run_check cargo test --locked -p chess-uci
          run_check cargo test --locked --workspace --all-features
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit source and evidence
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/chess-uci/src/lib.rs \
            crates/chess-uci/src/worker.rs \
            docs/RUST_UCI_SEARCH_WORKER.md \
            docs/TASK17_2_PREFLIGHT.log
          git diff --cached --check
          git commit -m "ci: record Task 17.2 preflight"
          git push origin HEAD:rust-engine

      - name: Fail when validation failed
        if: steps.guard.outputs.skip != 'true' && steps.validate.outputs.status != '0'
        run: exit 1
