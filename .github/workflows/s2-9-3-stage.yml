name: S2-9.3 null-move policy finalization

# Temporary finalizer; repository workflow files are installed separately.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-9-3-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-9-3-finalize-master
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate permanent evidence and cleanup
        run: python3 .github/s2_9_3_finalize.py

      - name: Validate permanent repository boundary
        run: |
          set -euo pipefail
          bash scripts/task_s2_9_null_move_feasibility_audit.sh
          bash scripts/task_s2_9_search_null_transition_audit.sh
          bash scripts/task_s2_9_null_move_policy_audit.sh
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-core -p chess-search --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --lib --all-features

      - name: Publish non-workflow evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts
          git add -u .github/s2_9_3_policy.py .github/s2_9_3_finalize.py
          git diff --cached --check
          git commit -m 'docs: record S2-9.3 null-move policy evidence'
          git push origin HEAD:master
