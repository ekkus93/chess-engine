name: S2-9.3 null-move policy finalization

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-9-3-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s2-9-3-finalize-master
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate permanent evidence and remove staging files
        env:
          CORE_SHA: 029c16ed216a0fc84d6772c10ea8678ad202c6cf
        run: |
          set -euo pipefail
          python3 .github/s2_9_3_policy.py phase2
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/task_s2_9_null_move_feasibility_audit.sh')
          text = path.read_text(encoding='utf-8')

          old_status = "grep -Fq '| S2-9 | Optional null-move pruning decision/candidate | **In progress — search-null transition complete; pruning policy not started** |' \"$tracker\" || fail \"summary status is not advanced\""
          new_status = "grep -Fq '| S2-9 | Optional null-move pruning decision/candidate | **In progress — conservative policy complete; validation/disposition not started** |' \"$tracker\" || fail \"summary status is not advanced through S2-9.3\""
          if text.count(old_status) != 1:
              raise SystemExit('feasibility summary assertion shape changed unexpectedly')
          text = text.replace(old_status, new_status, 1)

          old_next = "grep -Fq 'Begin with **S2-9.3 only**:' \"$tracker\" || fail \"next action does not point to S2-9.2\""
          new_next = "grep -Fq 'Begin with **S2-9.4 only**:' \"$tracker\" || fail \"next action does not point to S2-9.4\""
          if text.count(old_next) != 1:
              raise SystemExit('feasibility next-action assertion shape changed unexpectedly')
          text = text.replace(old_next, new_next, 1)

          old_boundary = """if grep -R --line-number -E 'make_search_null|unmake_search_null|null_move_pruning_enabled' \\
  crates/chess-search/src; then
  fail \"null pruning integration landed before S2-9.3\"
fi
"""
          new_boundary = """grep -Fq 'position.make_search_null()' \"$search\" || fail \"S2-9.3 search-null integration is missing\"
grep -Fq 'position.unmake_search_null(undo)' \"$search\" || fail \"S2-9.3 search-null restoration is missing\"
grep -Fq 'null_move_pruning_enabled' \"$search\" || fail \"S2-9.3 policy gate is missing\"
"""
          if text.count(old_boundary) != 1:
              raise SystemExit('feasibility pre-S2-9.3 boundary shape changed unexpectedly')
          text = text.replace(old_boundary, new_boundary, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate permanent repository boundary
        run: |
          set -euo pipefail
          bash scripts/task_s2_9_null_move_feasibility_audit.sh
          bash scripts/task_s2_9_search_null_transition_audit.sh
          bash scripts/task_s2_9_null_move_policy_audit.sh
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-core -p chess-search --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --lib --all-features

      - name: Publish documentation, audit, and permanent read-only CI
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: record S2-9.3 null-move policy evidence'
          git push origin HEAD:master
