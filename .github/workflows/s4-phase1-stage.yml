name: S4 Phase 1 Diagnostics Stage

on:
  push:
    branches: [master]
    paths:
      - .github/s4_phase1.py
      - .github/s4_phase1_repair.py
      - .github/workflows/s4-phase1-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s4-phase1-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Repair staging helper
        run: python3 .github/s4_phase1_repair.py
      - name: Apply diagnostics patch
        run: python3 .github/s4_phase1.py
      - name: Format staged source
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --locked -p chess-tune --all-targets --all-features -- -D warnings
      - name: Run optimizer regressions
        run: cargo test --locked -p chess-tune optimizer -- --nocapture
      - name: Verify targeted audit syntax
        run: bash -n scripts/task_s3_evaluation_strength_audit.sh
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phillip Chin"
          git config user.email "ekkus93@gmail.com"
          git add crates/chess-tune/src/lib.rs crates/chess-tune/src/optimizer.rs crates/chess-tune/src/diagnostics.rs scripts/task_s3_evaluation_strength_audit.sh
          git commit -m "feat: instrument S4 SPSA transitions"
          git push origin HEAD:master
