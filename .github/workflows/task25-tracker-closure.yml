name: Task 25 tracker closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/task25-tracker-closure.yml

permissions:
  contents: write

concurrency:
  group: task25-tracker-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply validated Task 25 evidence
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/task25-tracker-closure.patch
          git apply scripts/task25-tracker-closure.patch
          git diff --check
          grep -F '# Task 25: CI, documentation, and workflows — COMPLETE' docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md
          grep -F '**Current phase:** Task 25 developer-workflow gate complete' docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md
          grep -F 'Rust port Task 25 developer-workflow gate complete' memory.md

      - name: Commit tracker closure directly to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            memory.md
          git commit -m 'docs: close Task 25 developer workflows'
          git push origin HEAD:master
