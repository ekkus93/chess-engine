name: Task 10 test deduplication once

on:
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task10-deduplicate-tests-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove exactly one duplicate test block
        shell: bash
        run: |
          set -euo pipefail
          # This workflow is intentionally fail-closed and single-purpose.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/chess-core/src/game.rs")
          text = path.read_text()
          block = '''    #[test]
          fn illegal_game_move_does_not_change_position_or_history() {
              let mut game = Game::starting();
              let snapshot = game.clone();
              let illegal = crate::Move::new(
                  "e2".parse().expect("test square is valid"),
                  "e5".parse().expect("test square is valid"),
                  crate::MoveKind::Quiet,
              );

              assert!(matches!(game.make_move(illegal), Err(GameError::Rules(_))));
              assert_eq!(game, snapshot);
          }

          #[test]
          fn repetition_count_respects_the_irreversible_halfmove_boundary() {
              let current = position("8/8/8/8/8/8/R3K3/7k w - - 2 1");
              let hash = current.zobrist();
              let history = crate::SearchHistory {
                  hashes: vec![hash, hash, hash ^ 1, hash],
                  root_len: 4,
              };

              assert_eq!(history.repetition_count(&current), 2);
          }

          '''
          if text.count(block) != 2:
              raise SystemExit(f"expected two duplicate blocks, found {text.count(block)}")
          doubled = block + block
          if text.count(doubled) != 1:
              raise SystemExit(f"expected one adjacent doubled block, found {text.count(doubled)}")
          path.write_text(text.replace(doubled, block))
          PY
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/chess-core/src/game.rs
          git commit -m "test(core): deduplicate Task 10 history coverage"
          git push origin HEAD:rust-engine
