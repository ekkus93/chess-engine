name: Task 14.1 Apply

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.title == '[task14-apply-now]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out control files
        uses: actions/checkout@v4
        with:
          ref: master
          path: control

      - name: Check out rust-engine
        uses: actions/checkout@v4
        with:
          ref: rust-engine
          path: target

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply narrowing patch
        working-directory: target
        run: |
          set -euo pipefail
          python ../control/.github/apply_task_14_1.py .
          cargo fmt --all

      - name: Commit and push
        id: commit
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound Task 14.1 reference oracle scope'
          git push origin HEAD:rust-engine
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Report success
        if: success()
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="Applied Task 14.1 narrowing and permanent CI restoration at ${SHA}."
          gh api --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -f state=closed \
            -f state_reason=completed

      - name: Report failure
        if: failure()
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body='Task 14.1 narrowing workflow failed; inspect the workflow log before retrying.'
