name: Temporary S2-8 LMR core bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-8-core-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-8-lmr-core
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply S2-8 core implementation
        run: python3 .github/s2_8_core_bootstrap.py

      - name: Validate architecture formatting lint and behavior
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/task_s2_8_lmr_audit.sh
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings
          cargo test --locked -p chess-search --all-targets --all-features

      - name: Commit validated core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add inactive verified LMR candidate"
          git push origin HEAD:master
