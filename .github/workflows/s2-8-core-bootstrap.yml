name: Temporary S2-8 LMR core bootstrap

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/s2-8-core-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-s2-8-lmr-core
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply S2-8 core implementation
        run: |
          python3 .github/s2_8_core_bootstrap_repair.py
          python3 .github/s2_8_core_bootstrap.py

      - name: Audit and format generated implementation
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/task_s2_8_lmr_audit.sh
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked -p chess-search --all-targets --all-features -- -D warnings

      - name: Test LMR identity and parameters
        run: cargo test --locked -p chess-search --test s2_8_lmr candidate_identity_and_parameters_are_explicit_and_inactive_by_default -- --exact

      - name: Test LMR tactical and endgame fixtures
        run: timeout 10m cargo test --locked -p chess-search --test s2_8_lmr candidate_preserves_tactical_mate_promotion_and_endgame_fixtures -- --exact

      - name: Test LMR reduction and verification accounting
        run: timeout 10m cargo test --locked -p chess-search --test s2_8_lmr candidate_reduces_only_late_moves_and_verifies_every_reduced_alpha_raise -- --exact

      - name: Test LMR cancellation and restoration
        run: timeout 10m cargo test --locked -p chess-search --test s2_8_lmr node_limited_cancellation_restores_state_and_keeps_only_completed_iterations -- --exact

      - name: Test LMR unit policies and diagnostics
        run: |
          cargo test --locked -p chess-search --lib lmr_policy_tests
          cargo test --locked -p chess-search --lib diagnostics::tests::lmr_events_distinguish_reduction_fail_high_and_verification
          cargo test --locked -p chess-search --lib search_policy::tests::s2_8_lmr_candidate_is_distinct_valid_and_inactive_by_default

      - name: Run complete chess-search suite
        run: timeout 20m cargo test --locked -p chess-search --all-targets --all-features

      - name: Commit validated core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add inactive verified LMR candidate"
          git push origin HEAD:master
