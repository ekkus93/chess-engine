name: Robustness

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-robustness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close-task23:
    name: Close Task 23 trackers
    if: github.event_name == 'pull_request' && github.head_ref == 'rust-engine'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0

      - name: Record Task 23 completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path

          implementation_head = "469c9c67ab53c276509fc7bad0c4adc209c815b7"
          rust_evidence = "30944118025 / 92109744577"
          android_evidence = "30944117802 / 92109760102, 92109760118, 92109760076"
          robustness_evidence = "30944117733 / 92109744098, 92109744189, 92109744065"

          definitions = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md")
          text = definitions.read_text()
          old = '''## 23.2 Fuzz targets

          - [ ] FEN parser;
          - [ ] UCI move parser;
          - [ ] random legal sequence plus reverse unmake;
          - [ ] game-history/repetition transitions;
          - [ ] weight parser;
          - [ ] opening-book parser;
          - [ ] C ABI buffers and handles.

          ## 23.3 Runtime analysis

          - [ ] Miri-compatible core test subset.
          - [ ] Address sanitizer where supported.
          - [ ] Undefined-behavior sanitizer where supported.
          - [ ] Leak checks for FFI/JNI lifecycle harness.
          - [ ] Thread sanitizer if multi-threaded adapter code warrants it.

          ## 23.4 Failure preservation

          - [ ] Every crash or mismatch gets a minimized seed/input.
          - [ ] Add regression before closing the defect.
          - [ ] Store corpus inputs under a documented path.

          **Task 23 gate:** Core parsers/state transitions survive fuzz smoke gates, FFI lifecycle has no known leak/UB, and all minimized failures are permanent regressions.
          '''
          new = f'''## 23.2 Fuzz targets

          - [x] FEN parser;
          - [x] UCI move parser;
          - [x] random legal sequence plus reverse unmake;
          - [x] game-history/repetition transitions;
          - [x] weight parser;
          - [x] opening-book parser;
          - [x] C ABI buffers and handles.

          ## 23.3 Runtime analysis

          - [x] Miri-compatible core test subset.
          - [x] Address sanitizer where supported.
          - [x] Undefined-behavior sanitizer where supported.
          - [x] Leak checks for FFI/JNI lifecycle harness.
          - [x] Thread sanitizer if multi-threaded adapter code warrants it.

          ## 23.4 Failure preservation

          - [x] Every crash or mismatch gets a minimized seed/input.
          - [x] Add regression before closing the defect.
          - [x] Store corpus inputs under a documented path.

          ### Task 23.2–23.4 completion evidence

          - Independent mutation workspace: `fuzz/`, with a committed lockfile, seven reusable entrypoints, seven thin libFuzzer targets, deterministic seed corpora, stable entrypoint tests, and committed corpus replay.
          - The permanent `Robustness` workflow runs 256 bounded mutations for each target: FEN, UCI move, legal sequence/reverse-unmake, game history/repetition, named weight artifacts, indexed opening books, and C ABI buffers/handles; total bounded campaign: 1,792 runs.
          - `crates/chess-core/tests/miri_core.rs` passes under pinned Miri with strict provenance.
          - The complete native C ABI lifecycle suite passes AddressSanitizer with leak detection. The concurrent cancellation path passes ThreadSanitizer.
          - Rust nightly exposes no general `undefined` sanitizer mode for this workspace; that unsupported boundary is checked in CI and Miri is the authoritative undefined-behavior gate rather than recording a fictitious UBSan pass.
          - Host-JVM JNI lifecycle, dual-ABI Android packaging, and API-35 instrumentation remain mandatory permanent gates alongside the native leak/UB analysis.
          - Fuzzing found the minimized one-byte input `fuzz/regressions/c_abi_buffers_handles/forged-buffer-wrong-token-type.bin` (`0x28`). It exposed a semantic result-code mismatch: a fabricated buffer token was classified as `InvalidHandle` instead of the documented `InvalidBuffer`.
          - Named stable replay: `fuzz/tests/regression_c_abi.rs::forged_buffer_with_wrong_token_type_is_rejected_as_invalid_buffer`.
          - Production correction: `crates/chess-ffi/src/c_abi/registry.rs` now classifies wrong-tag output allocation tokens as `InvalidBuffer` before registry lookup. The minimized input remains permanent.
          - Robustness contract: `docs/RUST_ROBUSTNESS_GATES.md`.
          - Helper-free implementation head: `{implementation_head}`.
          - Permanent robustness run/jobs: `{robustness_evidence}`.
          - Permanent Rust run/job: `{rust_evidence}`.
          - Permanent Android run/jobs: `{android_evidence}`.

          **Task 23 gate:** Core parsers/state transitions survive fuzz smoke gates, FFI lifecycle has no known leak/UB, and all minimized failures are permanent regressions. **COMPLETE.**
          '''
          if old not in text:
              raise SystemExit("Task 23.2-23.4 definition block not found")
          definitions.write_text(text.replace(old, new, 1).rstrip() + "\n")

          summary = Path("docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md")
          text = summary.read_text()
          old = '''# Task 23: Robustness gates — PARTIAL
          - [x] 23.1 Properties.
          - [ ] 23.2 Fuzzing.
          - [ ] 23.3 Runtime analysis.
          - [ ] 23.4 Failure preservation.
          - [ ] Task 23 gate.

          ### Task 23.1 completion evidence

          - Added deterministic legal-position property harnesses in `crates/chess-core/tests/property_invariants.rs` and `crates/chess-search/tests/property_search.rs`.
          - Covered all 64 square conversions, every packed move field combination, FEN stability, exact make/unmake restoration, incremental/full hash equality, generated legal-move acceptance, king safety, internal invariants, exact evaluator mirror symmetry, and legal reversible principal variations.
          - Six curated legal roots × four fixed seeds exercise up to 48 plies in core; 24 generated legal positions exercise depth-two search/PV properties.
          - Reproduction and permanent counterexample-preservation policy is documented in `docs/RUST_PROPERTY_TESTING.md`.
          - Implementation head: `4483c1661a975bc9f64c1f725618930e31968e74`.
          - Rust run/job: `30940733222` / `92098127153`.
          - Android run/jobs: `30940732968` / `92098189450`, `92098189412`, `92098189386`.
          - All permanent Rust and Android gates passed. Task 23 remains open for fuzzing, runtime analysis, and formal failure-corpus preservation.
          '''
          new = f'''# Task 23: Robustness gates — COMPLETE
          - [x] 23.1 Properties.
          - [x] 23.2 Fuzzing.
          - [x] 23.3 Runtime analysis.
          - [x] 23.4 Failure preservation.
          - [x] Task 23 gate.

          ### Task 23 completion evidence

          - Deterministic properties cover square/move/FEN round trips, legal generation, exact make/unmake, hash identity, internal invariants, evaluator symmetry, and legal reversible PVs.
          - Independent `fuzz/` workspace covers seven production boundaries with stable tests, committed corpus replay, and 1,792 bounded libFuzzer runs per permanent CI execution.
          - Pinned Miri strict-provenance tests, full C ABI ASan/LeakSanitizer lifecycle analysis, and TSan concurrent-cancellation analysis passed. Unsupported general Rust UBSan is recorded explicitly; Miri is the UB gate.
          - Minimized permanent regression `fuzz/regressions/c_abi_buffers_handles/forged-buffer-wrong-token-type.bin` found and fixed fabricated-buffer result-code classification while remaining committed with a named stable replay.
          - Contract: `docs/RUST_ROBUSTNESS_GATES.md`.
          - Helper-free implementation head: `{implementation_head}`.
          - Robustness run/jobs: `{robustness_evidence}`.
          - Rust run/job: `{rust_evidence}`.
          - Android run/jobs: `{android_evidence}`.
          - Task 24 performance hardening is next. The independent Task 21 tuned-candidate activation gate remains open.
          '''
          if old not in text:
              raise SystemExit("Task 23 summary block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "- [ ] Miri, sanitizer, and fuzz gates.",
              "- [x] Miri, sanitizer, and fuzz gates.",
              1,
          )
          old_ops = '''1. Add Task 23.2 FEN, UCI-move, legal-sequence/unmake, repetition/history, weight, opening-book, and C-ABI fuzz targets.
          2. Preserve every minimized Task 23.2 failure under a documented corpus path as a named permanent regression before fixing it.
          3. Establish the Task 23.3 Miri/sanitizer/FFI lifecycle subset without weakening existing correctness gates.
          4. Independently, produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep the Task 21 gate open until a candidate passes and is explicitly activated.'''
          new_ops = '''1. Begin Task 24.1 with a reproducible baseline benchmark suite for attack generation, legal moves, make/unmake, hashing, evaluation, perft, fixed-node search, TT operations, cancellation latency, and FFI calls.
          2. Profile release perft and fixed-node search before making any optimization; record allocations and re-audit clone/string/trace exclusions.
          3. Define reference hardware, toolchain, variance, and non-flaky regression budgets before enabling any performance gate.
          4. Independently, produce a real tuned Task 21 candidate and run the existing 200-pair activation protocol; keep the Task 21 gate open until a candidate passes and is explicitly activated.'''
          if old_ops not in text:
              raise SystemExit("Immediate operations block not found")
          summary.write_text(text.replace(old_ops, new_ops, 1).rstrip() + "\n")

          status = Path("docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md")
          text = status.read_text()
          old_phase = "**Current phase:** Task 23.1 deterministic property testing complete; Task 23.2 fuzzing is next while the independent Task 21 activation gate remains open"
          new_phase = "**Current phase:** Task 23 robustness gate complete; Task 24 performance hardening is next while the independent Task 21 activation gate remains open"
          if old_phase not in text:
              raise SystemExit("Ralph phase text not found")
          text = text.replace(old_phase, new_phase, 1)
          row_marker = "| 23 / gate |"
          if row_marker not in text:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if line.startswith("| 23.1 |"):
                      lines.insert(
                          index + 1,
                          f"| 23 / gate | `{implementation_head}` | Robustness `{robustness_evidence}`; Rust `{rust_evidence}`; Android `{android_evidence}` | seven fuzz targets / 1,792 bounded runs, Miri, ASan/LSan, TSan, one minimized permanent C ABI regression found and fixed; complete gate green |",
                      )
                      break
              else:
                  raise SystemExit("Task 23.1 Ralph row not found")
              text = "\n".join(lines) + "\n"
          marker = "## Task 23 completion"
          if marker not in text:
              completion = f'''

          ## Task 23 completion

          Implemented and validated:

          - seven production-boundary mutation targets in an independent locked fuzz workspace;
          - deterministic seed corpora, stable success/rejection tests, and committed corpus replay;
          - 256 bounded mutations per target, 1,792 total per workflow run;
          - Miri strict-provenance core analysis;
          - AddressSanitizer plus LeakSanitizer over the complete C ABI lifecycle suite;
          - ThreadSanitizer over active cross-thread cancellation;
          - explicit CI enforcement that general Rust UBSan is unsupported, with Miri retained as the UB gate;
          - host-JVM and API-35 JNI lifecycle validation alongside native analysis;
          - documented permanent minimization policy under `fuzz/regressions/<target>/`;
          - one real minimized one-byte C ABI semantic counterexample, permanently retained and replayed before its production fix.

          Evidence:

          - helper-free implementation head: `{implementation_head}`;
          - robustness run/jobs: `{robustness_evidence}`;
          - Rust run/job: `{rust_evidence}`;
          - Android run/jobs: `{android_evidence}`;
          - contract: `docs/RUST_ROBUSTNESS_GATES.md`;
          - minimized regression: `fuzz/regressions/c_abi_buffers_handles/forged-buffer-wrong-token-type.bin`;
          - named replay: `fuzz/tests/regression_c_abi.rs`.

          Task 23 is complete. Task 24 performance hardening is next. The independent Task 21 activation gate remains open until a real tuned candidate passes the 200-pair protocol and is explicitly activated.
          '''
              text = text.rstrip() + completion + "\n"
          status.write_text(text.rstrip() + "\n")

          memory = Path("memory.md")
          current = memory.read_text()
          marker = "Task 23 robustness gate complete"
          if marker not in current:
              timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              entry = f'''

          ## {timestamp} - GPT-5.6 Thinking - Task 23 robustness gate complete
          - Added the independent `fuzz/` workspace, seven production-boundary libFuzzer targets, committed seed corpora and replay tests, `crates/chess-core/tests/miri_core.rs`, permanent `.github/workflows/robustness.yml`, and `docs/RUST_ROBUSTNESS_GATES.md`.
          - Exact helper-free implementation head `{implementation_head}` passed robustness run `{robustness_evidence}`, Rust run `{rust_evidence}`, and Android run `{android_evidence}`.
          - The permanent workflow executes 1,792 bounded mutations, Miri strict-provenance analysis, ASan/LeakSanitizer C ABI lifecycle analysis, TSan cancellation analysis, and an explicit unsupported-UBSan boundary check.
          - Fuzzing found one minimized one-byte semantic C ABI defect. Input `fuzz/regressions/c_abi_buffers_handles/forged-buffer-wrong-token-type.bin` is permanently retained with a named replay; production now returns documented `InvalidBuffer` for fabricated wrong-tag buffer tokens.
          - Task 23 is complete. Task 24 performance hardening is next; the independent Task 21 activation gate remains open.
          '''
              current = current.rstrip() + entry + "\n"
          memory.write_text(current.rstrip() + "\n")
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/RUST_CHESS_ENGINE_PORT_TODO_TASK_DEFINITIONS_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_TODO_2026-08-01.md \
            docs/RUST_CHESS_ENGINE_PORT_RALPH_STATUS.md \
            memory.md
          git diff --cached --check
          git commit -m "docs: close Task 23 robustness gate"
          git push origin HEAD:rust-engine

  fuzz-smoke:
    name: Fuzz smoke and corpus replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify fuzz workspace and corpus
        shell: bash
        run: |
          set -euo pipefail
          test -f fuzz/Cargo.toml
          test -f fuzz/Cargo.lock
          test -f fuzz/corpus/README.md
          test -f fuzz/regressions/README.md
          cargo generate-lockfile --manifest-path fuzz/Cargo.toml
          git diff --exit-code -- fuzz/Cargo.lock

      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Run strict fuzz Clippy
        run: >-
          cargo clippy --manifest-path fuzz/Cargo.toml --locked
          --lib --tests -- -D warnings

      - name: Run stable fuzz entrypoint tests and corpus replay
        run: >-
          cargo test --manifest-path fuzz/Cargo.toml --locked
          --lib --tests

      - name: Install current cargo-fuzz with stable Rust
        run: cargo +stable install cargo-fuzz --locked --version 0.13.2

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Run bounded libFuzzer campaigns
        env:
          RUSTFLAGS: -Adeprecated
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            fen_parser
            uci_move_parser
            legal_sequence
            game_history
            weight_parser
            opening_book_parser
            c_abi_buffers_handles
          )
          for target in "${targets[@]}"; do
            cargo +nightly fuzz run --features fuzzing "${target}" "fuzz/corpus/${target}" -- \
              -runs=256 -max_len=4096 -timeout=10
          done

  miri-core:
    name: Miri core subset
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: miri, rust-src

      - name: Prepare Miri
        run: cargo +nightly-2026-08-01 miri setup

      - name: Run Miri-compatible core tests
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: >-
          cargo +nightly-2026-08-01 miri test --locked
          -p chess-core --test miri_core

  native-sanitizers:
    name: Native sanitizers and leak checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly with instrumented standard library support
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: rust-src

      - name: Run AddressSanitizer and LeakSanitizer lifecycle tests
        env:
          RUSTFLAGS: -Zsanitizer=address -Adeprecated
          RUSTDOCFLAGS: -Zsanitizer=address -Adeprecated
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
        run: >-
          cargo +nightly-2026-08-01 test -Zbuild-std --locked
          --target x86_64-unknown-linux-gnu
          -p chess-ffi --test c_abi_lifecycle --all-features

      - name: Run ThreadSanitizer concurrent cancellation test
        env:
          RUSTFLAGS: -Zsanitizer=thread -Adeprecated
          RUSTDOCFLAGS: -Zsanitizer=thread -Adeprecated
          TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: >-
          cargo +nightly-2026-08-01 test -Zbuild-std --locked
          --target x86_64-unknown-linux-gnu
          -p chess-ffi --test c_abi_lifecycle --all-features
          active_infinite_search_cancels_from_another_thread -- --exact

      - name: Record unsupported UBSan boundary
        shell: bash
        run: |
          set -euo pipefail
          if rustc +nightly-2026-08-01 -Z help | grep -q 'sanitizer.*undefined'; then
            echo '::error::The documented UBSan support boundary is stale.'
            exit 1
          fi
          echo 'Rust nightly exposes no general undefined sanitizer mode; Miri is the UB gate.'
