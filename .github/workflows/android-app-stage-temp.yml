name: Android app staging

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  app-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Regenerate and inspect lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo generate-lockfile
          diff -u /tmp/Cargo.lock.before Cargo.lock || true
      - name: Format staged Rust sources
        run: cargo fmt --all
      - name: Check JNI bridge
        run: cargo check -p chess-jni --all-targets
      - name: Run strict JNI Clippy
        run: cargo clippy -p chess-jni --all-targets -- -D warnings
      - name: Run JNI bridge tests
        run: cargo test -p chess-jni app_bridge::tests -- --test-threads=1
      - name: Compile and test Android app
        run: >-
          gradle -p android-harness
          :android-app:testDebugUnitTest
          :android-app:lintDebug
          :android-app:assembleDebug
          :android-app:assembleDebugAndroidTest
          --no-daemon --stacktrace --console=plain
      - name: Upload staged outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-stage-output-${{ github.sha }}
          path: |
            Cargo.lock
            crates/chess-jni/src/app_bridge.rs
            crates/chess-jni/src/lib.rs
            android-harness/android-app/build/outputs/apk/debug/android-app-debug.apk
            android-harness/android-app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 1
