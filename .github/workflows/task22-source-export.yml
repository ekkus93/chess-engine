name: Task 22 source export

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task22-source-export.yml
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task22-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-engine
          fetch-depth: 0
      - name: Archive branch checkout
        run: tar -czf /tmp/chess-engine-rust-engine-with-git.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: task22-source-tree-with-git
          path: /tmp/chess-engine-rust-engine-with-git.tar.gz
          if-no-files-found: error
          retention-days: 1
