name: Task 22 source export

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/task22-source-export.yml
  push:
    branches:
      - rust-engine
    paths:
      - .github/workflows/task22-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: tar --exclude=.git -czf chess-engine-rust-engine.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: task22-source-tree
          path: chess-engine-rust-engine.tar.gz
          if-no-files-found: error
          retention-days: 1
