name: Android closure corrections Ralph

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/android-closure-corrections-ralph.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: android-closure-corrections-ralph
  cancel-in-progress: false

jobs:
  stage3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure repository writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run stage 3
        run: python3 .github/android_closure_corrections_ralph.py stage3
