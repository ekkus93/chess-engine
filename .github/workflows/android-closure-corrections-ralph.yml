name: Android closure corrections Ralph

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/android-closure-corrections-ralph.yml

permissions:
  contents: write

concurrency:
  group: android-closure-corrections-ralph
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure repository writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Finalize closure corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/android_closure_corrections_ralph.py')
          text = path.read_text()
          old = '''    git("status", "--short")
              validate_source()
              correct_parent()
              close_tracker()
              close_index()
              update_audit()
              remove_temporary_helpers()

              run("bash", "scripts/task_post_port_review_fix_audit.sh")'''.replace('              ', '    ')
          new = '''    git("status", "--short")
              correct_parent()
              close_tracker()
              close_index()
              update_audit()
              remove_temporary_helpers()

              run("bash", "scripts/task_post_port_review_fix_audit.sh")
              validate_source()'''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one finalizer ordering block')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/android_closure_corrections_ralph.py finalize 2>&1 | tee /tmp/closure-finalizer.log

      - name: Upload finalizer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-finalizer-${{ github.sha }}
          path: /tmp/closure-finalizer.log
          if-no-files-found: warn
