[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-game"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "textual>=8.2.7",
]

[project.optional-dependencies]
test = ["pytest"]
lint = [
    "mypy",
    "pylint",
    "ruff",
]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "pytest-asyncio>=0.23",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with 'not slow')",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
files = ["chess_game"]
warn_unused_configs = true

[tool.pylint.design]
# eval_weights.py dataclasses are intentional weight containers for Texel tuning;
# they naturally hold more attributes than the default limit.
max-attributes = 20
# Board has to_fen, from_fen, and other FEN helpers pushing it past the default 20.
max-public-methods = 22
# Complex search functions (minimax, quiescence) legitimately require more locals.
max-locals = 20
# quiescence() public API: board, alpha, beta, is_maximizing, context, depth_remaining.
max-args = 6

[tool.pylint.format]
# The search is split across ai.py and ai_search_*/ai_transposition/ai_quiescence_*
# modules; this generous ceiling covers the remaining heuristic-heavy files.
max-module-lines = 1200

[tool.pylint.basic]
# TODO is used for deferred correctness work (e.g. TT mate-score normalization).
notes = ["FIXME", "XXX"]

[tool.setuptools.packages.find]
include = ["chess_game*"]
namespaces = false

[tool.setuptools.package-data]
"chess_game.chess" = ["data/*.json"]
