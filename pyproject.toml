[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-game"
version = "0.1.0"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with 'not slow')",
]
