[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-game"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "textual>=8.2.7",
    "numpy>=1.26",
]

[project.scripts]
chess-uci = "chess_game.uci:uci_loop"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio>=0.23"]
lint = [
    "mypy==2.3.0",
    "pylint==4.0.6",
    "ruff==0.16.1",
]
dev = [
    "mypy==2.3.0",
    "pylint==4.0.6",
    "pytest",
    "pytest-asyncio>=0.23",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with 'not slow')",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep the enforced rule set stable across Ruff releases. These groups cover
# syntax/runtime errors, undefined or unused names, import ordering, Python 3.11
# modernization, and common bug patterns. Pure preference-only simplification
# and collection-construction rules are intentionally not release gates.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
extend-ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
files = ["chess_game"]
warn_unused_configs = true

[tool.pylint.design]
# eval_weights.py dataclasses are intentional weight containers for Texel tuning;
# they naturally hold more attributes than the default limit.
max-attributes = 20
# Board has to_fen, from_fen, and other FEN helpers pushing it past the default 20.
max-public-methods = 22
# Complex search functions (minimax, quiescence) legitimately require more locals.
max-locals = 20
# quiescence() public API: board, alpha, beta, is_maximizing, context, depth_remaining.
max-args = 6

[tool.pylint.format]
# Keep modules at one-concern size. Files that grew into 800-1300 line "hubs" were
# split (2026-06); this ceiling (enforced via the pylint 10.00/10 gate, and mirrored
# by tests/test_module_size_limit.py) fails the build if a module creeps back over it.
# Split the file into a helper/constants/types module rather than raising this.
max-module-lines = 800

[tool.pylint.basic]
# TODO is used for deferred correctness work (e.g. TT mate-score normalization).
notes = ["FIXME", "XXX"]

[tool.pylint.messages_control]
# These are presentation-only findings. The module-size, design, type, runtime,
# and correctness checks remain enabled. duplicate-code is a false positive for
# the intentionally mirrored package-level export lists.
disable = ["line-too-long", "missing-class-docstring", "duplicate-code"]

[tool.setuptools.packages.find]
include = ["chess_game*"]
namespaces = false

[tool.setuptools.package-data]
"chess_game.chess" = ["data/*.json"]
